name: Diagnose Preview CI guard
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Completed Preview CI job ID
        required: true
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Report previous comparison step
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[0-9]+$ ]]
          if gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > "$RUNNER_TEMP/job.log" 2> "$RUNNER_TEMP/fetch-error"; then
            python3 - "$RUNNER_TEMP/job.log" <<'PY'
          import pathlib,re,sys
          lines=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          # Only the comparison and guard steps; suppress any URLs and tokens.
          selected=[]; active=False
          for line in lines:
              if '##[group]Run set -euo pipefail' in line: active=False
              if 'test_signed_candidate_gate.py' in line: active=True
              if active and any(x.lower() in line.lower() for x in ('error','failed','failure','mismatch','different','differs','expired','not found','forbidden','http 4','http 5','protected','9016','artifact','sha256','traceback','exception','assert','no space','too many','bad zip','permission')):
                  line=re.sub(r'https?://\S+','[URL removed]',line)
                  line=re.sub(r'(?i)(token|authorization|signature|sig)=\S+',r'\1=[redacted]',line)
                  selected.append(line[-800:])
          text='\n'.join(selected[-45:]) or 'No filtered diagnostics found in the job log.'
          safe=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=Previous Preview guard diagnostic::'+safe)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as out: out.write('### Previous Preview guard diagnostic\n```\n'+text+'\n```\n')
          PY
          else
            echo '::error title=Previous Preview guard diagnostic::Unable to retrieve previous job log using the GitHub runner.'
            echo 'Previous job log could not be retrieved.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
