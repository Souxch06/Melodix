name: Test login-first session gate on Android
on:
  workflow_call:
    inputs:
      evidence_run:
        type: string
        default: "0"
      source_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Re-export existing synthetic captures without rebuilding the app
        type: string
        default: "0"
      source_ref:
        description: Full source SHA to build and test
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: inputs.evidence_run == '0'
    uses: ./.github/workflows/preview-apk.yml
    with:
      release_tag: v1.3.2-test.125-preview
      source_ref: ${{ inputs.source_ref }}
      build_only: true
      target_debuggable: true
      apk_suffix: '-session-instrumentation'
    secrets: inherit
  build-before:
    if: inputs.evidence_run == '0'
    uses: ./.github/workflows/preview-apk.yml
    with:
      release_tag: v1.3.2-test.124-preview
      source_ref: 5acef50b23f1c8d5968a43bea6995e28343d6790
      build_only: true
      target_debuggable: true
      apk_suffix: '-session-before'
    secrets: inherit
  android:
    needs: [build, build-before]
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
        form: [phone, tablet]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ matrix.variant == 'before' && needs.build-before.outputs.apk_name || needs.build.outputs.apk_name }}
          path: target-apk
      - name: Compile and sign synthetic session instrumentation
        env:
          MELODIX_PREVIEW_KEYSTORE_B64: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_B64 }}
          MELODIX_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
          MELODIX_PREVIEW_KEY_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEY_PASSWORD || secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          phase=checkout
          trap 'rc=$?; if (( rc != 0 )); then echo "::error title=Session instrumentation setup::phase=$phase exit=$rc"; fi; rm -f "$RUNNER_TEMP/session-signing.jks"' EXIT
          [[ "$(git rev-parse HEAD)" == '${{ inputs.source_ref }}' ]]
          phase=sdk
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          android_jar="$ANDROID_HOME/platforms/android-36/android.jar"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$RUNNER_TEMP/session-classes" "$RUNNER_TEMP/session-dex"
          phase=javac
          javac --release 8 -classpath "$android_jar" -d "$RUNNER_TEMP/session-classes" tests/android/SessionGateInstrumentation.java 2> "$RUNNER_TEMP/session-javac-errors.txt" || {
            while IFS= read -r line; do echo "::error title=Session instrumentation compiler::$line"; done < "$RUNNER_TEMP/session-javac-errors.txt"
            exit 1
          }
          mapfile -t classes < <(find "$RUNNER_TEMP/session-classes" -name '*.class')
          phase=dex
          "$tools/d8" --lib "$android_jar" --min-api 24 --output "$RUNNER_TEMP/session-dex" "${classes[@]}"
          mkdir -p "$RUNNER_TEMP/session-manifest"
          sed 's/HomeRenderInstrumentation/SessionGateInstrumentation/g' tests/android/AndroidManifest.xml > "$RUNNER_TEMP/session-manifest/AndroidManifest.xml"
          phase=manifest
          "$tools/aapt" package -f -M "$RUNNER_TEMP/session-manifest/AndroidManifest.xml" -I "$android_jar" \
            --min-sdk-version 24 --target-sdk-version 36 --version-code 1 --version-name session-fixture \
            -F "$RUNNER_TEMP/session-unsigned.apk" 2> "$RUNNER_TEMP/session-manifest-errors.txt" || {
            while IFS= read -r line; do echo "::error title=Session instrumentation manifest::$line"; done < "$RUNNER_TEMP/session-manifest-errors.txt"
            exit 1
          }
          (cd "$RUNNER_TEMP/session-dex" && zip -q "$RUNNER_TEMP/session-unsigned.apk" classes.dex)
          phase=align
          "$tools/zipalign" -f 4 "$RUNNER_TEMP/session-unsigned.apk" "$RUNNER_TEMP/session-aligned.apk"
          printf '%s' "$MELODIX_PREVIEW_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/session-signing.jks"
          phase=sign
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/session-signing.jks" --ks-key-alias MELODIX_PREVIEW \
            --ks-pass env:MELODIX_PREVIEW_KEYSTORE_PASSWORD --key-pass env:MELODIX_PREVIEW_KEY_PASSWORD \
            --out "$RUNNER_TEMP/session-test.apk" "$RUNNER_TEMP/session-aligned.apk"
          "$tools/apksigner" verify --verbose "$RUNNER_TEMP/session-test.apk"
          target="$(find target-apk -name '*.apk' | head -n 1)"
          [[ -s "$target" ]]
          "$tools/apksigner" verify --print-certs "$target" > "$RUNNER_TEMP/target-cert.txt"
          "$tools/apksigner" verify --print-certs "$RUNNER_TEMP/session-test.apk" > "$RUNNER_TEMP/test-cert.txt"
          phase=certificate-match
          diff <(grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/target-cert.txt") <(grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/test-cert.txt")
          phase=kvm
          sudo chmod 666 /dev/kvm
      - name: Execute actual native state decisions on fresh emulator (not Spotify authentication)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot'
          script: bash scripts/session_gate_emulator.sh '${{ matrix.variant }}' '${{ matrix.form }}'
      - name: Publish synthetic-only review thumbnails and bounded outcomes
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/evidence-py"
          "$RUNNER_TEMP/evidence-py/bin/pip" -q install pillow
          "$RUNNER_TEMP/evidence-py/bin/python" scripts/session_evidence_annotations.py session-evidence
      - name: Upload bounded synthetic-only test outcomes
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: session-gate-${{ matrix.variant }}-${{ matrix.form }}
          path: session-evidence/
          if-no-files-found: warn
  update-before:
    if: inputs.evidence_run == '0'
    uses: ./.github/workflows/preview-apk.yml
    with:
      release_tag: v1.3.2-test.137-preview
      source_ref: 2fb41959b4f7c7d7ef11f17d38bf601d02a75679
      build_only: true
      target_debuggable: true
      apk_suffix: '-update-before'
      version_code_base: 1021473
    secrets: inherit
  update-after:
    if: inputs.evidence_run == '0'
    uses: ./.github/workflows/preview-apk.yml
    with:
      release_tag: v1.3.2-test.138-preview
      source_ref: ${{ inputs.source_ref }}
      build_only: true
      target_debuggable: true
      apk_suffix: '-update-after'
      version_code_base: 1022473
    secrets: inherit
  update-persistence:
    needs: [update-before, update-after]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.update-before.outputs.apk_name }}
          path: update-before
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.update-after.outputs.apk_name }}
          path: update-after
      - name: Compile and sign synthetic update instrumentation
        env:
          MELODIX_PREVIEW_KEYSTORE_B64: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_B64 }}
          MELODIX_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
          MELODIX_PREVIEW_KEY_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEY_PASSWORD || secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/update-signing.jks"' EXIT
          [[ "$(git rev-parse HEAD)" == '${{ inputs.source_ref }}' ]]
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          jar="$ANDROID_HOME/platforms/android-36/android.jar"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$RUNNER_TEMP/update-classes" "$RUNNER_TEMP/update-dex" "$RUNNER_TEMP/update-manifest"
          javac --release 8 -classpath "$jar" -d "$RUNNER_TEMP/update-classes" tests/android/UpdatePersistenceInstrumentation.java
          mapfile -t classes < <(find "$RUNNER_TEMP/update-classes" -name '*.class')
          "$tools/d8" --lib "$jar" --min-api 24 --output "$RUNNER_TEMP/update-dex" "${classes[@]}"
          sed 's/HomeRenderInstrumentation/UpdatePersistenceInstrumentation/g' tests/android/AndroidManifest.xml > "$RUNNER_TEMP/update-manifest/AndroidManifest.xml"
          "$tools/aapt" package -f -M "$RUNNER_TEMP/update-manifest/AndroidManifest.xml" -I "$jar" --min-sdk-version 24 --target-sdk-version 36 --version-code 1 --version-name synthetic-update -F "$RUNNER_TEMP/update-unsigned.apk"
          (cd "$RUNNER_TEMP/update-dex" && zip -q "$RUNNER_TEMP/update-unsigned.apk" classes.dex)
          "$tools/zipalign" -f 4 "$RUNNER_TEMP/update-unsigned.apk" "$RUNNER_TEMP/update-aligned.apk"
          printf '%s' "$MELODIX_PREVIEW_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/update-signing.jks"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/update-signing.jks" --ks-key-alias MELODIX_PREVIEW --ks-pass env:MELODIX_PREVIEW_KEYSTORE_PASSWORD --key-pass env:MELODIX_PREVIEW_KEY_PASSWORD --out "$RUNNER_TEMP/update-test.apk" "$RUNNER_TEMP/update-aligned.apk"
          "$tools/apksigner" verify "$RUNNER_TEMP/update-test.apk"
          for item in update-before update-after; do
            apk="$(find "$item" -name '*.apk' -print -quit)"
            "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/$item-cert.txt"
            "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/$item-badging.txt"
            python3 scripts/verify_preview_update.py "$RUNNER_TEMP/$item-cert.txt" "$RUNNER_TEMP/$item-badging.txt"
          done
          old="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/update-before-badging.txt")"
          new="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/update-after-badging.txt")"
          (( new > old ))
          sudo chmod 666 /dev/kvm
      - name: Install older then newer synthetic APK without clearing data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot'
          script: bash scripts/update_persistence_emulator.sh
  evidence-review:
    if: inputs.evidence_run != '0'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
        form: [phone, tablet]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/download-artifact@v4.3.0
        with:
          name: session-gate-${{ matrix.variant }}-${{ matrix.form }}
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
          path: session-evidence
      - name: Prepare bounded synthetic review
        run: |
          python3 -m venv "$RUNNER_TEMP/evidence-py"
          "$RUNNER_TEMP/evidence-py/bin/pip" -q install pillow
          "$RUNNER_TEMP/evidence-py/bin/python" scripts/session_evidence_annotations.py session-evidence
      - name: Review phone-status
        run: '"$RUNNER_TEMP/evidence-py/bin/python" scripts/session_evidence_annotations.py session-evidence phone-status'
      - name: Review phone-details
        run: '"$RUNNER_TEMP/evidence-py/bin/python" scripts/session_evidence_annotations.py session-evidence phone-details'
      - name: Review tablet-status
        run: '"$RUNNER_TEMP/evidence-py/bin/python" scripts/session_evidence_annotations.py session-evidence tablet-status'
      - name: Review tablet-details
        run: '"$RUNNER_TEMP/evidence-py/bin/python" scripts/session_evidence_annotations.py session-evidence tablet-details'
      - name: Review keyboard-status
        run: '"$RUNNER_TEMP/evidence-py/bin/python" scripts/session_evidence_annotations.py session-evidence keyboard-status'
      - name: Review keyboard-details
        run: '"$RUNNER_TEMP/evidence-py/bin/python" scripts/session_evidence_annotations.py session-evidence keyboard-details'
      - name: Review small-large-font-status
        run: '"$RUNNER_TEMP/evidence-py/bin/python" scripts/session_evidence_annotations.py session-evidence small-large-font-status'
      - name: Review small-large-font-details
        run: '"$RUNNER_TEMP/evidence-py/bin/python" scripts/session_evidence_annotations.py session-evidence small-large-font-details'
      - name: Review bounded safe measurements
        run: '"$RUNNER_TEMP/evidence-py/bin/python" scripts/session_evidence_annotations.py session-evidence metrics'
