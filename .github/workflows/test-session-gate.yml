name: Test login-first session gate on Android
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full source SHA to build and test
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    uses: ./.github/workflows/preview-apk.yml
    with:
      release_tag: v1.3.2-test.125-preview
      source_ref: ${{ inputs.source_ref }}
      build_only: true
      target_debuggable: true
      apk_suffix: '-session-instrumentation'
    secrets: inherit
  build-before:
    uses: ./.github/workflows/preview-apk.yml
    with:
      release_tag: v1.3.2-test.124-preview
      source_ref: 5acef50b23f1c8d5968a43bea6995e28343d6790
      build_only: true
      target_debuggable: true
      apk_suffix: '-session-before'
    secrets: inherit
  android:
    needs: [build, build-before]
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
        form: [phone, tablet]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ matrix.variant == 'before' && needs.build-before.outputs.apk_name || needs.build.outputs.apk_name }}
          path: target-apk
      - name: Compile and sign synthetic session instrumentation
        env:
          MELODIX_PREVIEW_KEYSTORE_B64: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_B64 }}
          MELODIX_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
          MELODIX_PREVIEW_KEY_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEY_PASSWORD || secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          phase=checkout
          trap 'rc=$?; if (( rc != 0 )); then echo "::error title=Session instrumentation setup::phase=$phase exit=$rc"; fi; rm -f "$RUNNER_TEMP/session-signing.jks"' EXIT
          [[ "$(git rev-parse HEAD)" == '${{ inputs.source_ref }}' ]]
          phase=sdk
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          android_jar="$ANDROID_HOME/platforms/android-36/android.jar"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$RUNNER_TEMP/session-classes" "$RUNNER_TEMP/session-dex"
          phase=javac
          javac --release 8 -classpath "$android_jar" -d "$RUNNER_TEMP/session-classes" tests/android/SessionGateInstrumentation.java 2> "$RUNNER_TEMP/session-javac-errors.txt" || {
            while IFS= read -r line; do echo "::error title=Session instrumentation compiler::$line"; done < "$RUNNER_TEMP/session-javac-errors.txt"
            exit 1
          }
          mapfile -t classes < <(find "$RUNNER_TEMP/session-classes" -name '*.class')
          phase=dex
          "$tools/d8" --lib "$android_jar" --min-api 24 --output "$RUNNER_TEMP/session-dex" "${classes[@]}"
          mkdir -p "$RUNNER_TEMP/session-manifest"
          sed 's/HomeRenderInstrumentation/SessionGateInstrumentation/g' tests/android/AndroidManifest.xml > "$RUNNER_TEMP/session-manifest/AndroidManifest.xml"
          phase=manifest
          "$tools/aapt" package -f -M "$RUNNER_TEMP/session-manifest/AndroidManifest.xml" -I "$android_jar" \
            --min-sdk-version 24 --target-sdk-version 36 --version-code 1 --version-name session-fixture \
            -F "$RUNNER_TEMP/session-unsigned.apk" 2> "$RUNNER_TEMP/session-manifest-errors.txt" || {
            while IFS= read -r line; do echo "::error title=Session instrumentation manifest::$line"; done < "$RUNNER_TEMP/session-manifest-errors.txt"
            exit 1
          }
          (cd "$RUNNER_TEMP/session-dex" && zip -q "$RUNNER_TEMP/session-unsigned.apk" classes.dex)
          phase=align
          "$tools/zipalign" -f 4 "$RUNNER_TEMP/session-unsigned.apk" "$RUNNER_TEMP/session-aligned.apk"
          printf '%s' "$MELODIX_PREVIEW_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/session-signing.jks"
          phase=sign
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/session-signing.jks" --ks-key-alias MELODIX_PREVIEW \
            --ks-pass env:MELODIX_PREVIEW_KEYSTORE_PASSWORD --key-pass env:MELODIX_PREVIEW_KEY_PASSWORD \
            --out "$RUNNER_TEMP/session-test.apk" "$RUNNER_TEMP/session-aligned.apk"
          "$tools/apksigner" verify --verbose "$RUNNER_TEMP/session-test.apk"
          target="$(find target-apk -name '*.apk' | head -n 1)"
          [[ -s "$target" ]]
          "$tools/apksigner" verify --print-certs "$target" > "$RUNNER_TEMP/target-cert.txt"
          "$tools/apksigner" verify --print-certs "$RUNNER_TEMP/session-test.apk" > "$RUNNER_TEMP/test-cert.txt"
          phase=certificate-match
          diff <(grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/target-cert.txt") <(grep '^Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/test-cert.txt")
          phase=kvm
          sudo chmod 666 /dev/kvm
      - name: Execute actual native state decisions on fresh emulator (not Spotify authentication)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot'
          script: |
            set -euo pipefail
            mkdir -p session-evidence
            adb install -r "$(find target-apk -name '*.apk' | head -n 1)"
            adb install -r "$RUNNER_TEMP/session-test.apk"
            adb shell pm grant com.melodix.music.preview android.permission.POST_NOTIFICATIONS
            adb shell pm grant com.melodix.music.preview android.permission.BLUETOOTH_CONNECT
            if [[ '${{ matrix.form }}' == tablet ]]; then adb shell wm size 1920x1200; adb shell wm density 160; else adb shell wm size 1080x1920; adb shell wm density 420; fi
            if [[ '${{ matrix.variant }}' == after && '${{ matrix.form }}' == phone ]]; then
              timeout 240s adb shell am instrument -w -r com.melodix.music.preview.test/com.melodix.test.SessionGateInstrumentation > session-evidence/result.txt
              cat session-evidence/result.txt
              grep -Fq 'INSTRUMENTATION_RESULT: overall=passed' session-evidence/result.txt
            fi
            baseline=false
            if [[ '${{ matrix.variant }}' == before ]]; then baseline=true; fi
            capture() {
              name="$1"; shift
              adb shell am force-stop com.melodix.music.preview
              adb shell dumpsys gfxinfo com.melodix.music.preview reset > /dev/null
              timeout 90s adb shell am instrument -w -r -e capture_only true -e baseline "$baseline" "$@" com.melodix.music.preview.test/com.melodix.test.SessionGateInstrumentation > "session-evidence/$name.txt"
              cat "session-evidence/$name.txt"
              grep -Fq 'INSTRUMENTATION_RESULT: overall=passed' "session-evidence/$name.txt"
              adb exec-out run-as com.melodix.music.preview cat files/session-captures/status.png > "session-evidence/$name-status.png"
              if [[ "$baseline" == false ]]; then adb exec-out run-as com.melodix.music.preview cat files/session-captures/details.png > "session-evidence/$name-details.png"; fi
              adb shell dumpsys gfxinfo com.melodix.music.preview | grep -E 'Total frames rendered:|Janky frames:|50th percentile:|90th percentile:|95th percentile:|99th percentile:|Number Missed Vsync:' > "session-evidence/$name-perf.txt" || true
            }
            capture '${{ matrix.form }}'
            if [[ '${{ matrix.variant }}' == after && '${{ matrix.form }}' == phone ]]; then
              adb shell wm size 1080x1000
              adb shell settings put system font_scale 1.6
              capture small-large-font
              adb shell wm size 1080x1920
              adb shell settings put system font_scale 1.0
              capture keyboard -e keyboard true
            fi
            adb logcat -d -v brief -s MDXPERF:I | grep -E 'sid=[0-9a-f]{8} t=[0-9]+ session-state from=[a-z-]+ state=[a-z-]+ reason=[a-z-]+$' > session-evidence/mdxperf.txt || true
            adb logcat -d -v brief -s AndroidRuntime:E | python3 -c 'import re,sys; t=sys.stdin.read(); names=sorted(set(re.findall(r"(?:[A-Za-z_$][\w$]*\.)*[A-Za-z_$][\w$]*(?:Exception|Error)",t))); [print("::error title=Session Android runtime::exception_class="+n) for n in names[:12]]'
      - name: Upload bounded synthetic-only test outcomes
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: session-gate-${{ matrix.variant }}-${{ matrix.form }}
          path: session-evidence/
          if-no-files-found: warn
