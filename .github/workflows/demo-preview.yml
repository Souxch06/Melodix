name: Build and capture offline demo preview
on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      evidence_run:
        required: false
        type: string
        default: "0"
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Existing demo run to inspect without another APK build
        required: false
        type: string
        default: "0"
      source_ref:
        description: Full commit SHA to build and validate
        required: true
        type: string
      release_tag:
        description: Build-only preview artifact name
        required: true
        type: string
        default: v1.2.2-test.149-preview
permissions:
  contents: read
  actions: read
jobs:
  suite:
    if: inputs.evidence_run == '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2
      - run: npm ci
      - name: Run the complete suite before building any preview
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/demo-suite.tap"
          if grep -Eq '^# skipped [1-9][0-9]*$' "$RUNNER_TEMP/demo-suite.tap"; then
            echo "::error::Preview blocked because the suite skipped tests."
            exit 1
          fi
          grep -qx '# fail 0' "$RUNNER_TEMP/demo-suite.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/demo-suite.tap"
  build:
    needs: suite
    if: inputs.evidence_run == '0'
    uses: ./.github/workflows/preview-apk.yml
    with:
      source_ref: ${{ inputs.source_ref }}
      release_tag: ${{ inputs.release_tag }}
      build_only: true
      demo_build: true
      version_code_base: 1021285
    secrets: inherit
  capture:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [phone, tablet]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: target-apk
      - run: sudo chmod 666 /dev/kvm
      - name: Install the exact preview and capture offline demo screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot'
          script: bash scripts/run_demo_capture.sh "target-apk/${{ needs.build.outputs.apk_name }}" "${{ matrix.profile }}"
      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: demo-captures-${{ matrix.profile }}
          path: captures/${{ matrix.profile }}
          if-no-files-found: warn
  bundle:
    needs: [build, capture]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: bundle
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: demo-captures-*
          path: bundle/captures
      - name: Verify and package all captures alongside the exact APK
        shell: bash
        run: |
          set -euo pipefail
          for p in phone tablet; do
            for screen in accueil recherche bibliotheque playlist reglages lecteur mini-lecteur; do
              test -s "bundle/captures/demo-captures-$p/$screen.png"
            done
          done
          cp docs/audits/partie-b-etat-provisoire.md bundle/specification-vs-realise.md
          sha256sum "bundle/${{ needs.build.outputs.apk_name }}" > bundle/SHA256SUMS.txt
          echo "source=${{ inputs.source_ref }}" > bundle/build-info.txt
          echo "versionCode=${{ needs.build.outputs.version_code }}" >> bundle/build-info.txt
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: Melodix-demo-preview-with-captures
          path: bundle
          if-no-files-found: error
          retention-days: 14

  validate-captures:
    if: inputs.evidence_run != '0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: Melodix-demo-preview-with-captures
          path: bundle
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
      - name: Verify actual screenshot dimensions
        run: |
          python3 - <<'PY'
          import pathlib, struct
          for profile in ('phone','tablet'):
              for screen in ('accueil','recherche','bibliotheque','playlist','reglages','lecteur','mini-lecteur'):
                  p=pathlib.Path('bundle/captures/demo-captures-'+profile)/(screen+'.png')
                  data=p.read_bytes()
                  assert data[:8]==b'\x89PNG\r\n\x1a\n',p
                  w,h=struct.unpack('>II',data[16:24])
                  assert (w<h if profile=='phone' else w>h),(str(p),w,h)
                  print(f'::notice title=Demo screenshot::{profile}/{screen}={w}x{h}')
          PY
