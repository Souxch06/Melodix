name: Replay existing demo APK without rebuilding
# Diagnostic and screenshot replay are manual only; a normal push does not run them.
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  replay:
    # Diagnostic evidence is non-blocking; inspect the actual step outcomes.
    continue-on-error: true
    name: Replay the same Preview APK on a fresh offline phone
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: actions/download-artifact@v4.3.0
        with:
          name: Melodix-Preview-v1.2.2-test154.apk
          run-id: 42997630197
          github-token: ${{ github.token }}
          path: target-apk
      - run: sudo chmod 666 /dev/kvm
      - name: Replay without rebuilding or publishing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot'
          script: sh scripts/replay_existing_apk.sh
  capture:
    # Diagnostic evidence is non-blocking; inspect the actual step outcomes.
    continue-on-error: true
    name: Capture existing Preview on ${{ matrix.profile }}
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [phone, tablet, small]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: actions/download-artifact@v4.3.0
        with:
          name: Melodix-Preview-v1.2.2-test154.apk
          run-id: 42997630197
          github-token: ${{ github.token }}
          path: target-apk
      - run: sudo chmod 666 /dev/kvm
      - name: Capture the already-built APK without publishing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot'
          script: bash scripts/replay_demo_capture.sh ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: existing-demo-captures-${{ matrix.profile }}
          path: captures/${{ matrix.profile }}
          if-no-files-found: warn
          retention-days: 14
  bundle:
    # Diagnostic evidence is non-blocking; inspect the actual step outcomes.
    continue-on-error: true
    name: Bundle the same APK and verified screenshots
    needs: capture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: Melodix-Preview-v1.2.2-test154.apk
          run-id: 42997630197
          github-token: ${{ github.token }}
          path: bundle
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: existing-demo-captures-*
          path: bundle/captures
      - name: Require each real capture and verify APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find bundle -maxdepth 1 -name '*.apk' -print -quit)
          test -s "$apk"
          echo '54231b677bc382f608f67c1bd5f8ff8409c34b76620fc4bdc2fb4b2f67364066  '"$apk" | sha256sum -c -
          for p in phone tablet small; do
            for screen in accueil recherche bibliotheque playlist reglages lecteur mini-lecteur reglages-test-entree entree-reglages; do
              test -s "bundle/captures/existing-demo-captures-$p/$screen.png"
            done
            for screen in etat-observe session-entree-demo demo-depuis-session retour-session; do
              test -s "bundle/captures/existing-demo-captures-$p/real-no-session/$screen.png"
            done
            test -s "bundle/captures/existing-demo-captures-$p/real-no-session/observation.json"
          done
          echo 'APK source commit: 5805a88c793725bce3cb155d9fb576f2c6c97f2a' > bundle/source.txt
          echo "Capture scripts commit: $GITHUB_SHA" >> bundle/source.txt
          sha256sum "$apk" > bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: Melodix-Preview-test154-with-verified-captures
          path: bundle
          if-no-files-found: error
          retention-days: 14
