name: Capture preview launch trace on emulator

# workflow_dispatch needs the file on the default branch, which this branch must
# not touch. A push whose message carries the marker runs the capture instead.
on:
  push:

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  launch-trace:
    name: Launch published preview and capture the fatal trace
    if: contains(github.event.head_commit.message, '[launch-trace]')
    # ubuntu-latest migrates to Ubuntu 26, where the emulator/adb pair failed
    # twice with exit code 224. Pin the image the emulator is known to work on.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Download the preview APK for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          # Preview builds are [skip-release] (never published), so prefer the
          # workflow artifact built for this exact SHA. The build workflow runs
          # in parallel on the same push: wait for it to conclude first.
          run_id=""
          for i in $(seq 1 70); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow 'Build Melodix Preview APK' --limit 15 \
              --json databaseId,headSha,status \
              --jq '[.[] | select(.headSha=="'"$GITHUB_SHA"'" and .status=="completed")] | .[0].databaseId' 2>/dev/null || true)"
            if [[ -n "$run_id" && "$run_id" != "null" ]]; then
              conclusion="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion 2>/dev/null || true)"
              echo "build run $run_id conclusion=$conclusion"
              if [[ "$conclusion" == "success" ]]; then break; fi
              if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" ]]; then
                echo "::error::Build run $run_id concluded $conclusion."
                exit 1
              fi
            fi
            sleep 15
          done
          if [[ -n "$run_id" && "$run_id" != "null" ]]; then
            echo "Downloading artifact of build run $run_id"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --pattern 'Melodix-Preview-*' --dir "$RUNNER_TEMP/apk" || true
          fi
          apk_file="$(find "$RUNNER_TEMP/apk" -name 'Melodix-Preview-*.apk' | head -n 1)"
          if [[ -z "$apk_file" ]]; then
            # Fallback: 'tag=v1.2.2-test.N-preview' in the commit message,
            # otherwise the newest published pre-release.
            tag="$(printf '%s' "$EVENT_COMMIT_MESSAGE" | sed -n 's/.*tag=\(v[0-9][0-9.]*-test\.[0-9]*-preview\).*/\1/p' | head -n 1)"
            if [[ -z "$tag" ]]; then
              tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
                | grep -i pre-release | head -n 1 | cut -f2)"
            fi
            if [[ -z "$tag" ]]; then
              echo "::error::No preview APK artifact for $GITHUB_SHA and no published pre-release."
              exit 1
            fi
            echo "Falling back to published preview: $tag"
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'Melodix-Preview-*.apk' \
              --dir "$RUNNER_TEMP/apk"
            apk_file="$(ls "$RUNNER_TEMP/apk"/Melodix-Preview-*.apk | head -n 1)"
            echo "RELEASE_REF=$tag" >> "$GITHUB_ENV"
          fi
          echo "APK_PATH=$apk_file" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/apk"

      - name: Allow KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTION+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::/dev/kvm is not available, falling back to software emulation"

      - name: Install, launch and collect the trace
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/preview-launch-trace.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-launch-trace
          path: ${{ runner.temp }}/state/
          if-no-files-found: warn
