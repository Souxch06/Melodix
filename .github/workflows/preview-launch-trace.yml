name: Capture preview launch trace on emulator

# workflow_dispatch needs the file on the default branch, which this branch must
# not touch. A push whose message carries the marker runs the capture instead.
on:
  push:

permissions:
  contents: write
  issues: write

jobs:
  launch-trace:
    name: Launch published preview and capture the fatal trace
    if: contains(github.event.head_commit.message, '[launch-trace]')
    # ubuntu-latest migrates to Ubuntu 26, where the emulator/adb pair failed
    # twice with exit code 224. Pin the image the emulator is known to work on.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Download the published preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          # The APK workflow runs on the same push: wait until the release it
          # publishes advertises this very commit, then download that APK.
          body="$RUNNER_TEMP/release-body.txt"
          for _ in $(seq 1 60); do
            gh release view v1.2.2-test.1-preview --repo "$GITHUB_REPOSITORY" \
              --json body --jq .body > "$body" 2>/dev/null || true
            if grep -Fq "$GITHUB_SHA" "$body"; then break; fi
            sleep 15
          done
          if ! grep -Fq "$GITHUB_SHA" "$body"; then
            echo "::error::The published preview release does not reference $GITHUB_SHA."
            exit 1
          fi
          gh release download v1.2.2-test.1-preview \
            --repo "$GITHUB_REPOSITORY" \
            --pattern Melodix-Preview-v1.2.2-test1.apk \
            --dir "$RUNNER_TEMP/apk"
          echo "RELEASE_REF=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "APK_PATH=$RUNNER_TEMP/apk/Melodix-Preview-v1.2.2-test1.apk" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/apk"

      - name: Allow KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTION+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::/dev/kvm is not available, falling back to software emulation"

      - name: Install, launch and collect the trace
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 1200
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash scripts/preview-launch-trace.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-launch-trace
          path: ${{ runner.temp }}/state/
          if-no-files-found: warn
