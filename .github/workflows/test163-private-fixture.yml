name: Test163 disposable private UI reset fixture
on:
  workflow_call:
permissions:
  contents: read
jobs:
  fixture:
    name: Synthetic Android reset and stale-payload fixture (not production shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - run: sudo chmod 666 /dev/kvm
      - name: Assemble disposable fixtures and exercise copied production Smali
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot'
          script: bash scripts/run_test163_private_fixture.sh
