name: P0 display ownership phone/tablet comparison

# Opt-in only. This workflow never publishes a Preview release or preview page.
# It builds one debuggable, build-only APK, verifies its provenance, runs the
# same APK on phone and tablet Android 16 profiles, and aggregates only strict
# redacted sidecars with scripts/aggregate_p0_display_ownership.py.
on:
  # TEMPORARY registration bootstrap. GitHub only exposes a workflow to
  # workflow_dispatch once the file is on the default branch OR the workflow has
  # at least one prior run (cli/cli#9781). This push trigger is scoped to this
  # file on the session branch and exists only to create that first run. Every
  # job below is guarded by github.event_name == 'workflow_dispatch', so a push
  # run skips all five jobs and executes nothing. It is removed in the next
  # commit, restoring the manual-only contract.
  push:
    branches: [arena/6b935c3e-melodix]
    paths: ['.github/workflows/p0-display-ownership.yml']
  workflow_dispatch:
    inputs:
      enabled:
        description: Explicit opt-in; the comparison stays disabled unless this is true
        required: true
        type: boolean
        default: false
      source_ref:
        description: Full 40-character source commit SHA to build and compare
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  # Real Android compilation of the instrumentation harness. This is the only
  # step that can prove the Java actually builds against the SDK; a syntax
  # parse (javalang) is NOT a compilation and is never reported as one.
  # No signing secret is needed here.
  compile-display-harness:
    if: github.event_name == 'workflow_dispatch' && inputs.enabled == true
    name: Compile the instrumentation harness against the real Android SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out current diagnostic tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install android-36 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0" "platforms;android-36"
          [[ -s "$ANDROID_HOME/platforms/android-36/android.jar" ]] || { echo "::error::android-36 android.jar is missing."; exit 1; }
          [[ -x "$ANDROID_HOME/build-tools/35.0.0/d8" ]] || { echo "::error::build-tools 35.0.0 d8 is missing."; exit 1; }

      - name: Compile, lint and dex the harness with javac and d8
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/tooling"
          android_jar="$ANDROID_HOME/platforms/android-36/android.jar"
          mkdir -p "$RUNNER_TEMP/harness-classes" "$RUNNER_TEMP/harness-dex"
          # -Xlint:all surfaces unchecked/deprecation/API issues. It is not
          # -Werror: android-36 legitimately deprecates Display.getRealMetrics,
          # which the read-only device metrics still use on purpose.
          javac --release 8 -Xlint:all \
            -classpath "$android_jar" \
            -d "$RUNNER_TEMP/harness-classes" \
            tests/android/HomeRenderInstrumentation.java
          class_file="$RUNNER_TEMP/harness-classes/com/melodix/test/HomeRenderInstrumentation.class"
          [[ -s "$class_file" ]] || { echo "::error::javac produced no instrumentation class."; exit 1; }
          # Verify the real compiled signatures, not just that javac exited 0.
          javap -p -classpath "$RUNNER_TEMP/harness-classes" com.melodix.test.HomeRenderInstrumentation \
            > "$RUNNER_TEMP/harness-signatures.txt"
          for signature in \
            "runDisplayOwnershipComparison" \
            "inspectDisplayOwnershipCheckpoint" \
            "completeDisplayOwnershipWebCenter" \
            "displayOwnershipWebCenterCategory" \
            "evaluateJavascriptWithDeadline" \
            "displayOwnershipDeviceMetrics"; do
            grep -Fq "$signature" "$RUNNER_TEMP/harness-signatures.txt" \
              || { echo "::error::compiled harness is missing $signature."; exit 1; }
          done
          mapfile -t classes < <(find "$RUNNER_TEMP/harness-classes" -name '*.class' -print)
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$android_jar" --min-api 24 \
            --output "$RUNNER_TEMP/harness-dex" "${classes[@]}"
          [[ -s "$RUNNER_TEMP/harness-dex/classes.dex" ]] || { echo "::error::d8 produced no dex."; exit 1; }
          echo "::notice title=P0 display harness compiled::javac=ok; lint=all; signatures=verified; d8=min-api-24; real_android_compilation=true"

  build-display-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.enabled == true
    name: Build one build-only debuggable APK for both profiles
    uses: ./.github/workflows/preview-apk.yml
    with:
      release_tag: v1.2.2-test.96-preview
      source_ref: ${{ inputs.source_ref }}
      build_only: true
      target_debuggable: true
      apk_suffix: -display-ownership
    secrets: inherit

  prepare-display-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.enabled == true
    name: Verify APK provenance and build the matching signed harness
    needs: [build-display-apk, compile-display-harness]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      apk_sha256: ${{ steps.provenance.outputs.apk_sha256 }}
      signer_sha256: ${{ steps.provenance.outputs.signer_sha256 }}
      version_code: ${{ steps.provenance.outputs.version_code }}
      version_name: ${{ steps.provenance.outputs.version_name }}
      harness_sha256: ${{ steps.harness.outputs.harness_sha256 }}
    steps:
      - name: Validate the explicit opt-in request
        shell: bash
        env:
          ENABLED: ${{ inputs.enabled }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          [[ "${ENABLED,,}" == "true" ]] || { echo "::error::P0 display comparison is disabled unless enabled=true."; exit 1; }
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_ref must be a full lowercase commit SHA."; exit 1; }
          echo "::notice title=P0 display comparison request::enabled=true; source=$SOURCE_REF; publication=disabled"

      - name: Check out current diagnostic tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling

      - name: Check out the exact APK source under test
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          path: source-under-test

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and build tools
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0" "platforms;android-36"
          [[ -x "$ANDROID_HOME/build-tools/35.0.0/aapt" && -s "$ANDROID_HOME/platforms/android-36/android.jar" ]] || {
            echo "::error::Required Android build tools were not installed."
            exit 1
          }

      - name: Download the same-run display APK artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.build-display-apk.outputs.apk_name }}
          path: ${{ runner.temp }}/melodix-display-apk

      - name: Verify the exact APK hash, source, signature, debuggable flag, and assets
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          APK_NAME: ${{ needs.build-display-apk.outputs.apk_name }}
          VERSION_CODE: ${{ needs.build-display-apk.outputs.version_code }}
          SOURCE_ROOT: ${{ github.workspace }}/source-under-test
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tooling/scripts/p0_display_verify_apk.sh" \
            "$RUNNER_TEMP/melodix-display-apk" \
            "$APK_NAME" \
            "$SOURCE_REF" \
            "$VERSION_CODE" \
            "1.2.2-${SOURCE_REF:0:7}" \
            "$RUNNER_TEMP/melodix-display-provenance/provenance.json"

      - name: Read verified APK provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/melodix-display-provenance/provenance.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          out = pathlib.Path(sys.argv[2])
          with out.open("a", encoding="utf-8") as stream:
              for key in ("apk_sha256", "signer_sha256", "version_code", "version_name"):
                  stream.write(f"{key}={report[key]}\n")
          PY

      - name: Build the matching signed test-only harness
        id: harness
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          APK_NAME: ${{ needs.build-display-apk.outputs.apk_name }}
          VERSION_CODE: ${{ steps.provenance.outputs.version_code }}
          VERSION_NAME: ${{ steps.provenance.outputs.version_name }}
          SIGNER_SHA256: ${{ steps.provenance.outputs.signer_sha256 }}
          MELODIX_PREVIEW_KEYSTORE_B64: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_B64 }}
          MELODIX_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
          MELODIX_PREVIEW_KEY_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEY_PASSWORD || secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tooling/scripts/p0_display_build_harness.sh" \
            "$GITHUB_WORKSPACE/tooling" \
            "$RUNNER_TEMP/melodix-display-apk/$APK_NAME" \
            "$VERSION_CODE" \
            "$VERSION_NAME" \
            "$SIGNER_SHA256" \
            "$RUNNER_TEMP/melodix-display-harness"
          harness_sha256="$(sha256sum "$RUNNER_TEMP/melodix-display-harness/melodix-display-harness.apk" | awk '{print $1}')"
          echo "harness_sha256=$harness_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the verified harness and provenance for both profiles
        uses: actions/upload-artifact@v4
        with:
          name: melodix-display-tooling-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/melodix-display-harness/melodix-display-harness.apk
            ${{ runner.temp }}/melodix-display-provenance/provenance.json
          retention-days: 1
          if-no-files-found: error

  capture-display-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.enabled == true
    name: Capture ${{ matrix.profile }} display ownership at launch-relative checkpoints
    needs: [build-display-apk, prepare-display-comparison]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile: [phone, tablet]
    steps:
      - name: Validate the explicit opt-in request
        shell: bash
        env:
          ENABLED: ${{ inputs.enabled }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          [[ "${ENABLED,,}" == "true" ]] || { echo "::error::P0 display comparison is disabled unless enabled=true."; exit 1; }
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_ref must be a full lowercase commit SHA."; exit 1; }
          [[ "$PROFILE" == "phone" || "$PROFILE" == "tablet" ]] || { echo "::error::unexpected profile."; exit 1; }

      - name: Check out current diagnostic tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling

      - name: Check out the exact APK source under test
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          path: source-under-test

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and emulator
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 16 emulator and inspection tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || { echo "::error::Expected an x86_64 emulator host."; exit 1; }
          system_image="system-images;android-36;google_apis;x86_64"
          sdkmanager --install "platform-tools" "emulator" "build-tools;35.0.0" "platforms;android-36" "$system_image"
          [[ -x "$ANDROID_HOME/platform-tools/adb" && -x "$ANDROID_HOME/emulator/emulator" && -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]] || {
            echo "::error::Required Android emulator tools were not installed."
            exit 1
          }

      - name: Download the same-run display APK artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: ${{ needs.build-display-apk.outputs.apk_name }}
          path: ${{ runner.temp }}/melodix-display-apk

      - name: Download the verified harness and provenance
        uses: actions/download-artifact@v4.3.0
        with:
          name: melodix-display-tooling-${{ github.run_id }}
          path: ${{ runner.temp }}/melodix-display-tooling

      - name: Re-verify the exact APK and harness before installing anything
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          APK_NAME: ${{ needs.build-display-apk.outputs.apk_name }}
          EXPECTED_APK_SHA256: ${{ needs.prepare-display-comparison.outputs.apk_sha256 }}
          EXPECTED_SIGNER_SHA256: ${{ needs.prepare-display-comparison.outputs.signer_sha256 }}
          EXPECTED_VERSION_CODE: ${{ needs.prepare-display-comparison.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ needs.prepare-display-comparison.outputs.version_name }}
          EXPECTED_HARNESS_SHA256: ${{ needs.prepare-display-comparison.outputs.harness_sha256 }}
          SOURCE_ROOT: ${{ github.workspace }}/source-under-test
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tooling/scripts/p0_display_verify_apk.sh" \
            "$RUNNER_TEMP/melodix-display-apk" \
            "$APK_NAME" \
            "$SOURCE_REF" \
            "$EXPECTED_VERSION_CODE" \
            "$EXPECTED_VERSION_NAME" \
            "$RUNNER_TEMP/melodix-display-profile-provenance.json"
          python3 - "$RUNNER_TEMP/melodix-display-profile-provenance.json" "$RUNNER_TEMP/melodix-display-tooling/provenance.json" <<'PY'
          import json
          import pathlib
          import sys

          left = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          right = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          if left != right:
              raise SystemExit("profile APK provenance does not match the prepared provenance")
          PY
          actual_harness_sha256="$(sha256sum "$RUNNER_TEMP/melodix-display-tooling/melodix-display-harness.apk" | awk '{print $1}')"
          [[ "$actual_harness_sha256" == "$EXPECTED_HARNESS_SHA256" ]] || { echo "::error::harness SHA-256 mismatch."; exit 1; }
          [[ "${{ needs.prepare-display-comparison.outputs.apk_sha256 }}" == "$EXPECTED_APK_SHA256" ]] || { echo "::error::prepared APK SHA-256 mismatch."; exit 1; }
          [[ "${{ needs.prepare-display-comparison.outputs.signer_sha256 }}" == "$EXPECTED_SIGNER_SHA256" ]] || { echo "::error::prepared signer mismatch."; exit 1; }

      - name: Boot the clean profile AVD and capture only the strict redacted sidecar
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          SOURCE_REF: ${{ inputs.source_ref }}
          APK_NAME: ${{ needs.build-display-apk.outputs.apk_name }}
          APK_SHA256: ${{ needs.prepare-display-comparison.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$PROFILE" == "phone" ]]; then avd_name="MelodixDisplayPhone"; else avd_name="MelodixDisplayTablet"; fi
          avd_state="$RUNNER_TEMP/melodix-display-avd-$PROFILE"
          # Keep the emulator and instrumentation in the same runner step so the
          # background emulator cannot be reaped between steps before capture.
          # The boot script persists PID/serial/deadlines in $avd_state, which the
          # instrumentation script reads to check liveness before/during/after.
          bash "$GITHUB_WORKSPACE/tooling/scripts/p0_display_boot_avd.sh" \
            "$PROFILE" "$avd_name" "system-images;android-36;google_apis;x86_64" "$avd_state"
          P0_DISPLAY_AVD_STATE_DIR="$avd_state" \
          bash "$GITHUB_WORKSPACE/tooling/scripts/p0_display_run_profile.sh" \
            "$PROFILE" \
            "$RUNNER_TEMP/melodix-display-apk/$APK_NAME" \
            "$RUNNER_TEMP/melodix-display-tooling/melodix-display-harness.apk" \
            "$SOURCE_REF" \
            "${{ github.run_id }}" \
            "$APK_SHA256" \
            "$RUNNER_TEMP/melodix-display-state-$PROFILE"

      - name: Upload only the redacted profile sidecar
        uses: actions/upload-artifact@v4
        with:
          name: melodix-display-ownership-${{ matrix.profile }}-${{ github.run_id }}
          path: ${{ runner.temp }}/melodix-display-state-${{ matrix.profile }}/display-ownership-${{ matrix.profile }}.json
          retention-days: 1
          if-no-files-found: error

      # Sanitized boot diagnostic only: categories, marker names and counts.
      # Never the raw emulator log, never logcat, never UI or account data.
      - name: Upload the sanitized boot diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: melodix-display-boot-diagnostic-${{ matrix.profile }}-${{ github.run_id }}
          path: ${{ runner.temp }}/melodix-display-avd-${{ matrix.profile }}/boot-diagnostic.json
          retention-days: 1
          if-no-files-found: ignore

      # Targeted stop: only this profile's recorded serial and PID, never a
      # blanket pkill. On runner cancellation or job timeout GitHub reaps the
      # process tree itself and this step may not complete; correctness relies
      # on the runner being ephemeral, not on this cleanup being guaranteed.
      - name: Stop only this profile's emulator
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          bash "$GITHUB_WORKSPACE/tooling/scripts/p0_display_stop_avd.sh" \
            "$RUNNER_TEMP/melodix-display-avd-$PROFILE" || true
        env:
          PROFILE: ${{ matrix.profile }}

  aggregate-display-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.enabled == true
    name: Aggregate the two redacted profiles without claiming P0 resolution
    needs: [prepare-display-comparison, capture-display-profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out current diagnostic tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling

      - name: Download the phone sidecar
        uses: actions/download-artifact@v4.3.0
        with:
          name: melodix-display-ownership-phone-${{ github.run_id }}
          path: ${{ runner.temp }}/melodix-display-phone

      - name: Download the tablet sidecar
        uses: actions/download-artifact@v4.3.0
        with:
          name: melodix-display-ownership-tablet-${{ github.run_id }}
          path: ${{ runner.temp }}/melodix-display-tablet

      - name: Validate and combine the two strict sidecars
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          APK_SHA256: ${{ needs.prepare-display-comparison.outputs.apk_sha256 }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tooling/scripts/aggregate_p0_display_ownership.py" \
            --source-ref "$SOURCE_REF" \
            --run-id "${{ github.run_id }}" \
            --apk-sha256 "$APK_SHA256" \
            --phone-report "$RUNNER_TEMP/melodix-display-phone/display-ownership-phone.json" \
            --tablet-report "$RUNNER_TEMP/melodix-display-tablet/display-ownership-tablet.json" \
            --output "$RUNNER_TEMP/melodix-display-combined/display-ownership-combined.json"
          python3 - "$RUNNER_TEMP/melodix-display-combined/display-ownership-combined.json" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          comparison = report["comparison"]
          if comparison["p0_resolution_claimed"] is not False:
              raise SystemExit("combined report must never claim P0 resolution")
          print(
              "::notice title=P0 display comparison evidence::"
              f"p0_display_ownership_satisfied={str(comparison['p0_display_ownership_satisfied']).lower()}; "
              "p0_resolution_claimed=false; authenticated_spotify_test=not_performed"
          )
          PY

      - name: Upload only the combined redacted comparison report
        uses: actions/upload-artifact@v4
        with:
          name: melodix-display-ownership-combined-${{ github.run_id }}
          path: ${{ runner.temp }}/melodix-display-combined/display-ownership-combined.json
          retention-days: 1
          if-no-files-found: error

      - name: Keep the P0 open unless both profiles satisfy the ownership criterion
        shell: bash
        run: |
          set -euo pipefail
          satisfied="$(python3 - "$RUNNER_TEMP/melodix-display-combined/display-ownership-combined.json" <<'PY'
          import json
          import pathlib
          import sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(str(report["comparison"]["p0_display_ownership_satisfied"]).lower())
          PY
          )"
          if [[ "$satisfied" != "true" ]]; then
            echo "::error title=P0 display ownership finding::The redacted comparison is uploaded, but phone/tablet native display ownership was not satisfied at all five launch-relative checkpoints. The P0 remains open."
            exit 1
          fi
          echo "::notice title=P0 display ownership evidence::Both profiles satisfied the measured ownership criterion. This is runtime evidence only; the P0 is not automatically declared resolved."
