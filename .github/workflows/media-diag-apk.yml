name: Build Melodix media diagnostic APK

# Dedicated diagnostic build. Manual trigger only; not a Melodix Preview.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4.0.4
      - name: Install build tools and platform
        run: sdkmanager --install 'build-tools;35.0.0' 'platforms;android-36'
      - name: Build diagnostic APK
        run: bash scripts/build_diag_apk.sh "$RUNNER_TEMP/diag-out"
      - name: Check diagnostic APK content
        run: python3 scripts/check_diag_apk.py "$RUNNER_TEMP/diag-out/melodix-diag.apk"
      - name: Record SHA-256
        run: sha256sum "$RUNNER_TEMP/diag-out/melodix-diag.apk" | tee "$RUNNER_TEMP/diag-out/melodix-diag.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: melodix-media-diag
          path: ${{ runner.temp }}/diag-out/melodix-diag.apk*
          retention-days: 14
          if-no-files-found: error
