name: Build Melodix Preview APK

on:
  push:
    branches:
      - arena/dbf2d44f-melodix
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      build_only:
        required: false
        default: false
        type: boolean
      target_debuggable:
        required: false
        default: false
        type: boolean
      demo_build:
        required: false
        default: false
        type: boolean
      demo_glass_launcher:
        required: false
        default: false
        type: boolean
      apk_suffix:
        required: false
        default: ""
        type: string
      version_code_base:
        required: false
        default: 0
        type: number
    outputs:
      apk_name:
        description: APK filename and same-run artifact name
        value: ${{ jobs.build-and-release-preview.outputs.apk_name }}
      version_code:
        description: Android versionCode embedded in the APK
        value: ${{ jobs.build-and-release-preview.outputs.version_code }}
      source_ref:
        description: Full source commit embedded in the APK
        value: ${{ jobs.build-and-release-preview.outputs.source_ref }}
  workflow_dispatch:
    inputs:
      release_tag:
        description: Preview artifact tag used to name a build-only artifact (no release is created here)
        required: true
        type: string
        default: v1.2.2-test.1-preview
      source_ref:
        description: Full source commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-release-preview:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && !(github.event_name == 'workflow_dispatch' && inputs.release_tag == 'v1.2.2-test.9003-preview') }}
    name: Build separate Preview APK artifact
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.release.outputs.apk_name }}
      version_code: ${{ steps.release.outputs.version_code }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    steps:
      - name: Select preview release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag || '' }}
          BUILD_ONLY: ${{ inputs.build_only || github.event_name == 'workflow_dispatch' }}
          APK_SUFFIX: ${{ inputs.apk_suffix || '' }}
          VERSION_CODE_BASE: ${{ inputs.version_code_base || 0 }}
          EVENT_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_ref must be a full 40-character commit SHA."
            exit 1
          fi
          # This workflow is build/artifact-only in every event mode. A public
          # release can be created only by test-preview-emulator after the exact
          # non-debuggable APK has been installed and validated.
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$EVENT_COMMIT_MESSAGE" =~ ^\[preview-release\][[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+-preview)([[:space:]]|$) ]]; then
            tag="${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$EVENT_COMMIT_MESSAGE" == *'[skip-release]'* ]]; then
            tag='v1.2.2-test.94-preview'
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_call" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::A release tag input is required for build-only Preview artifacts."
            exit 1
          else
            echo "::error::Push commits must start with '[preview-release] v1.2.2-test.N-preview ...' or contain '[skip-release]'. No push publishes a release."
            exit 1
          fi
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-test\.([0-9]+)-preview$ ]]; then
            echo "::error::Expected a preview tag such as v1.2.2-test.1-preview"
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          test_number="${BASH_REMATCH[2]}"
          if [[ ! "$APK_SUFFIX" =~ ^(-[a-z0-9-]+)?$ ]]; then
            echo "::error::apk_suffix may contain only lowercase letters, digits, and hyphens, with a leading hyphen."
            exit 1
          fi
          if [[ ! "$VERSION_CODE_BASE" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code_base must be a non-negative integer."
            exit 1
          fi
          # This reserved dispatch tag selects the isolated playlist experiment.
          # It cannot be activated by push or by the reusable release workflow.
          diagnostic=false
          liked_songs_fix=false
          playlist_count_fix=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$tag" == "v1.2.2-test.9000-preview" || "$tag" == "v1.2.2-test.9001-preview" || "$tag" == "v1.2.2-test.9002-preview" ]]; then
              diagnostic=true
              APK_SUFFIX="-playlist-diagnostic"
            fi
            if [[ "$tag" == "v1.2.2-test.9001-preview" || "$tag" == "v1.2.2-test.9002-preview" ]]; then
              liked_songs_fix=true
              APK_SUFFIX="-liked-songs-diagnostic"
            fi
            if [[ "$tag" == "v1.2.2-test.9002-preview" ]]; then
              playlist_count_fix=true
              APK_SUFFIX="-playlist-count-diagnostic"
            fi
          fi
          echo "playlist_diagnostic=$diagnostic" >> "$GITHUB_OUTPUT"
          echo "liked_songs_fix=$liked_songs_fix" >> "$GITHUB_OUTPUT"
          echo "playlist_count_fix=$playlist_count_fix" >> "$GITHUB_OUTPUT"
          apk_name="Melodix-Preview-v${version}-test${test_number}${APK_SUFFIX}.apk"
          IFS=. read -r major minor patch <<< "$version"
          # Public release builds retain the release counter. A build-only
          # production candidate may pass the latest published versionCode as
          # its base; the caller run counter then makes it updateable and unique.
          if [[ "$BUILD_ONLY" == "true" ]]; then
            if (( VERSION_CODE_BASE > 0 )); then
              version_code=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER))
            else
              # Instrumentation-only APKs use a separate monotonic sequence and
              # are never published as user-facing Preview builds.
              version_code=$((1020880 + GITHUB_RUN_NUMBER))
            fi
          else
            # Legacy push-triggered artifacts keep a deterministic tag/run-based
            # versionCode. They are never published by this build-only workflow.
            version_code=$((major * 1000000 + minor * 10000 + patch * 100 + test_number + 28 + GITHUB_RUN_NUMBER))
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_ref=$INPUT_SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Check preview signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::Add the GitHub Actions secrets MELODIX_PREVIEW_KEYSTORE_B64 and MELODIX_PREVIEW_KEYSTORE_PASSWORD before running this workflow. Do not put the keystore or its passwords in the repository."
            exit 1
          fi

      - name: Check out selected source commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.source_ref }}

      # Only the explicitly requested manual diagnostic is reconstructed from
      # the known 44902 base; the selected source commit supplies the patches.
      - name: Check out known diagnostic base
        if: ${{ steps.release.outputs.playlist_diagnostic == 'true' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: 44902d9b8d1d1d70bc72acbd66f7c0c2d4b41e0d
          path: playlist-diagnostic-base
          persist-credentials: false

      - name: Apply isolated playlist diagnostic patches
        if: ${{ steps.release.outputs.playlist_diagnostic == 'true' }}
        shell: bash
        env:
          LIKED_SONGS_FIX: ${{ steps.release.outputs.liked_songs_fix }}
          PLAYLIST_COUNT_FIX: ${{ steps.release.outputs.playlist_count_fix }}
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/playlist-diagnostic-base"
          full="$GITHUB_WORKSPACE/docs/audits/2026-11-04-reprise-sans-delai/correctif-et-tests-sur-base-44902.patch"
          delta="$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-playlists/diagnostic-sur-candidat-sans-delai.patch"
          cd "$project"
          git apply --check "$full"
          git apply "$full"
          git apply --check "$delta"
          git apply "$delta"
          if [[ "$LIKED_SONGS_FIX" == "true" ]]; then
            liked="$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-playlists/liked-songs-sur-test9000.patch"
            git apply --check "$liked"
            git apply "$liked"
          fi
          if [[ "$PLAYLIST_COUNT_FIX" == "true" ]]; then
            count="$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-playlists/plus-de-playlists-sur-test9001.patch"
            git apply --check "$count"
            git apply "$count"
          fi
          cmp assets/css_hacks.css "$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-playlists/css_hacks_sans_section9.css"
          test ! -s assets/adblock_hosts.txt
          git diff --check

      - name: Regenerate and verify runtime assets
        shell: bash
        env:
          PLAYLIST_DIAGNOSTIC: ${{ steps.release.outputs.playlist_diagnostic }}
        run: |
          set -euo pipefail
          if [[ "$PLAYLIST_DIAGNOSTIC" == "true" ]]; then
            cd "$GITHUB_WORKSPACE/playlist-diagnostic-base"
            sha256sum assets/spotify_bridge.js assets/native_ui_shell.js assets/melodix_home.js > "$RUNNER_TEMP/assets-before.sha256"
            bash scripts/build_runtime_assets.sh
            sha256sum -c "$RUNNER_TEMP/assets-before.sha256"
            git diff --check
          else
            bash scripts/build_runtime_assets.sh
            git diff --check
            git diff --exit-code -- \
              assets/spotify_bridge.js \
              assets/native_ui_shell.js \
              assets/melodix_home.js
          fi

      - name: Test playlist diagnostic before packaging
        if: ${{ steps.release.outputs.playlist_diagnostic == 'true' }}
        shell: bash
        env:
          LIKED_SONGS_FIX: ${{ steps.release.outputs.liked_songs_fix }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/playlist-diagnostic-base"
          npm ci --ignore-scripts
          export MELODIX_SOURCE_ROOT="$PWD" NODE_PATH="$PWD/node_modules"
          node --test \
            "$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-playlists/preview-check.test.cjs" \
            "$GITHUB_WORKSPACE/docs/audits/2026-11-04-profil-navigateur/profile.test.cjs"
          if [[ "$LIKED_SONGS_FIX" == "true" ]]; then
            node --test tests/live_library_dom.test.js tests/live_library_integration.test.js tests/native_ui.test.js
          fi

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build tools
        run: sdkmanager --install "build-tools;35.0.0"

      - name: Build and sign preview APK
        id: package
        shell: bash
        env:
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          SOURCE_REF: ${{ steps.release.outputs.source_ref }}
          BUILD_ONLY: ${{ inputs.build_only || github.event_name == 'workflow_dispatch' }}
          TARGET_DEBUGGABLE: ${{ inputs.target_debuggable || false }}
          PLAYLIST_DIAGNOSTIC: ${{ steps.release.outputs.playlist_diagnostic }}
          LIKED_SONGS_FIX: ${{ steps.release.outputs.liked_songs_fix }}
          PLAYLIST_COUNT_FIX: ${{ steps.release.outputs.playlist_count_fix }}
          DEMO_BUILD: ${{ inputs.demo_build || false }}
          DEMO_GLASS_LAUNCHER: ${{ inputs.demo_glass_launcher || false }}
          MELODIX_PREVIEW_KEYSTORE_B64: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_B64 }}
          MELODIX_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
          MELODIX_PREVIEW_KEY_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEY_PASSWORD || secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE"
          if [[ "$PLAYLIST_DIAGNOSTIC" == "true" ]]; then
            source_dir="$GITHUB_WORKSPACE/playlist-diagnostic-base"
          fi
          work_dir="$RUNNER_TEMP/melodix-preview-apktool-project"
          framework_dir="$RUNNER_TEMP/melodix-preview-apktool-framework"
          output="$RUNNER_TEMP/$APK_NAME"
          mkdir -p "$framework_dir" "$work_dir"
          project_items=(AndroidManifest.xml META-INF apktool.yml assets kotlin lib original res smali unknown)
          for item in "${project_items[@]}"; do
            if [[ ! -e "$source_dir/$item" ]]; then
              echo "::error::Root-level Apktool project item is missing: $item"
              exit 1
            fi
            cp -a "$source_dir/$item" "$work_dir/"
          done

          # Keep generated assets bound to their readable sources. The bridge
          # is fetched in three 48 KiB ranges; the separately evaluated shell
          # and Home renderer retain the historical single-payload ceiling.
          python3 - "$source_dir" <<'PY'
          import hashlib
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          for name in ("spotify_bridge", "native_ui_shell", "melodix_home"):
              source = (root / f"scripts/{name}.source.js").read_bytes()
              runtime = (root / f"assets/{name}.js").read_bytes()
              header = runtime.splitlines()[0].decode("ascii")
              match = re.fullmatch(
                  rf"/\* generated from scripts/{name}\.source\.js; sha256=([0-9a-f]{{64}}); terser=5\.51\.2; no-compress,no-mangle \*/",
                  header,
              )
              if not match or match.group(1) != hashlib.sha256(source).hexdigest():
                  raise SystemExit(f"assets/{name}.js is stale; run scripts/build_runtime_assets.sh")
              max_runtime_bytes = 3 * 48 * 1024 if name == "spotify_bridge" else 108867
              if len(runtime) >= max_runtime_bytes:
                  raise SystemExit(f"Runtime {name} payload exceeds its {max_runtime_bytes}-byte execution limit: {len(runtime)} bytes")
          PY

          # The app validates its signing certificate at startup. Set the preview
          # fingerprint in the temporary build so the new package passes that check.
          signing_keystore="$RUNNER_TEMP/melodix-preview-signing.jks"
          printf '%s' "$MELODIX_PREVIEW_KEYSTORE_B64" | base64 --decode > "$signing_keystore"
          keytool -exportcert \
            -alias MELODIX_PREVIEW \
            -keystore "$signing_keystore" \
            -storepass:env MELODIX_PREVIEW_KEYSTORE_PASSWORD \
            -file "$RUNNER_TEMP/melodix-preview-cert.der"
          fingerprint_hex="$(sha256sum "$RUNNER_TEMP/melodix-preview-cert.der" | awk '{print toupper($1)}')"
          preview_fingerprint="$(printf '%s' "$fingerprint_hex" | fold -w 2 | paste -sd ':' -)"
          if [[ ! "$preview_fingerprint" =~ ^([A-F0-9]{2}:){31}[A-F0-9]{2}$ ]]; then
            echo "::error::Could not derive the preview signing certificate fingerprint."
            exit 1
          fi

          python3 - "$work_dir/AndroidManifest.xml" "$SOURCE_REF" "$BUILD_ONLY" "$TARGET_DEBUGGABLE" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          BUILD_ID = sys.argv[2][:7]
          BUILD_ONLY = sys.argv[3].lower() == "true"
          TARGET_DEBUGGABLE = sys.argv[4].lower() == "true"

          manifest_path = sys.argv[1]
          android_ns = "http://schemas.android.com/apk/res/android"
          android = "{" + android_ns + "}"
          ET.register_namespace("android", android_ns)
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          original_id = "com.melodix.music"
          preview_id = "com.melodix.music.preview"
          if root.get("package") != original_id:
              raise SystemExit("Unexpected base package id; refusing to rewrite the preview manifest.")
          root.set("package", preview_id)
          application = root.find("application")
          if application is None:
              raise SystemExit("Preview manifest has no application element")
          if TARGET_DEBUGGABLE and not BUILD_ONLY:
              raise SystemExit("Refusing to create a debuggable published Preview APK")
          if TARGET_DEBUGGABLE:
              # Android refuses to attach the integration runner to a
              # non-debuggable target. This ephemeral APK is never published.
              application.set(android + "debuggable", "true")
              print("::notice title=Preview CI instrumentation::ephemeral instrumentation APK is debuggable")
          else:
              # The separately installed release candidate is the exact
              # non-debuggable artifact eligible for later publication.
              application.attrib.pop(android + "debuggable", None)

          for element in root.iter():
              name = element.get(android + "name")
              if name == original_id + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION":
                  element.set(android + "name", preview_id + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION")
              authorities = element.get(android + "authorities")
              if authorities and authorities.startswith(original_id + "."):
                  element.set(android + "authorities", preview_id + authorities[len(original_id):])
              if element.get(android + "label") == "Melodix":
                  element.set(android + "label", "Melodix Preview " + BUILD_ID)

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True, short_empty_elements=True)
          PY

          if [[ "$DEMO_BUILD" == "true" ]]; then
            [[ "$BUILD_ONLY" == "true" ]] || { echo "::error::Demo is forbidden in publishable builds"; exit 1; }
            if [[ "$DEMO_GLASS_LAUNCHER" == "true" ]]; then
              python3 "$source_dir/scripts/prepare_demo_preview.py" "$work_dir" --glass-launcher
            else
              python3 "$source_dir/scripts/prepare_demo_preview.py" "$work_dir"
            fi
          elif [[ "$DEMO_GLASS_LAUNCHER" == "true" ]]; then
            echo "::error::Glass demo launcher requires a demo build"; exit 1
          fi

          sed -i -E "s#(<string name=\"app_name\">)[^<]*(</string>)#\1Melodix Preview ${SOURCE_REF:0:7}\2#" \
            "$work_dir/res/values/strings.xml"
          sed -i -E "s#<string name=\"expected_signature_sha256\">[^<]*</string>#<string name=\"expected_signature_sha256\">$preview_fingerprint</string>#" \
            "$work_dir/res/values/strings.xml"
          if ! grep -Fq "<string name=\"expected_signature_sha256\">$preview_fingerprint</string>" \
            "$work_dir/res/values/strings.xml"; then
            echo "::error::Failed to configure the preview signing fingerprint in the temporary build."
            exit 1
          fi
          # Embed the full source SHA as a compiled resource, in addition to the
          # short versionName/launcher label, so the sideloaded APK is traceable.
          python3 - "$work_dir/res/values/strings.xml" "$SOURCE_REF" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source_ref = sys.argv[2]
          text = path.read_text(encoding="utf-8")
          if 'name="preview_source_commit"' in text:
              raise SystemExit("preview_source_commit already exists; refusing ambiguous metadata")
          marker = "</resources>"
          at = text.rfind(marker)
          if at < 0:
              raise SystemExit("strings.xml has no resources root")
          text = text[:at] + f'    <string name="preview_source_commit">{source_ref}</string>\n' + text[at:]
          path.write_text(text, encoding="utf-8")
          PY

          # Keep picture-in-picture broadcast actions unique to the side-by-side preview app.
          find "$work_dir" -type f -name '*.smali' -exec sed -i \
            's/com\.melodix\.music\.PIP_/com.melodix.music.preview.PIP_/g' {} +

          sed -i -E "s/^apkFileName:.*/apkFileName: $APK_NAME/" "$work_dir/apktool.yml"
          sed -i -E "s/^  versionCode: .*/  versionCode: $VERSION_CODE/" "$work_dir/apktool.yml"
          sed -i -E "s/^  versionName: .*/  versionName: 1.2.2-${SOURCE_REF:0:7}/" "$work_dir/apktool.yml"

          curl --fail --silent --show-error --location \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            --output "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" if \
            --frame-path "$framework_dir" android/apktool-framework/1.apk
          java -jar "$RUNNER_TEMP/apktool.jar" b "$work_dir" \
            --frame-path "$framework_dir" \
            --output "$RUNNER_TEMP/unsigned.apk" \
            --force-all

          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ "$DEMO_BUILD" == "true" ]]; then
            # Demo code exists only in this temporary preview build, never the
            # source Apktool project or the regular release workflow.
            demo_classes="$RUNNER_TEMP/demo-classes"
            demo_dex="$RUNNER_TEMP/demo-dex"
            mkdir -p "$demo_classes" "$demo_dex"
            javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d "$demo_classes" $(find "$source_dir/demo/src" "$source_dir/local/src" -name '*.java')
            mapfile -t demo_class_files < <(find "$demo_classes" -name '*.class')
            "$build_tools/d8" --lib "$ANDROID_HOME/platforms/android-36/android.jar" --min-api 24 --output "$demo_dex" "${demo_class_files[@]}"
            if unzip -l "$RUNNER_TEMP/unsigned.apk" | grep -q 'classes2.dex'; then echo "::error::Demo dex slot already occupied"; exit 1; fi
            mv "$demo_dex/classes.dex" "$demo_dex/classes2.dex"
            (cd "$demo_dex" && zip -q "$RUNNER_TEMP/unsigned.apk" classes2.dex)
            python3 "$source_dir/scripts/check_preview_dex.py" "$RUNNER_TEMP/unsigned.apk"
          fi
          "$build_tools/zipalign" -f 4 \
            "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$signing_keystore" \
            --ks-key-alias MELODIX_PREVIEW \
            --ks-pass env:MELODIX_PREVIEW_KEYSTORE_PASSWORD \
            --key-pass env:MELODIX_PREVIEW_KEY_PASSWORD \
            --out "$output" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --verbose --min-sdk-version 24 "$output"

          # The app refuses to start when the fingerprint in strings.xml is not
          # the one of the certificate that signed this very APK. Check it here
          # instead of shipping an APK that can only close itself.
          # No pipes here on purpose: under `set -o pipefail`, grep -q exiting on
          # the first match sends SIGPIPE upstream and makes the whole pipeline
          # report a failure even when the match was found.
          "$build_tools/apksigner" verify --print-certs "$output" > "$RUNNER_TEMP/apk-certs.txt"
          signed_line="$(grep '^Signer #1 certificate SHA-256 digest: ' "$RUNNER_TEMP/apk-certs.txt" || true)"
          signed_fingerprint="${signed_line##*: }"
          signed_fingerprint="${signed_fingerprint%$'\r'}"
          signed_fingerprint="${signed_fingerprint^^}"
          if [[ "$signed_fingerprint" != "$fingerprint_hex" ]]; then
            echo "::error::Embedded fingerprint does not match the signing certificate."
            exit 1
          fi

          # Read the compiled resource table, not the source XML: this is what
          # getString(0x7f110052) returns at runtime.
          "$build_tools/aapt" dump --values resources "$output" > "$RUNNER_TEMP/apk-resources.txt"
          if ! grep -Fq "$preview_fingerprint" "$RUNNER_TEMP/apk-resources.txt"; then
            echo "::error::expected_signature_sha256 was not compiled into resources.arsc."
            exit 1
          fi
          if ! grep -Fq "$SOURCE_REF" "$RUNNER_TEMP/apk-resources.txt"; then
            echo "::error::full preview source commit was not embedded in resources.arsc."
            exit 1
          fi

          "$build_tools/aapt" dump badging "$output" > "$RUNNER_TEMP/apk-badging.txt"
          package_id="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/apk-badging.txt")"
          apk_version_code="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/apk-badging.txt")"
          apk_version_name="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/apk-badging.txt")"
          expected_version_name="1.2.2-${SOURCE_REF:0:7}"
          if [[ "$package_id" != "com.melodix.music.preview" ]]; then
            echo "::error::Preview APK has unexpected package id: $package_id"
            exit 1
          fi
          if [[ "$apk_version_code" != "$VERSION_CODE" || "$apk_version_name" != "$expected_version_name" ]]; then
            echo "::error::Preview APK metadata mismatch: versionCode=$apk_version_code versionName=$apk_version_name"
            exit 1
          fi

          # The JS bridge and the native shell are read from assets at runtime. A
          # build where one of them is missing or truncated makes the app start
          # without its playback guards, so fail the build instead of shipping it.
          for asset in spotify_bridge.js native_ui_shell.js melodix_home.js runtime_diagnostic.js css_hacks.css; do
            extracted_size="$(unzip -p "$output" "assets/$asset" 2>/dev/null | wc -c | tr -d ' ')"
            if [[ "${extracted_size:-0}" -lt 1000 ]]; then
              echo "::error::assets/$asset is missing or truncated (${extracted_size:-0} bytes) in the preview APK."
              exit 1
            fi
            max_payload=0
            case "$asset" in
              spotify_bridge.js) max_payload=$((3 * 48 * 1024)); max_label="three 48 KiB native ranges" ;;
              native_ui_shell.js|melodix_home.js) max_payload=108867; max_label="108867-byte single-evaluation limit" ;;
            esac
            if [[ "$max_payload" -gt 0 && "$extracted_size" -ge "$max_payload" ]]; then
              echo "::error::assets/$asset exceeds its $max_label limit (${extracted_size} bytes; limit ${max_payload})."
              exit 1
            fi
          done

          # Compare every packaged asset byte-for-byte with the exact checkout.
          # For generated JS, also bind the minified output to its readable source.
          python3 - "$output" "$source_dir" "$SOURCE_REF" "$RUNNER_TEMP/melodix-runtime-assets.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys
          import zipfile

          apk_path, source_root, source_ref, manifest_path = sys.argv[1:]
          root = pathlib.Path(source_root)
          generated = {"spotify_bridge", "native_ui_shell", "melodix_home"}
          manifest = {"source_commit": source_ref, "assets": []}
          with zipfile.ZipFile(apk_path) as apk:
              for asset_path in sorted(path for path in (root / "assets").rglob("*") if path.is_file()):
                  relative = asset_path.relative_to(root).as_posix()
                  runtime = asset_path.read_bytes()
                  packaged = apk.read(relative)
                  if packaged != runtime:
                      raise SystemExit(f"Signed APK asset differs from checkout: {relative}")
                  entry = {
                      "name": relative,
                      "asset_sha256": hashlib.sha256(runtime).hexdigest(),
                      "bytes": len(packaged),
                  }
                  if asset_path.parent == root / "assets" and asset_path.suffix == ".js" and asset_path.stem in generated:
                      name = asset_path.stem
                      source_path = root / f"scripts/{name}.source.js"
                      source = source_path.read_bytes()
                      source_hash = hashlib.sha256(source).hexdigest()
                      header = runtime.splitlines()[0].decode("ascii")
                      match = re.fullmatch(
                          rf"/\* generated from scripts/{name}\.source\.js; sha256=([0-9a-f]{{64}}); terser=5\.51\.2; no-compress,no-mangle \*/",
                          header,
                      )
                      if not match or match.group(1) != source_hash:
                          raise SystemExit(f"Generated asset header/source hash mismatch: {name}")
                      entry["source"] = source_path.relative_to(root).as_posix()
                      entry["source_sha256"] = source_hash
                  manifest["assets"].append(entry)
          pathlib.Path(manifest_path).write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

          mkdir -p "$GITHUB_WORKSPACE/preview-output"
          cp "$output" "$GITHUB_WORKSPACE/preview-output/$APK_NAME"
          cp "$RUNNER_TEMP/melodix-runtime-assets.json" "$GITHUB_WORKSPACE/preview-output/assets-manifest.json"
          (cd "$GITHUB_WORKSPACE/preview-output" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          apk_sha256="$(sha256sum "$output" | awk '{print $1}')"
          echo "apk_path=preview-output/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha_path=preview-output/$APK_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "asset_manifest_path=preview-output/assets-manifest.json" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "package_id=$package_id" >> "$GITHUB_OUTPUT"
          echo "apk_version_code=$apk_version_code" >> "$GITHUB_OUTPUT"
          echo "apk_version_name=$apk_version_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "::notice title=Signed Preview APK metadata::artifact=$APK_NAME package=$package_id versionCode=$apk_version_code versionName=$apk_version_name sha256=$apk_sha256 source=$SOURCE_REF"
          build_mode="artifact-only; no public release or tag"
          {
            echo "### Signed Melodix Preview APK ($build_mode)"
            echo
            echo "- APK: \`$APK_NAME\`"
            echo "- Package ID: \`$package_id\`"
            echo "- versionCode: \`$apk_version_code\`"
            echo "- versionName: \`$apk_version_name\`"
            echo "- Source commit: \`$SOURCE_REF\` (also embedded as \`preview_source_commit\`)"
            if [[ "$PLAYLIST_DIAGNOSTIC" == "true" ]]; then
              echo "- Diagnostic: base 44902d9 plus both audited patches; WebView debugging enabled for Preview only."
              if [[ "$LIKED_SONGS_FIX" == "true" ]]; then
                echo "- Additional patch: liked-songs-sur-test9000.patch."
              fi
              if [[ "$PLAYLIST_COUNT_FIX" == "true" ]]; then
                echo "- Additional patch: plus-de-playlists-sur-test9001.patch."
              fi
            fi
            echo "- SHA-256: \`$apk_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The pinned public certificate was compared against Preview137 in run
      # 42661869818; Preview147 passed the pin with version 1021484 in run
      # 42745108847. Fail closed on key rotation or a non-upgrade version.
      - name: Check Preview update identity and version
        if: ${{ inputs.target_debuggable != true }}
        env:
          APK_NAME: ${{ steps.release.outputs.apk_name }}
        run: |
          set -euo pipefail
          candidate="preview-output/$APK_NAME"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --print-certs "$candidate" > "$RUNNER_TEMP/update-candidate-cert.txt"
          "$tools/aapt" dump badging "$candidate" > "$RUNNER_TEMP/update-candidate-badging.txt"
          python3 scripts/verify_preview_update.py "$RUNNER_TEMP/update-candidate-cert.txt" "$RUNNER_TEMP/update-candidate-badging.txt"

      # This reusable build only emits a short-lived artifact. Public releases
      # are handled after the separate emulator workflow validates the exact
      # non-debuggable candidate APK.
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.apk_name }}
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.sha_path }}
            ${{ steps.package.outputs.asset_manifest_path }}
          retention-days: 14
          if-no-files-found: error

  historical-glass-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == 'v1.2.2-test.9003-preview' }}
    name: Preview séparée d0f206b0 + Glass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout delivery
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact historical base
        uses: actions/checkout@v7.0.1
        with:
          ref: d0f206b08b3db7c2d41a1e844f6dd4abf196a5f6
          path: historical
          persist-credentials: false
      - name: Verify base and signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          DELIVERY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$INPUT_SOURCE_REF" = "$DELIVERY_SHA"
          test "$(git -C historical rev-parse HEAD)" = d0f206b08b3db7c2d41a1e844f6dd4abf196a5f6
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD"
      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Install build tools
        run: sdkmanager --install 'build-tools;35.0.0'
      - name: Historical test report (known failures)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-deps" preview-output
          npm install --prefix "$RUNNER_TEMP/test-deps" --no-save --ignore-scripts jsdom@26.1.0
          cd historical
          # Test the historical code against the exact Glass CSS that will be packaged.
          cp "$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-historique-glass/css_hacks_glass_complet.css" assets/css_hacks.css
          export NODE_PATH="$RUNNER_TEMP/test-deps/node_modules"
          MELODIX_HISTORICAL_ROOT="$PWD" python3 "$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-historique-glass/prepare-preview-test.py"
          node --test tests/native_home_feed.test.js tests/native_ui.test.js tests/playback_pause.test.js
          MELODIX_HISTORICAL_ROOT="$PWD" node --test \
            "$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-historique-glass/diagnostic-simulation.test.cjs" \
            "$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-historique-glass/playlist-playback.test.cjs" \
            "$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-historique-glass/native-smali-characterization.test.cjs" \
            "$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-historique-glass/native-routing-characterization.test.cjs" \
            "$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-historique-glass/native-dispatch-characterization.test.cjs" \
            "$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-historique-glass/css-callback-characterization.test.cjs"
          # This is a characterization of known defects, NOT an acceptance test.
          echo "::warning::Historical native row URI guards reject non-empty URIs and generic bridge dispatch can discard data; see audit before installing."
          set +e
          node --test tests/*.test.js > "$GITHUB_WORKSPACE/preview-output/historical-tests.log" 2>&1
          result=$?
          set -e
          tail -15 "$GITHUB_WORKSPACE/preview-output/historical-tests.log"
          echo "Historical suite exit: $result (known legacy failures; not proof of phone behavior)." >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Build separate Preview and sign with pinned key
        env:
          MELODIX_PREVIEW_KEYSTORE_B64: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_B64 }}
          MELODIX_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
          MELODIX_PREVIEW_KEY_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEY_PASSWORD || secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
          DELIVERY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=d0f206b08b3db7c2d41a1e844f6dd4abf196a5f6
          audit="$GITHUB_WORKSPACE/docs/audits/2026-11-04-preview-historique-glass"
          work="$RUNNER_TEMP/historical-preview"
          mkdir -p "$work" "$RUNNER_TEMP/framework" preview-output
          for item in AndroidManifest.xml META-INF apktool.yml assets kotlin lib original res smali unknown; do
            test -e "historical/$item"
            cp -a "historical/$item" "$work/"
          done
          keystore="$RUNNER_TEMP/preview-signing.jks"
          printf '%s' "$MELODIX_PREVIEW_KEYSTORE_B64" | base64 --decode > "$keystore"
          keytool -exportcert -alias MELODIX_PREVIEW -keystore "$keystore" \
            -storepass:env MELODIX_PREVIEW_KEYSTORE_PASSWORD -file "$RUNNER_TEMP/preview-cert.der"
          cert="$(sha256sum "$RUNNER_TEMP/preview-cert.der" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          test "$cert" = E3CEB66F4F67CCBD53D92272F5C6422C3B10664AA57A28512BBFADB89657802F
          version_code=$((1021487 + GITHUB_RUN_NUMBER))
          python3 "$audit/prepare_preview.py" "$work" "$audit/css_hacks_glass_complet.css" "$cert" "$version_code" "$DELIVERY_SHA"
          curl --fail --silent --show-error --location \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar --output "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" if historical/android/apktool-framework/1.apk -p "$RUNNER_TEMP/framework"
          java -jar "$RUNNER_TEMP/apktool.jar" b "$work" -p "$RUNNER_TEMP/framework" -o "$RUNNER_TEMP/unsigned.apk" --force-all
          # Check the actual compiled dex (decoded back to Smali), not just source.
          java -jar "$RUNNER_TEMP/apktool.jar" d "$RUNNER_TEMP/unsigned.apk" -f -p "$RUNNER_TEMP/framework" -o "$RUNNER_TEMP/historical-decoded"
          MELODIX_HISTORICAL_ROOT="$GITHUB_WORKSPACE/historical" MELODIX_SMALI_ROOT="$RUNNER_TEMP/historical-decoded" \
            NODE_PATH="$RUNNER_TEMP/test-deps/node_modules" node --test "$audit/native-smali-characterization.test.cjs" "$audit/native-routing-characterization.test.cjs" "$audit/native-dispatch-characterization.test.cjs" "$audit/css-callback-characterization.test.cjs"
          MELODIX_HISTORICAL_ROOT="$GITHUB_WORKSPACE/historical" MELODIX_SMALI_ROOT="$RUNNER_TEMP/historical-decoded" NODE_PATH="$RUNNER_TEMP/test-deps/node_modules" \
            node --test --test-name-pattern="synthetic JS-to-native library|synthetic Home chain" "$audit/diagnostic-simulation.test.cjs"
          MELODIX_HISTORICAL_ROOT="$GITHUB_WORKSPACE/historical" MELODIX_SMALI_ROOT="$RUNNER_TEMP/historical-decoded" \
            node --test --test-name-pattern="synthetic playlist track payload" "$audit/playlist-playback.test.cjs"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -f 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          out=preview-output/Melodix-Preview-historique-glass.apk
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias MELODIX_PREVIEW \
            --ks-pass env:MELODIX_PREVIEW_KEYSTORE_PASSWORD --key-pass env:MELODIX_PREVIEW_KEY_PASSWORD \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --min-sdk-version 24 "$out"
          "$tools/apksigner" verify --print-certs "$out" > "$RUNNER_TEMP/cert.txt"
          "$tools/aapt" dump badging "$out" > "$RUNNER_TEMP/badging.txt"
          "$tools/aapt" dump --values resources "$out" > "$RUNNER_TEMP/resources.txt"
          ACTUAL_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert.txt" | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL_CERT" = "$cert"
          grep -F "package: name='com.melodix.music.preview' versionCode='$version_code' versionName='1.2.2-d0f206b-glass'" "$RUNNER_TEMP/badging.txt"
          grep -F "$base" "$RUNNER_TEMP/resources.txt"
          grep -F "$DELIVERY_SHA" "$RUNNER_TEMP/resources.txt"
          fingerprint="$(echo "$cert" | fold -w 2 | paste -sd ':' -)"
          grep -F "$fingerprint" "$RUNNER_TEMP/resources.txt"
          python3 - "$out" "$work" "$DELIVERY_SHA" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          apk, work, delivery = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), sys.argv[3]
          rows = []
          with zipfile.ZipFile(apk) as z:
              for p in sorted((work / 'assets').rglob('*')):
                  if not p.is_file(): continue
                  name = p.relative_to(work).as_posix()
                  data = p.read_bytes()
                  if z.read(name) != data: raise SystemExit('Asset mismatch: ' + name)
                  rows.append({'name': name, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)})
          pathlib.Path('preview-output/assets-manifest.json').write_text(json.dumps({'historical_base': 'd0f206b08b3db7c2d41a1e844f6dd4abf196a5f6', 'delivery_commit': delivery, 'assets': rows}, indent=2) + '\n')
          PY
          (cd preview-output && sha256sum Melodix-Preview-historique-glass.apk > Melodix-Preview-historique-glass.apk.sha256)
          {
            echo '### Preview historique Glass — non validée sur téléphone'
            echo "- Base: $base ; livraison: $DELIVERY_SHA ; versionCode: $version_code"
            echo '- Package séparé, clé Preview vérifiée. Ancienne connexion et protections historiques : consulter audit avant installation.'
            cat preview-output/Melodix-Preview-historique-glass.apk.sha256
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Preview artifact only (no release)
        uses: actions/upload-artifact@v4
        with:
          name: Melodix-Preview-historique-glass
          path: preview-output/
          retention-days: 14
          if-no-files-found: error
