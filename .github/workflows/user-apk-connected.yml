name: User APK connected walk (test account)
on:
  workflow_dispatch:  # manual only: never runs with the test account on a push
permissions:
  contents: read
jobs:
  connected:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          SPOTIFY_TEST_EMAIL: ${{ secrets.SPOTIFY_TEST_EMAIL }}
          SPOTIFY_TEST_PASSWORD: ${{ secrets.SPOTIFY_TEST_PASSWORD }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot'
          script: bash scripts/user_apk_connected.sh diagnostics/user-apk/Melodix-Preview-glass-a098738.apk 23a0b3e71ebfd8ec02dc10cefd41f5214c4e18afe965136e06551c9fe6334626
      - if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: user-apk-connected
          path: connected-evidence
          if-no-files-found: warn
          retention-days: 3
