name: APK Android

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Facultatif : Client ID Spotify intégré à l'APK
      # (Settings → Secrets and variables → Actions → onglet Variables → SPOTIFY_CLIENT_ID).
      # Sans lui, l'application le demande au premier lancement.
      SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Installer les dépendances
        run: yarn install --frozen-lockfile

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Nommer l'APK
        id: apk
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            VERSION="$TAG"
          else
            VERSION="v$(node -p "require('./package.json').version")-${GITHUB_SHA::7}"
          fi
          NAME="Melodix-${VERSION}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "### 📱 $NAME"
            echo ""
            echo "- Taille : $(du -h "$NAME" | cut -f1)"
            echo "- SHA-256 : \`$(sha256sum "$NAME" | cut -d' ' -f1)\`"
            if [ -n "$SPOTIFY_CLIENT_ID" ]; then
              echo "- Client ID Spotify : intégré"
            else
              echo "- Client ID Spotify : demandé au premier lancement"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Joindre l'APK à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          APK: ${{ steps.apk.outputs.name }}
        run: gh release upload "$TAG" "$APK" --clobber
