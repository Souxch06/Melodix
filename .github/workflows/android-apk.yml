name: APK Android

on:
  pull_request:
  workflow_dispatch:
    inputs:
      spotify_client_id:
        description: "Client ID Spotify de test"
        required: false
        type: string
      spotify_redirect_uri:
        # Vide = on laisse la chaîne Variables → défaut embarqué décider.
        description: "Redirect URI Spotify de test (vide = défaut embarqué)"
        required: false
        default: "comspotifytestsdk://callback"
        type: string
      publish_test_apk:
        description: "Publier l'APK dans la pré-release TEST OAuth Spotify"
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # URL du backend Melodix intégrée à l'APK (métadonnées Spotify, voir
      # server/). Variable de dépôt MELODIX_BACKEND_URL (Settings → Secrets and
      # variables → Actions → onglet Variables). Sans elle, l'app retombe sur
      # le catalogue Audius et l'historique local — jamais de config Spotify.
      MELODIX_BACKEND_URL: ${{ vars.MELODIX_BACKEND_URL }}
      # Facultatif : clé API Audius intégrée à l'APK (gratuite, dashboard Audius).
      # Sans elle, la couche audio interroge les nœuds publics de découverte.
      AUDIUS_API_KEY: ${{ vars.AUDIUS_API_KEY }}
      # Client ID de l'application Spotify du mainteneur (OAuth PKCE au
      # démarrage ; un Client ID n'est pas secret). Variable de dépôt optionnelle :
      # sans lui, l'écran de connexion affiche « configuration manquante ».
      # Deux canaux d'injection : extra de app.config (asset natif) + inlinage
      # Metro EXPO_PUBLIC_* (robuste en APK bare — voir services/spotify/authConfig).
      # Client ID Spotify : inputs (test) → Variables du dépôt → DÉFAUT
      # public embarqué (app de référence, validée au Login). OAuth PKCE :
      # aucun secret n'entre jamais ici — l'ID est public par conception.
      SPOTIFY_CLIENT_ID: ${{ inputs.spotify_client_id || vars.SPOTIFY_CLIENT_ID || '089d841ccc194c10a77afad9e1c11d54' }}
      EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ inputs.spotify_client_id || vars.SPOTIFY_CLIENT_ID || '089d841ccc194c10a77afad9e1c11d54' }}
      # Redirect URI OAuth → même chaîne : inputs → Variables → DÉFAUT
      # validé (comspotifytestsdk://callback, assorti au Client ID public).
      SPOTIFY_REDIRECT_URI: ${{ inputs.spotify_redirect_uri || vars.SPOTIFY_REDIRECT_URI || 'comspotifytestsdk://callback' }}
      EXPO_PUBLIC_SPOTIFY_REDIRECT_URI: ${{ inputs.spotify_redirect_uri || vars.SPOTIFY_REDIRECT_URI || 'comspotifytestsdk://callback' }}
      # AUCUN Client Secret / refresh token dans l'APK : le Client Secret n'existe
      # pas côté mobile (PKCE), aucun secret serveur dans le bundle.
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Valider la config Spotify injectée (Client ID = 32 hex, sinon défaut)
        # Une Variable de dépôt cassée (ex. un ACCESS TOKEN BQBrpi… collé à la
        # place d'un Client ID — diagnostic trouvé via les annotations du run
        # « SPOTIFY-DIAG ») ne doit JAMAIS passer dans l'APK : n'importe quelle
        # valeur non conforme retombe sur le DÉFAUT public embarqué, sans
        # supprimer la Variable (le mainteneur la corrigera ou la videra).
        run: |
          norm_cid() { echo "$1" | grep -qiE '^[0-9a-f]{32}$' && echo "$1" || echo '089d841ccc194c10a77afad9e1c11d54'; }
          norm_uri() { echo "$1" | grep -qiE '^[a-z][a-z0-9+.-]*://[^/]+' && echo "$1" || echo 'comspotifytestsdk://callback'; }
          CID="$(norm_cid "${SPOTIFY_CLIENT_ID:-}")"
          RU="$(norm_uri "${SPOTIFY_REDIRECT_URI:-}")"
          # Protection : JAMAIS de secret dans l'APK (un « client secret » ne
          # ressemble jamais à exigé ici, mais la validation 32-hex borne déjà).
          {
            echo "SPOTIFY_CLIENT_ID=$CID"
            echo "EXPO_PUBLIC_SPOTIFY_CLIENT_ID=$CID"
            echo "SPOTIFY_REDIRECT_URI=$RU"
            echo "EXPO_PUBLIC_SPOTIFY_REDIRECT_URI=$RU"
          } >> "$GITHUB_ENV"
          if [ "$CID" != "${SPOTIFY_CLIENT_ID:-}" ] || [ "$RU" != "${SPOTIFY_REDIRECT_URI:-}" ]; then
            echo "::warning title=Config Spotify normalisée::une valeur injectée ne ressemblait pas à un Client ID 32-hex / redirect valide — le DÉFAUT embarqué a été repris (prefix=${SPOTIFY_CLIENT_ID:0:6}…, len=${#SPOTIFY_CLIENT_ID})"
          fi

      - name: Installer Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Limiter l'APK aux processeurs ARM
        run: |
          # Les téléphones Android utilisent des processeurs ARM : on n'embarque que
          # ces architectures (APK plus léger, cohérent avec les modules natifs compilés).
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              defaultConfig {
                  ndk {
                      abiFilters "arm64-v8a", "armeabi-v7a"
                  }
              }
          }
          GRADLE

      - name: Compiler l'APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --console=plain -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle-build.log

      - name: Afficher l'erreur de compilation
        if: failure()
        run: |
          # Remonte l'erreur Gradle en annotation (visible dans l'onglet Actions et via l'API GitHub)
          esc() { local s="$1"; s="${s//'%'/'%25'}"; s="${s//$'\r'/'%0D'}"; s="${s//$'\n'/'%0A'}"; printf '%s' "$s"; }
          if [ ! -f gradle-build.log ]; then exit 0; fi
          WHAT=$(awk '/What went wrong/{f=1} f{print} /^\* Try:/{if(f) exit}' gradle-build.log | head -60)
          if [ -n "$WHAT" ]; then echo "::error title=Gradle::$(esc "$WHAT")"; fi
          ERRS=$(grep -E '^e: |error:|Error:|FAILED' gradle-build.log | head -30 || true)
          if [ -n "$ERRS" ]; then echo "::error title=Erreurs de compilation::$(esc "$ERRS")"; fi

      - name: Nommer l'APK
        id: apk
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            VERSION="$TAG"
          else
            VERSION="v$(node -p "require('./package.json').version")-${GITHUB_SHA::7}"
          fi
          NAME="Melodix-${VERSION}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "### 📱 $NAME"
            echo ""
            echo "- Taille : $(du -h "$NAME" | cut -f1)"
            echo "- SHA-256 : \`$(sha256sum "$NAME" | cut -d' ' -f1)\`"
            if [ -n "$MELODIX_BACKEND_URL" ]; then
              echo "- Backend Melodix : intégré ($MELODIX_BACKEND_URL)"
            else
              echo "- Backend Melodix : NON configuré — repli catalogue Audius + historique local"
            fi
            if [ -n "$AUDIUS_API_KEY" ]; then
              echo "- Clé API Audius : intégrée"
            else
              echo "- Clé API Audius : nœuds publics de découverte"
            fi
                        if [ -n "$SPOTIFY_CLIENT_ID" ]; then
              echo "- Client ID Spotify (connexion OAuth PKCE) : intégré"
            else
              echo "- Client ID Spotify : ABSENT — connexion non configurée dans cet APK"
            fi
            echo "- Audio : Audius · Métadonnées : backend Melodix · Compte : connexion Spotify OAuth PKCE (Melodix 4.0)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier l'APK
        env:
          APK: ${{ steps.apk.outputs.name }}
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          INFO=$("$AAPT2" dump badging "$APK" | grep -E "^(package|application-label|sdkVersion|minSdkVersion|targetSdkVersion|native-code):" | tr '\n' ' ')
          echo "$INFO"
          echo "::notice title=$APK::$INFO| taille $(du -h "$APK" | cut -f1) | sha256 $(sha256sum "$APK" | cut -d' ' -f1)"
          # Preuve pipeline du deep-link OAuth : le scheme melodix DOIT figurer
          # dans un intent-filter de l'APK (sinon le callback ne revient jamais).
          # La ligne 'schemes:' de dump badging est le canal STABLE d'aapt2
          # (le format xmltree varie selon les toolchains → grep fragile).
          SCHEMES_LINE=$("$AAPT2" dump badging "$APK" | grep '^schemes:' || true)
          echo "schemes déclarés : $SCHEMES_LINE"
          # Token EXACT 'melodix' (sans ça, 'com.souxch06.melodix' ferait un
          # faux positif à lui seul).
          if echo "$SCHEMES_LINE" | tr ' ,' '\n' | grep -qx 'melodix'; then
            echo "::notice title=Deep link OAuth::scheme melodix présent dans l'APK (melodix://callback déclenchable)"
          else
            echo "::error title=Deep link OAuth::scheme melodix ABSENT de l'APK — le retour Spotify ne fonctionnera pas"
          fi

      - name: Diagnostic OAuth Spotify (TEMPORAIRE — build de test)
        # Oracle build-level : révèle QUELLE branche de la chaîne
        # input → Variable GitHub → défaut embarqué a gagné, sans exposer
        # d'identifiant complet (préfixe 6 + longueur + hash court).
        env:
          APK: ${{ steps.apk.outputs.name }}
          INP_CID: ${{ inputs.spotify_client_id }}
          VAR_CID: ${{ vars.SPOTIFY_CLIENT_ID }}
          INP_URI: ${{ inputs.spotify_redirect_uri }}
          VAR_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
        run: |
          fp() { if [ -n "$1" ]; then echo "SET(len=${#1}, prefix=${1:0:6}…, sha12=$(printf %s "$1" | sha256sum | cut -c1-12))"; else echo "<vide>"; fi; }
          echo "::notice title=SPOTIFY-DIAG 1/3 client_id::input=$(fp "$INP_CID") | vars=$(fp "$VAR_CID") | ret=[ENV] $(fp "$SPOTIFY_CLIENT_ID")"
          echo "::notice title=SPOTIFY-DIAG 2/3 redirect_uri::input='${INP_URI:-<vide>}' | vars='${VAR_URI:-<vide>}' | ret=[ENV] '${SPOTIFY_REDIRECT_URI}'"
          echo "::notice title=SPOTIFY-DIAG 2/3 redirect_uri expo-public::ret=[ENV] '${EXPO_PUBLIC_SPOTIFY_REDIRECT_URI}'"
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          SL=$("$AAPT2" dump badging "$APK" | grep '^schemes:' || true)
          echo "::notice title=SPOTIFY-DIAG 3/3 schemes APK::${SL:-aucune ligne schemes:}"

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publier l'APK de TEST (diagnostic OAuth uniquement)
        if: ${{ inputs.publish_test_apk && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
          URI: ${{ inputs.spotify_redirect_uri || vars.SPOTIFY_REDIRECT_URI || 'melodix://callback' }}
        run: |
          gh release create spotify-oauth-test "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TEST OAuth Spotify (diagnostic — JAMAIS en usage normal)" \
            --notes "Build de TEST. Redirect URI embarqué : $URI. Revenir à la release officielle pour l'usage normal." \
            --prerelease || gh release upload spotify-oauth-test "$APK" --clobber

      - name: Joindre l'APK à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          APK: ${{ steps.apk.outputs.name }}
        run: gh release upload "$TAG" "$APK" --clobber
