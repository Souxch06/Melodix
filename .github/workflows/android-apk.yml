name: APK Android

on:
  pull_request:
  workflow_dispatch:
    inputs:
      spotify_client_id:
        description: 'Client ID Spotify de test'
        required: false
        type: string
      spotify_redirect_uri:
        # Vide = on laisse la chaîne Variables → défaut natif décider.
        description: 'Redirect URI Spotify de test (vide = défaut natif)'
        required: false
        default: 'melodix://callback'
        type: string
      publish_test_apk:
        description: "Publier l'APK dans la pré-release TEST OAuth Spotify"
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # URL du backend Melodix intégrée à l'APK (métadonnées Spotify, voir
      # server/). Variable de dépôt MELODIX_BACKEND_URL (Settings → Secrets and
      # variables → Actions → onglet Variables). Sans elle, l'app retombe sur
      # le catalogue Audius et l'historique local — jamais de config Spotify.
      MELODIX_BACKEND_URL: ${{ vars.MELODIX_BACKEND_URL }}
      # Facultatif : clé API Audius intégrée à l'APK (gratuite, dashboard Audius).
      # Sans elle, la couche audio interroge les nœuds publics de découverte.
      AUDIUS_API_KEY: ${{ vars.AUDIUS_API_KEY }}
      # Client ID de l'application Spotify « Melodix » du mainteneur (OAuth
      # PKCE au démarrage ; un Client ID n'est pas secret). Variable de dépôt
      # optionnelle : SANS LUI, l'APK compile et l'écran de connexion affiche
      # proprement « Connexion Spotify non configurée » — JAMAIS d'identifiant
      # d'une application tierce/exemple embarqué en production.
      # Deux canaux d'injection : extra de app.config (asset natif) + inlinage
      # Metro EXPO_PUBLIC_* (robuste en APK bare — voir services/spotify/authConfig).
      # Client ID Spotify : inputs (test) → Variables du dépôt → ABSENT sinon.
      # OAuth PKCE : aucun secret n'entre jamais ici — l'ID est public par
      # conception, mais il n'existe que si le mainteneur l'a créé.
      SPOTIFY_CLIENT_ID: ${{ inputs.spotify_client_id || vars.SPOTIFY_CLIENT_ID || '' }}
      EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ inputs.spotify_client_id || vars.SPOTIFY_CLIENT_ID || '' }}
      # Redirect URI OAuth → même chaîne : inputs → Variables → DÉFAUT NATIF
      # de production (melodix://callback, scheme déclaré dans le manifest en
      # permanence ; à déclarer identique dans le dashboard Spotify).
      SPOTIFY_REDIRECT_URI: ${{ inputs.spotify_redirect_uri || vars.SPOTIFY_REDIRECT_URI || 'melodix://callback' }}
      EXPO_PUBLIC_SPOTIFY_REDIRECT_URI: ${{ inputs.spotify_redirect_uri || vars.SPOTIFY_REDIRECT_URI || 'melodix://callback' }}
      # Facultatif : empreinte SHA-256 du certificat attendue pour garantir que
      # deux APK successifs restent installables en mise à jour. Laisser vide
      # vérifie tout de même signature + certificat, sans inventer de clé CI.
      EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 || '' }}
      # Sur pull_request, github.sha est le commit de merge synthétique. On
      # construit et nomme explicitement le vrai HEAD de la branche testée.
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # AUCUN Client Secret / refresh token dans l'APK : le Client Secret n'existe
      # pas côté mobile (PKCE), aucun secret serveur dans le bundle.
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Valider la config Spotify injectée (Client ID 32-hex ou absent)
        # Contrat STRICT — jamais d'application Spotify tierce/exemple :
        #   valeur VALIDE  → utilisée telle quelle ;
        #   valeur VIDE    → vide (l'APK compile, l'app affiche « Connexion
        #                    Spotify non configurée » — le reste de l'app
        #                    reste fonctionnel) ;
        #   valeur INVALIDE (ex. un ACCESS TOKEN BQBrpi… collé à la place —
        #                    diagnostic « SPOTIFY-DIAG » historique)
        #                  → ERREUR CLAIRE et ÉCHEC du workflow AVANT tout
        #                    build : une mauvaise configuration n'est jamais
        #                    masquée en injectant une autre application.
        run: |
          norm_cid() {
            if [ -z "$1" ]; then echo ''; return 0; fi
            if echo "$1" | grep -qiE '^[0-9a-f]{32}$'; then echo "$1"; return 0; fi
            return 1
          }
          norm_uri() { echo "$1" | grep -qiE '^[a-z][a-z0-9+.-]*://[^/]+' && echo "$1" || echo 'melodix://callback'; }
          if ! CID="$(norm_cid "${SPOTIFY_CLIENT_ID:-}")"; then
            echo "::error title=SPOTIFY_CLIENT_ID invalide::la valeur injectée (via inputs/vars) n'est pas un Client ID Spotify valide (32 caractères hexadécimaux attendus). Corrigez la Variable de dépôt SPOTIFY_CLIENT_ID ou laissez-la VIDE pour compiler une build « Spotify non configuré ». Melodix n'injecte JAMAIS l'identifiant d'une autre application Spotify. (prefix=${SPOTIFY_CLIENT_ID:0:6}…, len=${#SPOTIFY_CLIENT_ID})"
            exit 1
          fi
          RU="$(norm_uri "${SPOTIFY_REDIRECT_URI:-}")"
          # Protection : JAMAIS de secret dans l'APK (un « client secret » ne
          # ressemble jamais à exigé ici, mais la validation 32-hex borne déjà).
          {
            echo "SPOTIFY_CLIENT_ID=$CID"
            echo "EXPO_PUBLIC_SPOTIFY_CLIENT_ID=$CID"
            echo "SPOTIFY_REDIRECT_URI=$RU"
            echo "EXPO_PUBLIC_SPOTIFY_REDIRECT_URI=$RU"
          } >> "$GITHUB_ENV"
          if [ "$RU" != "${SPOTIFY_REDIRECT_URI:-}" ]; then
            echo "::warning title=Redirect URI Spotify rejetée::la valeur injectée n'était pas un redirect valide — le défaut natif melodix://callback a été repris (valeur: ${SPOTIFY_REDIRECT_URI:-<vide>})"
          fi

      - name: Installer Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps

      - name: Vérifier TypeScript, ESLint et Prettier
        run: |
          npx tsc --noEmit
          npm run lint
          npm run prettier:check

      - name: Tests JavaScript / React Native
        # Les tests pilotent eux-mêmes les états OAuth configuré/absent. Ils ne
        # doivent pas dépendre des Variables du dépôt injectées pour l'APK.
        env:
          SPOTIFY_CLIENT_ID: ''
          EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ''
          SPOTIFY_REDIRECT_URI: ''
          EXPO_PUBLIC_SPOTIFY_REDIRECT_URI: ''
        run: |
          set -o pipefail
          npm test -- --runInBand 2>&1 | tee jest.log

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install

      - name: Vérifier la configuration Android générée
        run: |
          # APK universel : ne pas retirer x86/x86_64 sans connaître l'appareil
          # cible. Le gradle.properties Expo généré doit conserver les quatre ABI.
          grep -Fq "applicationId 'com.souxch06.melodix'" android/app/build.gradle
          grep -Fq "namespace 'com.souxch06.melodix'" android/app/build.gradle
          grep -Fq 'versionCode 44008' android/app/build.gradle
          grep -Fq 'versionName "4.4.8-diagnostic"' android/app/build.gradle
          grep -Eq '^reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64$' android/gradle.properties
          grep -Fq 'android:scheme="melodix"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'expo.modules.melodixmedia.MelodixMediaService' android/app/src/main/AndroidManifest.xml
          for permission in RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE SYSTEM_ALERT_WINDOW; do
            # blockedPermissions laisse volontairement une directive
            # tools:node="remove" dans le manifest source ; elle n'est pas une
            # permission du manifest fusionné final.
            if grep -F "android.permission.$permission" android/app/src/main/AndroidManifest.xml | grep -Fvq 'tools:node="remove"'; then
              echo "::error title=Permission Android inattendue::$permission ne correspond à aucune fonction de Melodix"
              exit 1
            fi
          done

      # Tests unitaires JVM du module natif (Robolectric) — exécutés AVANT
      # l'assemble : un invariant Media3 cassé doit bloquer la release, pas
      # passer en production. (4.4.8 : invariants d'état VirtualMediaPlayer.)
      - name: Tests Kotlin du module média (Robolectric)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :melodix-media:testDebugUnitTest --console=plain 2>&1 | tee ../gradle-test.log

      - name: Compiler l'APK
        working-directory: android
        run: |
          set -o pipefail
          # Conserver les quatre ABI Expo/RN : l'APK reste installable sur ARM
          # physique comme sur appareil/émulateur x86 ou x86_64.
          ./gradlew assembleRelease --console=plain 2>&1 | tee ../gradle-build.log

      - name: Afficher l'erreur de compilation
        if: failure()
        run: |
          # Remonte l'erreur Gradle en annotation (visible dans l'onglet Actions et via l'API GitHub)
          esc() { local s="$1"; s="${s//'%'/'%25'}"; s="${s//$'\r'/'%0D'}"; s="${s//$'\n'/'%0A'}"; printf '%s' "$s"; }
          for LOG in gradle-build.log gradle-test.log jest.log; do
            [ -f "$LOG" ] || continue
            WHAT=$(awk '/What went wrong/{f=1} f{print} /^\* Try:/{if(f) exit}' "$LOG" | head -60)
            if [ -n "$WHAT" ]; then echo "::error title=Gradle ($LOG)::$(esc "$WHAT")"; fi
            ERRS=$(grep -E '^e: |error:|Error:|FAILED|AssertionError|^FAIL |Test Suites:.*failed|Tests:.*failed' "$LOG" | head -40 || true)
            if [ -n "$ERRS" ]; then echo "::error title=Erreurs ($LOG)::$(esc "$ERRS")"; fi
          done

      - name: Nommer l'APK
        id: apk
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            VERSION="$TAG"
          else
            VERSION="v$(node -p "require('./package.json').version")-${BUILD_SHA::7}"
          fi
          NAME="Melodix-${VERSION}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "### 📱 $NAME"
            echo ""
            echo "- Commit source : \`$BUILD_SHA\`"
            echo "- Taille : $(du -h "$NAME" | cut -f1)"
            echo "- SHA-256 : \`$(sha256sum "$NAME" | cut -d' ' -f1)\`"
            if [ -n "$MELODIX_BACKEND_URL" ]; then
              echo "- Backend Melodix : intégré ($MELODIX_BACKEND_URL)"
            else
              echo "- Backend Melodix : NON configuré — repli catalogue Audius + historique local"
            fi
            if [ -n "$AUDIUS_API_KEY" ]; then
              echo "- Clé API Audius : intégrée"
            else
              echo "- Clé API Audius : nœuds publics de découverte"
            fi
                        if [ -n "$SPOTIFY_CLIENT_ID" ]; then
              echo "- Client ID Spotify (connexion OAuth PKCE) : intégré"
            else
              echo "- Client ID Spotify : ABSENT — connexion non configurée dans cet APK"
            fi
            echo "- Audio : Audius · Métadonnées : backend Melodix · Compte : connexion Spotify OAuth PKCE (Melodix 4.0)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier intégrité, installabilité et signature de l'APK
        env:
          APK: ${{ steps.apk.outputs.name }}
          EXPECTED_PACKAGE: com.souxch06.melodix
          EXPECTED_VERSION_CODE: '44008'
          EXPECTED_VERSION_NAME: 4.4.8-diagnostic
          EXPECTED_MIN_SDK: '23'
          EXPECTED_TARGET_SDK: '34'
          EXPECTED_SCHEME: melodix
          EXPECTED_ABIS: arm64-v8a,armeabi-v7a,x86,x86_64
        run: |
          chmod +x scripts/verify-android-apk.sh
          set +e
          scripts/verify-android-apk.sh "$APK" apk-inspection.txt
          VERIFY_EXIT=$?
          set -e
          if [ "$VERIFY_EXIT" -ne 0 ]; then
            DETAIL=$(tail -80 apk-inspection.txt 2>/dev/null || echo 'rapport indisponible')
            DETAIL="${DETAIL//'%'/'%25'}"; DETAIL="${DETAIL//$'\r'/'%0D'}"; DETAIL="${DETAIL//$'\n'/'%0A'}"
            echo "::error title=APK non publiable::$DETAIL"
            exit "$VERIFY_EXIT"
          fi
          INFO=$(grep -E "^(package|application-label|sdkVersion|minSdkVersion|targetSdkVersion|native-code):" apk-inspection.txt | tr '\n' ' ')
          CERT=$(grep '^Signer #1 certificate SHA-256 digest:' apk-inspection.txt | head -1)
          echo "::notice title=$APK::$INFO| $CERT | taille $(du -h "$APK" | cut -f1) | sha256 $(sha256sum "$APK" | cut -d' ' -f1)"
          echo "::notice title=Deep link OAuth::scheme melodix présent dans l'APK (melodix://callback déclenchable)"

      - name: Diagnostic OAuth Spotify (TEMPORAIRE — build de test)
        # Oracle build-level : révèle QUELLE branche de la chaîne
        # input → Variable GitHub → défaut embarqué a gagné, sans exposer
        # d'identifiant complet (préfixe 6 + longueur + hash court).
        env:
          APK: ${{ steps.apk.outputs.name }}
          INP_CID: ${{ inputs.spotify_client_id }}
          VAR_CID: ${{ vars.SPOTIFY_CLIENT_ID }}
          INP_URI: ${{ inputs.spotify_redirect_uri }}
          VAR_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
        run: |
          fp() { if [ -n "$1" ]; then echo "SET(len=${#1}, prefix=${1:0:6}…, sha12=$(printf %s "$1" | sha256sum | cut -c1-12))"; else echo "<vide>"; fi; }
          echo "::notice title=SPOTIFY-DIAG 1/3 client_id::input=$(fp "$INP_CID") | vars=$(fp "$VAR_CID") | ret=[ENV] $(fp "$SPOTIFY_CLIENT_ID")"
          echo "::notice title=SPOTIFY-DIAG 2/3 redirect_uri::input='${INP_URI:-<vide>}' | vars='${VAR_URI:-<vide>}' | ret=[ENV] '${SPOTIFY_REDIRECT_URI}'"
          echo "::notice title=SPOTIFY-DIAG 2/3 redirect_uri expo-public::ret=[ENV] '${EXPO_PUBLIC_SPOTIFY_REDIRECT_URI}'"
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          SL=$("$AAPT2" dump badging "$APK" | grep '^schemes:' || true)
          echo "::notice title=SPOTIFY-DIAG 3/3 schemes APK::${SL:-aucune ligne schemes:}"

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            ${{ steps.apk.outputs.name }}
            apk-inspection.txt
          if-no-files-found: error

      - name: Publier l'APK de TEST (diagnostic OAuth uniquement)
        if: ${{ inputs.publish_test_apk && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
          URI: ${{ inputs.spotify_redirect_uri || vars.SPOTIFY_REDIRECT_URI || 'melodix://callback' }}
        run: |
          gh release create spotify-oauth-test "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TEST OAuth Spotify (diagnostic — JAMAIS en usage normal)" \
            --notes "Build de TEST. Redirect URI embarqué : $URI. Revenir à la release officielle pour l'usage normal." \
            --prerelease || gh release upload spotify-oauth-test "$APK" --clobber

      - name: Joindre l'APK à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          APK: ${{ steps.apk.outputs.name }}
        run: gh release upload "$TAG" "$APK" --clobber
