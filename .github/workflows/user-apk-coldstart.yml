name: User APK cold start (exact file)
on:
  push:
    branches: [claude/melodix-native-login-visibility-xfjyai]
    paths: [diagnostics/user-apk/**, scripts/user_apk_coldstart.sh, .github/workflows/user-apk-coldstart.yml]
permissions:
  contents: read
jobs:
  coldstart:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: original, apk: diagnostics/user-apk/Melodix-Preview-1022454.apk, sha: 2cde36585b4cf37fe104d4d82e1d29592bcba1b0dca235005d97b350db7e4c88}
          - {name: fixed, apk: diagnostics/user-apk/Melodix-Preview-1022454-fixed-testkey.apk, sha: c65ee8919b904bfbd58316fe416d977c088a3a17ea4842b12b5c2fb971c4ee19}
    steps:
      - uses: actions/checkout@v4
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot'
          script: bash scripts/user_apk_coldstart.sh ${{ matrix.apk }} ${{ matrix.sha }}
      - if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: user-apk-coldstart-${{ matrix.name }}
          path: user-apk-evidence
