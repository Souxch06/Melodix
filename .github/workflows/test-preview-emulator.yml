          sleep 1
          dump_ui "31_library_geometry"
          adb exec-out screencap -p > "$state/31_library.png" 2>/dev/null || true
          python3 - "$state" <<'PY'
          import glob, os, re, sys, xml.etree.ElementTree as ET
          state = sys.argv[1]
          pngs = sorted(glob.glob(os.path.join(state, "*.png")))
          print(f"::notice title=Rendered screenshots::{len(pngs)} captures: " + ", ".join(os.path.basename(p) for p in pngs))
          issues = []
          for xml_path in sorted(glob.glob(os.path.join(state, "2*.xml"))) + sorted(glob.glob(os.path.join(state, "3*.xml"))):
              try:
                  root = ET.parse(xml_path).getroot()
              except Exception:
                  continue
              for node in root.iter():
                  txt = ((node.get("text") or "") + " " + (node.get("content-desc") or "")).strip()
