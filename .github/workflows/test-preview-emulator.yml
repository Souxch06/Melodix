          send_ui "home" '[{"title":"Ma Playlist Tardive","subtitle":"Succes tardif","uri":"spotify:playlist:late1","section":"Vos playlists"}]'
          send_ui "home" '[{"title":"Aucune playlist dans ce compte","subtitle":"Revenez plus tard","section":"Accueil"}]'
          send_ui "home" '[{"title":"Impossible de charger les playlists","subtitle":"Reessayez","section":"Accueil"}]'
