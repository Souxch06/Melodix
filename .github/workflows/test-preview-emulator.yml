name: Smoke test Preview APK on Android emulator

on:
  push:
    branches:
      - arena/7142700d-melodix
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full commit SHA to build and verify on Android emulator
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  emulator-e2e:
    name: Build Preview APK and verify startup, home, navigation, search, library, back, and logout on Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out target source commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build tools and Node tests check
        run: |
          set -euo pipefail
          node --test tests/*.test.js
          sdkmanager --install "build-tools;35.0.0"

      - name: Build production Preview APK and E2E instrumentation APK for exact commit SHA
        id: build
        env:
          MELODIX_PREVIEW_KEYSTORE_B64: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_B64 }}
          MELODIX_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
          MELODIX_PREVIEW_KEY_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEY_PASSWORD || secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE"
          framework_dir="$RUNNER_TEMP/melodix-framework"
          out_dir="$GITHUB_WORKSPACE/emulator-output"
          mkdir -p "$framework_dir" "$out_dir"

          curl --fail --silent --show-error --location \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            --output "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" if --frame-path "$framework_dir" \
            "$source_dir/android/apktool-framework/1.apk"

          signing_keystore="$RUNNER_TEMP/preview-signing.jks"
          if [[ -n "$MELODIX_PREVIEW_KEYSTORE_B64" && -n "$MELODIX_PREVIEW_KEYSTORE_PASSWORD" ]]; then
            printf '%s' "$MELODIX_PREVIEW_KEYSTORE_B64" | base64 --decode > "$signing_keystore"
            alias_name="MELODIX_PREVIEW"
            export KS_PASS="$MELODIX_PREVIEW_KEYSTORE_PASSWORD"
            export KEY_PASS="$MELODIX_PREVIEW_KEY_PASSWORD"
          else
            alias_name="LAUNCH_TEST"
            export KS_PASS="melodix-preview-test"
            export KEY_PASS="melodix-preview-test"
            keytool -genkeypair -keystore "$signing_keystore" -alias "$alias_name" -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass:env KS_PASS -keypass:env KEY_PASS \
              -dname "CN=Melodix Preview Test, O=Melodix, C=FR" >/dev/null
          fi
          keytool -exportcert -alias "$alias_name" -keystore "$signing_keystore" \
            -storepass:env KS_PASS -file "$RUNNER_TEMP/cert.der" >/dev/null
          fingerprint_hex="$(sha256sum "$RUNNER_TEMP/cert.der" | awk '{print toupper($1)}')"
          preview_fingerprint="$(printf '%s' "$fingerprint_hex" | fold -w 2 | paste -sd ':' -)"

          build_variant() {
            local mode="$1"
            local out_name="$2"
            local vcode="$3"
            local work_dir="$RUNNER_TEMP/work-$mode"
            mkdir -p "$work_dir"
            for item in AndroidManifest.xml META-INF apktool.yml assets kotlin lib original res smali unknown; do
              cp -a "$source_dir/$item" "$work_dir/"
            done

            python3 - "$work_dir/AndroidManifest.xml" "$GITHUB_SHA" <<'PY'
          import sys, xml.etree.ElementTree as ET
          manifest_path, sha = sys.argv[1], sys.argv[2][:7]
          ns = "http://schemas.android.com/apk/res/android"
          a = "{" + ns + "}"
          ET.register_namespace("android", ns)
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          orig, prev = "com.melodix.music", "com.melodix.music.preview"
          root.set("package", prev)
          for el in root.iter():
              if el.get(a + "name") == orig + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION":
                  el.set(a + "name", prev + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION")
              auth = el.get(a + "authorities")
              if auth and auth.startswith(orig + "."):
                  el.set(a + "authorities", prev + auth[len(orig):])
              if el.get(a + "label") == "Melodix":
                  el.set(a + "label", "Melodix Preview " + sha)
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True, short_empty_elements=True)
          PY

            if [[ "$mode" == "e2e" ]]; then
              python3 - "$work_dir/smali/com/melodix/music/MainActivity.smali" <<'PY'
          import sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          anchor = ".method public final onNewIntent(Landroid/content/Intent;)V"
          start = src.index(anchor)
          end = src.index(".end method", start)
          method = src[start:end].replace("    .locals 2", "    .locals 5", 1)
          old_tail = "    :cond_1\n    return-void"
          assert old_tail in method, "Expected :cond_1 tail in MainActivity.onNewIntent"
          e2e_hook = """    :cond_1
              if-eqz p1, :e2e_done
              const-string v0, "e2e_type"
              invoke-virtual {p1, v0}, Landroid/content/Intent;->getStringExtra(Ljava/lang/String;)Ljava/lang/String;
              move-result-object v0
              if-eqz v0, :e2e_done
              iget-object v1, p0, Lcom/melodix/music/MainActivity;->G:Landroid/webkit/WebView;
              if-eqz v1, :e2e_after_blank
              const-string v2, "about:blank"
              invoke-virtual {v1, v2}, Landroid/webkit/WebView;->loadUrl(Ljava/lang/String;)V
              :e2e_after_blank
              const-string v1, "e2e_b64"
              invoke-virtual {p1, v1}, Landroid/content/Intent;->getStringExtra(Ljava/lang/String;)Ljava/lang/String;
              move-result-object v1
              if-eqz v1, :e2e_check_logout
              const/4 v2, 0x0
              invoke-static {v1, v2}, Landroid/util/Base64;->decode(Ljava/lang/String;I)[B
              move-result-object v1
              new-instance v2, Ljava/lang/String;
              const-string v3, "UTF-8"
              invoke-direct {v2, v1, v3}, Ljava/lang/String;-><init>([BLjava/lang/String;)V
              invoke-virtual {p0, v0, v2}, Lcom/melodix/music/MainActivity;->postNativeUiData(Ljava/lang/String;Ljava/lang/String;)V
              return-void
              :e2e_check_logout
              const-string v1, "logout_race"
              invoke-virtual {v0, v1}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
              move-result v1
              if-eqz v1, :e2e_check_recreate
              new-instance v3, Lcom/melodix/music/AndBridge;
              invoke-virtual {p0}, Landroid/content/Context;->getApplicationContext()Landroid/content/Context;
              move-result-object v4
              invoke-direct {v3, v4}, Lcom/melodix/music/AndBridge;-><init>(Landroid/content/Context;)V
              new-instance v4, Lcom/melodix/music/NativeHomeJsonCallback;
              invoke-direct {v4, p0}, Lcom/melodix/music/NativeHomeJsonCallback;-><init>(Lcom/melodix/music/MainActivity;)V
              new-instance v1, Lcom/melodix/music/NativeUiUpdateRunnable;
              const-string v2, "home-greeting"
              const-string v0, "Fuite Tardive Compte A"
              const/4 p1, 0x1
              invoke-direct {v1, p0, v2, v0, p1}, Lcom/melodix/music/NativeUiUpdateRunnable;-><init>(Lcom/melodix/music/MainActivity;Ljava/lang/String;Ljava/lang/String;I)V
              new-instance v2, Lcom/melodix/music/NativeHomeRetryRunnable;
              const/4 p1, 0x2
              invoke-direct {v2, p0, p1}, Lcom/melodix/music/NativeHomeRetryRunnable;-><init>(Lcom/melodix/music/MainActivity;I)V
              invoke-virtual {v2}, Lcom/melodix/music/NativeHomeRetryRunnable;->run()V
              invoke-virtual {p0}, Lcom/melodix/music/MainActivity;->resetNativeStateForLogout()V
              invoke-virtual {v1}, Lcom/melodix/music/NativeUiUpdateRunnable;->run()V
              const-string v2, "home-greeting"
              const-string v0, "Fuite Tardive Compte A"
              invoke-virtual {v3, v2, v0}, Lcom/melodix/music/AndBridge;->onNativeUiData(Ljava/lang/String;Ljava/lang/String;)V
              const-string v0, "[{\\"title\\":\\"Fuite Tardive Compte A\\",\\"uri\\":\\"spotify:playlist:99\\"}]"
              invoke-virtual {v4, v0}, Lcom/melodix/music/NativeHomeJsonCallback;->onReceiveValue(Ljava/lang/Object;)V
              return-void
              :e2e_check_recreate
              const-string v1, "recreate"
              invoke-virtual {v0, v1}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
              move-result v1
              if-eqz v1, :e2e_check_singleton_bridge
              invoke-virtual {p0}, Landroid/app/Activity;->recreate()V
              return-void
              :e2e_check_singleton_bridge
              const-string v1, "singleton_bridge"
              invoke-virtual {v0, v1}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
              move-result v1
              if-eqz v1, :e2e_only_logout
              new-instance v3, Lcom/melodix/music/AndBridge;
              invoke-virtual {p0}, Landroid/content/Context;->getApplicationContext()Landroid/content/Context;
              move-result-object v4
              invoke-direct {v3, v4}, Lcom/melodix/music/AndBridge;-><init>(Landroid/content/Context;)V
              invoke-virtual {v3}, Lcom/melodix/music/AndBridge;->onNativeUiReady()V
              const-string v1, "home-greeting"
              const-string v2, "Session Recreee OK"
              invoke-virtual {v3, v1, v2}, Lcom/melodix/music/AndBridge;->onNativeUiData(Ljava/lang/String;Ljava/lang/String;)V
              return-void
              :e2e_only_logout
              const-string v1, "logout"
              invoke-virtual {v0, v1}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
              move-result v1
              if-eqz v1, :e2e_done
              new-instance v0, Lcom/melodix/music/NativeLogoutRunnable;
              invoke-direct {v0, p0}, Lcom/melodix/music/NativeLogoutRunnable;-><init>(Lcom/melodix/music/MainActivity;)V
              invoke-virtual {p0, v0}, Landroid/app/Activity;->runOnUiThread(Ljava/lang/Runnable;)V
              :e2e_done
              return-void"""
          patched = method.replace(old_tail, e2e_hook, 1)
          open(p, "w", encoding="utf-8").write(src[:start] + patched + src[end:])
          PY
            fi

            find "$work_dir" -type f -name '*.smali' -exec sed -i \
              's/com\.melodix\.music\.PIP_/com.melodix.music.preview.PIP_/g' {} +
            sed -i -E "s#(<string name=\"app_name\">)[^<]*(</string>)#\1Melodix Preview ${GITHUB_SHA:0:7}\2#" \
              "$work_dir/res/values/strings.xml"
            sed -i -E "s#<string name=\"expected_signature_sha256\">[^<]*</string>#<string name=\"expected_signature_sha256\">$preview_fingerprint</string>#" \
              "$work_dir/res/values/strings.xml"
            sed -i -E "s/^apkFileName:.*/apkFileName: $out_name/" "$work_dir/apktool.yml"
            sed -i -E "s/^  versionCode: .*/  versionCode: $vcode/" "$work_dir/apktool.yml"
            sed -i -E "s/^  versionName: .*/  versionName: 1.2.2-${GITHUB_SHA:0:7}/" "$work_dir/apktool.yml"

            java -jar "$RUNNER_TEMP/apktool.jar" b "$work_dir" --frame-path "$framework_dir" \
              --output "$RUNNER_TEMP/$mode-unsigned.apk" --force-all > "$out_dir/apktool-$mode.log" 2>&1
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 \
              "$RUNNER_TEMP/$mode-unsigned.apk" "$RUNNER_TEMP/$mode-aligned.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$signing_keystore" --ks-key-alias "$alias_name" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --out "$out_dir/$out_name" "$RUNNER_TEMP/$mode-aligned.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 24 "$out_dir/$out_name" >/dev/null
          }

          build_variant "prod" "Melodix-Preview-${GITHUB_SHA:0:7}.apk" "$((1020229 + GITHUB_RUN_NUMBER))"
          build_variant "e2e" "Melodix-Preview-E2E-${GITHUB_SHA:0:7}.apk" "$((1020230 + GITHUB_RUN_NUMBER))"
          echo "prod_apk=emulator-output/Melodix-Preview-${GITHUB_SHA:0:7}.apk" >> "$GITHUB_OUTPUT"
          echo "e2e_apk=emulator-output/Melodix-Preview-E2E-${GITHUB_SHA:0:7}.apk" >> "$GITHUB_OUTPUT"

      - name: Boot KVM-accelerated Android 15 emulator
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo 'no' | avdmanager create avd --force --name MelodixE2E \
            --package "system-images;android-35;google_apis;x86_64" --device pixel_2 >/dev/null
          "$ANDROID_HOME/emulator/emulator" -avd MelodixE2E \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb start-server >/dev/null
          for _ in $(seq 1 100); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              adb shell settings put global window_animation_scale 0
              adb shell settings put global transition_animation_scale 0
              adb shell settings put global animator_duration_scale 0
              echo "::notice title=Android Emulator::Booted API $(adb shell getprop ro.build.version.sdk | tr -d '\r') on $(uname -m)"
              exit 0
            fi
            sleep 5
          done
          grep -Ei 'error|fatal|panic' "$RUNNER_TEMP/emulator.log" | tail -n 10 || true
          exit 1

      - name: Phase 1 — Verify unmodified signed Preview APK cold startup & WebView session state
        env:
          PROD_APK: ${{ steps.build.outputs.prod_apk }}
        run: |
          set -euo pipefail
          pkg="com.melodix.music.preview"
          state="$GITHUB_WORKSPACE/emulator-output/phase1"
          mkdir -p "$state"
          adb install -r -t "$GITHUB_WORKSPACE/$PROD_APK"
          ver="$(adb shell dumpsys package "$pkg" | grep -m1 'versionName=' | tr -d ' \r')"
          echo "::notice title=Phase 1 Installed APK::$ver (commit=$GITHUB_SHA)"
          if [[ "$ver" != "versionName=1.2.2-${GITHUB_SHA:0:7}" ]]; then
            echo "::error::Installed APK versionName ($ver) does not match 1.2.2-${GITHUB_SHA:0:7}"
            exit 1
          fi
          for perm in android.permission.POST_NOTIFICATIONS android.permission.BLUETOOTH_CONNECT; do
            adb shell pm grant "$pkg" "$perm" >/dev/null 2>&1 || true
          done

          for label in cold_launch_1 cold_launch_2; do
            adb logcat -c || true
            adb logcat -c -b crash || true
            adb shell am force-stop "$pkg" || true
            adb shell am start -n "$pkg/com.melodix.music.MainActivity" >/dev/null
            sleep 3
            init_pid="$(adb shell pidof "$pkg" | tr -d '\r' | awk '{print $1}')"
            sleep 27
            pid="$(adb shell pidof "$pkg" | tr -d '\r' | awk '{print $1}')"
            resumed="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tr '\n\r' '  ')"
            adb shell uiautomator dump --compressed /sdcard/p1.xml >/dev/null 2>&1 || true
            adb exec-out cat /sdcard/p1.xml > "$state/$label.xml" 2>/dev/null || true
            if [[ -z "$pid" ]] || [[ "$pid" != "$init_pid" ]] || ! grep -Fq "$pkg/com.melodix.music.MainActivity" <<< "$resumed"; then
              echo "::error title=Phase 1 $label::Process died/respawned (init=$init_pid cur=$pid) or MainActivity not resumed ($resumed)"
              exit 1
            fi
            adb logcat -d -v brief > "$state/$label-logcat.txt" 2>&1 || true
            adb logcat -d -b crash -v brief >> "$state/$label-logcat.txt" 2>&1 || true
            if grep -qE "MelodixCrash|NativeCrashGuard|VerifyError|IncompatibleClassChangeError|LinkageError|WindowManager\\\$BadTokenException|ReferenceError: cleanText" "$state/$label-logcat.txt" || grep -qF "Process: $pkg" "$state/$label-logcat.txt"; then
              p1_diag="$(grep -nE "Process: $pkg|MelodixCrash|NativeCrashGuard|VerifyError|IncompatibleClassChangeError|LinkageError|WindowManager\\\$BadTokenException|ReferenceError: cleanText" "$state/$label-logcat.txt" | head -n 15 | tr '\n\r' ' | ')"
              echo "::error title=Phase 1 $label Logcat::$p1_diag"
              exit 1
            fi
            echo "::notice title=Phase 1 $label::PASS (stable pid=$pid, MainActivity foreground, 0 crashes/verifier/JS errors across all PIDs)"
          done

      - name: Phase 2 — Verify Home, Detail, Player, Library, Search, Android Back button, and Logout end-to-end
        env:
          E2E_APK: ${{ steps.build.outputs.e2e_apk }}
        run: |
          set -euo pipefail
          pkg="com.melodix.music.preview"
          state="$GITHUB_WORKSPACE/emulator-output/phase2"
          mkdir -p "$state"
          adb install -r -t "$GITHUB_WORKSPACE/$E2E_APK"
          for perm in android.permission.POST_NOTIFICATIONS android.permission.BLUETOOTH_CONNECT; do
            adb shell pm grant "$pkg" "$perm" >/dev/null 2>&1 || true
          done

          adb logcat -c || true
          adb logcat -c -b crash || true
          adb shell am force-stop "$pkg" || true
          adb shell am start -n "$pkg/com.melodix.music.MainActivity" >/dev/null
          sleep 12

          LAST_XML=""
          trap 'rc=$?; crash_tail="$(adb logcat -d -b crash -v brief 2>/dev/null | tail -n 12 | tr "\n\r" "  " || true)"; echo "::error title=Phase 2 failure at line $LINENO (rc=$rc)::last_xml=$LAST_XML crash=$crash_tail"' ERR

          dump_ui() {
            local name="$1"
            sleep 2
            adb shell uiautomator dump --compressed "/sdcard/$name.xml" >/dev/null 2>&1 || true
            adb exec-out cat "/sdcard/$name.xml" > "$state/$name.xml"
            LAST_XML="$state/$name.xml"
          }

          tap_text() {
            local xml="$1"
            local needle="$2"
            read -r cx cy < <(python3 - "$xml" "$needle" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          needle = sys.argv[2].lower()
          for node in root.iter():
              txt = (node.get("text") or "") + " " + (node.get("content-desc") or "")
              if needle in txt.lower():
                  m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.get("bounds") or "")
                  if m:
                      x1, y1, x2, y2 = map(int, m.groups())
                      if x2 > x1 and y2 > y1:
                          print((x1 + x2) // 2, (y1 + y2) // 2)
                          sys.exit(0)
          raise SystemExit(f"Could not find UI element matching {needle!r}")
          PY
            )
            adb shell input tap "$cx" "$cy"
          }

          assert_ui_has() {
            local xml="$1"
            local needle="$2"
            if ! python3 - "$xml" "$needle" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          all_txt = " | ".join(filter(None, ((n.get("text") or "").strip() or (n.get("content-desc") or "").strip() for n in root.iter())))
          if sys.argv[2].lower() not in all_txt.lower():
              print(f"::error title=UI assertion failed ({sys.argv[1]})::expected={sys.argv[2]!r}; visible={all_txt[:350]!r}")
              raise SystemExit(1)
          PY
            then
              cur_pid="$(adb shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)"
              mdx="$(adb logcat -d -s MDXTRACE:I NativeCrashGuard:E AndroidRuntime:E 2>/dev/null | tail -n 55 | tr '\n\r' ' | ' || true)"
              win="$(adb shell dumpsys window 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp|OnBackInvoked' | head -n 10 | tr '\n\r' ' | ' || true)"
              echo "::error title=Emulator state at failure::pid=${cur_pid} win=${win:0:350}"
              echo "::error title=Crash and MDXTRACE logcat::${mdx:0:2200}"
              exit 1
            fi
          }

          assert_ui_lacks() {
            local xml="$1"
            local needle="$2"
            python3 - "$xml" "$needle" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          all_txt = "\n".join((n.get("text") or "") + " " + (n.get("content-desc") or "") for n in root.iter())
          if sys.argv[2].lower() in all_txt.lower():
              raise SystemExit(f"Expected {sys.argv[2]!r} to be ABSENT from UI dump {sys.argv[1]}")
          PY
          }

          send_ui() {
            local typ="$1"
            local b64
            b64="$(printf '%s' "$2" | base64 -w0)"
            adb shell am start -n "$pkg/com.melodix.music.MainActivity" \
              --es e2e_type "$typ" --es e2e_b64 "$b64" >/dev/null
          }

          # 1. Home screen + greeting
          send_ui "home" '[{"title":"Mix Decouverte","subtitle":"Spotify","uri":"spotify:playlist:37i9dQZF1DXcBWIGoYBM5M","section":"Pour vous"},{"title":"Morceau Test","subtitle":"Artiste","uri":"spotify:track:4cOdK2wGLETKBW3PvgPWqT","section":"Recents"}]'
          sleep 1
          send_ui "home-greeting" "Bonsoir, Camille"
          dump_ui "01_home"
          assert_ui_has "$state/01_home.xml" "Bonsoir, Camille"
          assert_ui_has "$state/01_home.xml" "Mix Decouverte"
          echo "::notice title=E2E Home::PASS (greeting 'Bonsoir, Camille' + feed section & cards rendered)"

          # 2. Detail screen + Player + Android Back button (player -> detail -> home)
          tap_text "$state/01_home.xml" "Mix Decouverte"
          sleep 1
          send_ui "media:spotify:playlist:37i9dQZF1DXcBWIGoYBM5M" '[{"title":"Piste Un","subtitle":"Daft Punk","uri":"spotify:track:111"},{"title":"Piste Deux","subtitle":"Justice","uri":"spotify:track:222"}]'
          dump_ui "02_detail"
          assert_ui_has "$state/02_detail.xml" "Piste Un"
          send_ui "player" '{"track":"Piste Active","artist":"Daft Punk","playing":true,"position":42000,"duration":180000}'
          dump_ui "03_miniplayer"
          assert_ui_has "$state/03_miniplayer.xml" "Piste Active"
          tap_text "$state/03_miniplayer.xml" "Piste Active"
          dump_ui "04_fullplayer"
          assert_ui_has "$state/04_fullplayer.xml" "Lecture en cours"
          assert_ui_has "$state/04_fullplayer.xml" "Lu via Spotify"
          # Back #1: collapses expanded player back to detail
          adb shell input keyevent 4
          dump_ui "05_back_to_detail"
          assert_ui_has "$state/05_back_to_detail.xml" "Piste Un"
          # Back #2: restores Home screen from Detail
          adb shell input keyevent 4
          dump_ui "06_back_to_home"
          assert_ui_has "$state/06_back_to_home.xml" "Mix Decouverte"
          echo "::notice title=E2E Detail + Player + Back::PASS (Home -> Detail -> Expanded Player -> Back to Detail -> Back to Home)"

          # 3. Library screen + Filter Chips + Android Back
          tap_text "$state/06_back_to_home.xml" "Biblioth"
          sleep 1
          send_ui "media:playlists" '[{"title":"Ma Playlist Test","subtitle":"12 titres","uri":"spotify:playlist:999"}]'
          dump_ui "07_library"
          assert_ui_has "$state/07_library.xml" "Ma Playlist Test"
          assert_ui_has "$state/07_library.xml" "Albums"
          adb shell input keyevent 4
          dump_ui "08_library_back_home"
          assert_ui_has "$state/08_library_back_home.xml" "Mix Decouverte"
          echo "::notice title=E2E Library + Back::PASS (Library rows + filter chips rendered, Back returned to Home)"

          # 4. Search screen + NativeSearchFocusRunnable + text entry + IME Submit + Android Back
          tap_text "$state/08_library_back_home.xml" "Rechercher"
          sleep 1
          adb shell input text "daft"
          sleep 1
          adb shell input keyevent 66
          sleep 1
          send_ui "search:daft" '[{"title":"One More Time","subtitle":"Daft Punk","uri":"spotify:track:333"}]'
          dump_ui "09_search"
          assert_ui_has "$state/09_search.xml" "One More Time"
          # Note: if IME soft keyboard is open, first Back closes IME and second Back exits Search -> check if Search still open
          adb shell input keyevent 4
          sleep 1
          dump_ui "10_search_back_1"
          if ! python3 -c 'import sys,xml.etree.ElementTree as ET; r=ET.parse(sys.argv[1]).getroot(); sys.exit(0 if "mix decouverte" in "\n".join((n.get("text") or "") for n in r.iter()).lower() else 1)' "$state/10_search_back_1.xml"; then
            adb shell input keyevent 4
            dump_ui "10_search_back_2"
            assert_ui_has "$state/10_search_back_2.xml" "Mix Decouverte"
          fi
          echo "::notice title=E2E Search + Back::PASS (Search focused, 'daft' entered, results rendered, Back returned to Home)"

          # 5. Logout hides nativeRoot completely and clears private native state without crashing
          adb shell am start -n "$pkg/com.melodix.music.MainActivity" --es e2e_type logout >/dev/null
          sleep 6
          dump_ui "11_after_logout"
          assert_ui_lacks "$state/11_after_logout.xml" "Mix Decouverte"
          assert_ui_lacks "$state/11_after_logout.xml" "Piste Active"

          # 6. Re-login restores nativeRoot cleanly with only the new session's feed and greeting
          send_ui "home" '[{"title":"Compte Deux","subtitle":"Spotify","uri":"spotify:playlist:777","section":"Nouveau compte","image":"https://evil.tracker.example/pixel.png"}]'
          sleep 2
          send_ui "home-greeting" "Bonjour, Nouveau"
          dump_ui "12_after_relogin"
          assert_ui_has "$state/12_after_relogin.xml" "Bonjour, Nouveau"
          assert_ui_has "$state/12_after_relogin.xml" "Compte Deux"
          assert_ui_lacks "$state/12_after_relogin.xml" "Mix Decouverte"

          # 7. Deep-link & exported Intent JS injection defense + malformed JSON resilience + epoch race guard + screen rotation
          assert_pid_same() {
            local step_label="$1"
            local cur_pid
            cur_pid="$(adb shell pidof "$pkg" | tr -d '\r' | awk '{print $1}')"
            if [[ -z "$cur_pid" || "$cur_pid" != "$pid_before_sec" ]]; then
              local diag
              diag="$( { adb logcat -d -b crash -v brief 2>/dev/null; adb logcat -d -v brief 2>/dev/null; } | grep -iE 'FATAL|Exception|Error|Crash|chromium|aw_browser|WebService|LinkHandler|Melodix' | tail -n 18 | tr '\n\r' ' | ' )"
              echo "::error title=PID death at $step_label::before=$pid_before_sec after=$cur_pid trace=$diag"
              exit 1
            fi
          }
          pid_before_sec="$(adb shell pidof "$pkg" | tr -d '\r' | awk '{print $1}')"
          adb shell "am start -n '$pkg/com.melodix.music.MainActivity' --es spotify_uri \"spotify:track:1');window.__pwned=1;//\"" >/dev/null
          sleep 1
          assert_pid_same "7a_spotify_uri_inject"
          adb shell "am start -a android.intent.action.VIEW -d \"spotify:track:1');window.__pwned=1;//\" '$pkg/com.melodix.music.LinkHandler'" >/dev/null || true
          sleep 1
          assert_pid_same "7b_linkhandler_inject"
          adb shell "am start -a android.intent.action.VIEW -d 'spotify:track:4cOdK2wGLETKBW3PvgPWqT' '$pkg/com.melodix.music.LinkHandler'" >/dev/null || true
          sleep 1
          assert_pid_same "7c_linkhandler_valid"
          adb shell "am start -n '$pkg/com.melodix.music.MainActivity' --es spotify_uri \"spotify:search:Daft Punk - Veridis Quo\"" >/dev/null
          sleep 1
          assert_pid_same "7c2_shazam_search_spaces"
          adb shell "am start -n '$pkg/com.melodix.music.MainActivity' --es spotify_uri \"spotify:search:Don't Start Now\"" >/dev/null
          sleep 1
          assert_pid_same "7c3_shazam_search_apostrophe"
          adb shell 'am start -n "'"$pkg"'/com.melodix.music.MainActivity" --es spotify_uri "spotify:search:100% Pure Love"' >/dev/null
          sleep 1
          assert_pid_same "7c4_shazam_search_percent"
          send_ui "open-search" "Daft Punk: Don't Stop 100% Santé"
          sleep 1
          send_ui "search:Daft Punk: Don't Stop 100% Santé" '[{"title":"Resultat Sante","subtitle":"Daft Punk","uri":"spotify:track:999"}]'
          sleep 1
          dump_ui "12b_deep_search_special"
          assert_ui_has "$state/12b_deep_search_special.xml" "100%"
          assert_ui_has "$state/12b_deep_search_special.xml" "Resultat Sante"
          send_ui "home" "{malformed-json-payload"
          sleep 1
          assert_pid_same "7d_malformed_json"
          adb logcat -c || true
          adb shell am start -n "$pkg/com.melodix.music.MainActivity" --es e2e_type logout_race >/dev/null
          sleep 2
          assert_pid_same "7e_logout_race"
          dump_ui "13_after_epoch_race"
          assert_ui_lacks "$state/13_after_epoch_race.xml" "Fuite Tardive Compte A"
          assert_ui_lacks "$state/13_after_epoch_race.xml" "Compte Deux"

          # Real Activity.recreate() + AppSingleton.t preservation + rotation stress check
          adb shell am start -n "$pkg/com.melodix.music.MainActivity" --es e2e_type recreate >/dev/null
          sleep 3
          assert_pid_same "7f0_activity_recreate"
          adb shell am start -n "$pkg/com.melodix.music.MainActivity" --es e2e_type singleton_bridge >/dev/null
          sleep 2
          assert_pid_same "7f1_singleton_bridge_after_recreate"
          dump_ui "14_after_recreate"
          assert_ui_has "$state/14_after_recreate.xml" "Session Recreee OK"
          assert_ui_lacks "$state/14_after_recreate.xml" "Fuite Tardive Compte A"

          adb shell wm user-rotation lock 1 || true
          sleep 2
          assert_pid_same "7f_rotate_landscape"
          adb shell wm user-rotation lock 0 || true
          sleep 2
          assert_pid_same "7g_rotate_portrait"
          adb shell wm user-rotation free || true
          sleep 1
          assert_pid_same "7h_rotate_free"
          pid="$pid_before_sec"
          adb logcat -d -v brief > "$state/e2e-logcat.txt" 2>&1 || true
          adb logcat -d -b crash -v brief >> "$state/e2e-logcat.txt" 2>&1 || true
          if grep -qE "MelodixCrash|NativeCrashGuard|VerifyError|IncompatibleClassChangeError|LinkageError|IntentReceiverLeaked|WindowManager\\\$BadTokenException" "$state/e2e-logcat.txt" || grep -qF "Process: $pkg" "$state/e2e-logcat.txt"; then
            diag="$(grep -nE "Process: $pkg|MelodixCrash|NativeCrashGuard|VerifyError|IncompatibleClassChangeError|LinkageError|IntentReceiverLeaked|WindowManager\\\$BadTokenException" "$state/e2e-logcat.txt" | head -n 15 | tr '\n\r' ' | ')"
            echo "::error title=Logcat Error Found::$diag"
            exit 1
          fi
          echo "::notice title=E2E Logout + Security + Rotation + Logcat::PASS (Logout/Epoch guard blocked stale Account A callbacks; deep-link injection & malformed JSON handled cleanly; rotation survived; stable pid=$pid across all PIDs)"

      - name: Upload emulator E2E UI dumps and logcat artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Melodix-Emulator-Verification-${{ github.sha }}
          path: emulator-output
          if-no-files-found: warn
          retention-days: 30
