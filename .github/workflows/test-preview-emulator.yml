      - name: Upload verified screenshot and redacted launch summary
        id: evidence-upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melodix-Preview-Android16-${{ inputs.source_ref || github.sha }}
          path: |
            ${{ runner.temp }}/melodix-preview-emulator-state/login-screen.png
            ${{ runner.temp }}/melodix-preview-emulator-state/permission-prompt-summary.json
            ${{ runner.temp }}/melodix-preview-emulator-state/login-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/home-empty-fallback.png
            ${{ runner.temp }}/melodix-preview-emulator-state/home-fallback-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/home-status.png
            ${{ runner.temp }}/melodix-preview-emulator-state/home-status-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/web-home-app.png
            ${{ runner.temp }}/melodix-preview-emulator-state/web-home-app-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/release-candidate-screen.png
            ${{ runner.temp }}/melodix-preview-emulator-state/release-candidate-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/android-instrumentation.txt
            ${{ runner.temp }}/melodix-preview-emulator-state/instrumentation-safe-logcat.txt
            ${{ runner.temp }}/melodix-preview-emulator-state/verification-reference.json
            ${{ runner.temp }}/melodix-preview-emulator-state/assets-manifest.json
          retention-days: 14
          if-no-files-found: warn

      - name: Publish the exact validated Preview release candidate
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_preview == true || github.event_name == 'push' && startsWith(github.event.head_commit.message, '[preview-release] v1.2.2-test.95-preview')) && steps.integration.outcome == 'success' && steps.post-instrumentation.outcome == 'success' && steps.cold-launch-inspection.outcome == 'success' && steps.release-candidate.outcome == 'success' && steps.release-candidate-smoke.outcome == 'success' && steps.evidence-upload.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.2.2-test.95-preview' }}
          RELEASE_APK: ${{ steps.release-candidate.outputs.apk }}
          RELEASE_APK_SHA256: ${{ steps.release-candidate.outputs.apk_sha256 }}
          RELEASE_VERSION_CODE: ${{ steps.release-candidate.outputs.version_code }}
          RELEASE_VERSION_NAME: ${{ steps.release-candidate.outputs.version_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v1\.2\.2-test\.([0-9]+)-preview$ ]] || {
            echo "::error::Refusing to publish a tag outside v1.2.2-test.N-preview."
            exit 1
          }
          test_number="${BASH_REMATCH[1]}"
          if tag_ref_response="$(gh api --include "repos/Souxch06/Melodix/git/ref/tags/$RELEASE_TAG" 2>&1)"; then
            echo "::error::Refusing to overwrite existing Preview tag $RELEASE_TAG."
            exit 1
          fi
          if ! grep -qE '^HTTP/[0-9.]+ 404 Not Found$' <<< "$tag_ref_response"; then
            echo "::error::Unable to safely verify whether Preview tag $RELEASE_TAG already exists (GitHub API status was not 404)."
            exit 1
          fi
          release_dir="$RUNNER_TEMP/melodix-preview-release-candidate"
          source_name="$(basename "$RELEASE_APK")"
          (cd "$release_dir" && sha256sum -c "$source_name.sha256")
          actual_sha256="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          [[ "$actual_sha256" == "$RELEASE_APK_SHA256" ]] || { echo "::error::Release candidate changed after validation."; exit 1; }
          final_name="Melodix-Preview-v1.2.2-test${test_number}.apk"
          final_apk="$RUNNER_TEMP/$final_name"
          final_sha="$final_apk.sha256"
          cp "$RELEASE_APK" "$final_apk"
          cmp -s "$RELEASE_APK" "$final_apk" || { echo "::error::Renamed APK copy differs from the validated candidate."; exit 1; }
          printf '%s  %s\n' "$RELEASE_APK_SHA256" "$final_name" > "$final_sha"
          notes="$RUNNER_TEMP/melodix-preview-release-notes.md"
          cat > "$notes" <<EOF
          Built from source commit \`$SOURCE_REF\`.

          The published APK is the exact non-debuggable release candidate built, SHA-256 verified, installed, and cold-launched on the Android 16 emulator by [workflow run $GITHUB_RUN_ID](https://github.com/Souxch06/Melodix/actions/runs/$GITHUB_RUN_ID). versionName: \`$RELEASE_VERSION_NAME\`; versionCode: \`$RELEASE_VERSION_CODE\`; APK SHA-256: \`$RELEASE_APK_SHA256\`.

          The emulator run used no Spotify session, cookies, credentials, or account data. Its isolated Web Home renderer check is test-only; authenticated Spotify Home was not tested.
          EOF
          gh release create "$RELEASE_TAG" \
            "$final_apk#$final_name" \
            "$final_sha#$final_name.sha256" \
            --repo Souxch06/Melodix \
            --target "$SOURCE_REF" \
            --title "Melodix Preview v1.2.2 test.$test_number" \
            --notes-file "$notes" \
            --prerelease
          echo "::notice title=Exact Preview APK published::tag=$RELEASE_TAG; source=$SOURCE_REF; debuggable=false; versionCode=$RELEASE_VERSION_CODE; sha256=$RELEASE_APK_SHA256"
          echo "Public Preview: https://github.com/Souxch06/Melodix/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
