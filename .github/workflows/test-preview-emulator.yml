                  output.write("\n## P0 CSS, WebView and computed-contrast diagnostics (sanitized)\n\n")
                  output.write(f"- Canonical CSS source SHA-256: `{reference.get('release_candidate_css_source_sha256') or 'not verified'}`\n")
                  output.write(f"- CSS asset SHA-256 extracted from the exact release candidate: `{reference.get('release_candidate_css_apk_asset_sha256') or 'not verified'}`; hash match: `{reference.get('release_candidate_css_source_matches_apk_asset')}`\n")
                  output.write(f"- Android: `{reference.get('android_release') or 'unknown'}` (API `{reference.get('android_api_level') or 'unknown'}`); WebView package/version: `{reference.get('installed_webview_package') or 'unknown'}` / `{reference.get('installed_webview_package_version') or 'unknown'}`; Chromium: `{reference.get('installed_webview_chrome_version') or 'unknown'}`\n")
                  output.write(f"- Configured UA Chrome: `{reference.get('configured_ua_chrome_version') or 'unknown'}`; JavaScript UA Chrome/Android: `{reference.get('javascript_user_agent_chrome_version') or 'unknown'}` / `{reference.get('javascript_user_agent_android_version') or 'unknown'}`; Client Hints platform/brand/major/full version/platform version: `{reference.get('client_hints_platform') or 'unknown'}` / `{reference.get('client_hints_browser_brand') or 'unknown'}` / `{reference.get('client_hints_browser_major') or 'unknown'}` / `{reference.get('client_hints_full_browser_version') or 'unavailable'}` / `{reference.get('client_hints_platform_version') or 'unavailable'}`; high entropy supported/complete/error/type/timeout: `{reference.get('client_hints_high_entropy_api_supported')}` / `{reference.get('client_hints_high_entropy_complete')}` / `{reference.get('client_hints_high_entropy_error')}` / `{reference.get('client_hints_high_entropy_error_type') or 'none'}` / `{reference.get('client_hints_high_entropy_timed_out')}`; profile probe error/type/coherent: `{reference.get('javascript_ua_profile_probe_error')}` / `{reference.get('javascript_user_agent_probe_error_type') or 'none'}` / `{reference.get('javascript_ua_profile_coherent')}`\n")
                  output.write(f"- Existing Spotify WebView origin category: `{reference.get('live_spotify_origin_category') or 'unknown'}`; CSS probe completed/error/type: `{reference.get('live_spotify_css_probe_completed')}` / `{reference.get('live_spotify_css_probe_error')}` / `{reference.get('live_spotify_css_probe_error_type') or 'none'}`; CSS marker/applicable/tokens valid: `{reference.get('live_webview_stylesheet_marker_present')}` / `{reference.get('live_webview_css_theme_applicable')}` / `{reference.get('live_webview_css_tokens_valid')}`; Home active on unauthenticated login: `{reference.get('live_webview_home_active')}`; bridge present: `{reference.get('live_webview_bridge_present')}`\n")
                  output.write(f"- Computed colors were measured only in the explicitly test-only WebView fixture; fixture flag: `{reference.get('web_home_color_probe_fixture_test_only')}`; probe completed/error/error type/validation passed: `{reference.get('web_home_color_probe_completed')}` / `{reference.get('web_home_color_probe_error')}` / `{reference.get('web_home_color_probe_error_type') or 'none'}` / `{reference.get('web_home_color_probe_validation_passed')}`; per-state diagnostic: `{reference.get('web_home_color_probe_validation_summary') or 'not available'}`; all five state probes complete: `{reference.get('web_home_color_scenarios_complete')}`; all measured pairs at least 4.5:1: `{reference.get('web_home_all_states_wcag_aa_pass')}`. Light theme available: `{reference.get('web_home_light_theme_available')}`.\n\n")
                  output.write("| Fixture state | Cards | Visible | WCAG AA | Lowest measured contrast |\n|---|---:|---|---|---:|\n")
                  for name, scenario in (reference.get("web_home_computed_color_states") or {}).items():
                      ratios = scenario.get("contrast_ratios") or {}
                      minimum = min(ratios.values()) if ratios else None
                      value = f"{minimum:.2f}:1" if minimum is not None else "not measured"
                      output.write(f"| {name} | {scenario.get('card_count') or 0} | {scenario.get('visible')} | {scenario.get('wcag_aa_pass')} | {value} |\n")
                  output.write("\nAuthenticated Spotify Home was not tested; the emulator had no Spotify session or account data. The fixture is not presented as a real authenticated run.\n")
          PY
          fi

          login_dom_visible=not_confirmed
          empty_home_payload_confirmed=false
          playlist_or_card_injected_by_harness=false
          if [[ -s "$state_dir/android-instrumentation.txt" ]]; then
            if grep -Fq 'INSTRUMENTATION_STATUS: login_ui_visible_in_webview_dom=true' "$state_dir/android-instrumentation.txt"; then
              login_dom_visible=true
            elif grep -Fq 'INSTRUMENTATION_STATUS: login_ui_visible_in_webview_dom=false' "$state_dir/android-instrumentation.txt"; then
              login_dom_visible=false
            fi
            grep -Fq 'INSTRUMENTATION_STATUS: home_payload_empty=true' "$state_dir/android-instrumentation.txt" && empty_home_payload_confirmed=true || true
            grep -Fq 'INSTRUMENTATION_STATUS: playlist_or_card_injected=true' "$state_dir/android-instrumentation.txt" && playlist_or_card_injected_by_harness=true || true
          fi
          empty_home_pixels_verified=false
          if [[ "$INTEGRATION_OUTCOME" == "success" && "$EMPTY_HOME_PIXELS_VERIFIED" == "true" ]]; then
            empty_home_pixels_verified=true
          fi
          activity_resumed=false
          if [[ "$ACTIVITY_RESUMED" == "true" ]]; then
            activity_resumed=true
          fi
          home_status_pixels_verified=false
          if [[ "$INTEGRATION_OUTCOME" == "success" && "$HOME_STATUS_PIXELS_VERIFIED" == "true" ]]; then
            home_status_pixels_verified=true
          fi
          web_home_renderer_pixels_verified=false
          if [[ "$INTEGRATION_OUTCOME" == "success" && "$WEB_HOME_PIXELS_VERIFIED" == "true" ]]; then
            web_home_renderer_pixels_verified=true
          fi
          echo "::notice title=Android evidence outcomes::source=$SOURCE_REF; apk_sha256=${APK_SHA256:-not_verified}; integration=$INTEGRATION_OUTCOME; harness_failure_phase=${HARNESS_FAILURE_PHASE:-none}; harness_failure_type=${HARNESS_FAILURE_TYPE:-none}; login_dom_visible=$login_dom_visible; browser_compatibility_warning_visible=${BROWSER_COMPATIBILITY_WARNING:-not_confirmed}; installed_webview_chrome_major=${WEBVIEW_CHROME_MAJOR:-unknown}; configured_ua_chrome_major=${CONFIGURED_UA_CHROME_MAJOR:-unknown}; ua_profile_coherent=${USER_AGENT_PROFILE_COHERENT:-not_confirmed}; cold_native_home_hierarchy_pixels=$COLD_LAUNCH_OUTCOME; activity_resumed_after_instrumentation=$activity_resumed; preview_relaunched=${PREVIEW_RELAUNCHED:-unknown}; empty_home_payload_confirmed=$empty_home_payload_confirmed; playlist_or_card_injected=$playlist_or_card_injected_by_harness; empty_home_pixels_verified=$empty_home_pixels_verified; home_status_pixels_verified=$home_status_pixels_verified; web_home_renderer_pixels_verified=$web_home_renderer_pixels_verified; login_restored_after_status=$(grep -Fq 'INSTRUMENTATION_STATUS: login_surface_restored_after_status=true' "$state_dir/android-instrumentation.txt" && echo true || echo false); login_restored_after_web_home_fixture=$(grep -Fq 'INSTRUMENTATION_STATUS: login_surface_restored_after_web_home_fixture=true' "$state_dir/android-instrumentation.txt" && echo true || echo false); authenticated_home_test=not_performed"

      - name: Upload verified screenshot and redacted launch summary
        id: evidence-upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melodix-Preview-Android16-${{ inputs.source_ref || github.sha }}
          path: |
            ${{ runner.temp }}/melodix-preview-emulator-state/cold-home-screen.png
            ${{ runner.temp }}/melodix-preview-emulator-state/permission-prompt-summary.json
            ${{ runner.temp }}/melodix-preview-emulator-state/cold-home-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/home-empty-native-error.png
            ${{ runner.temp }}/melodix-preview-emulator-state/home-empty-native-error-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/home-status.png
            ${{ runner.temp }}/melodix-preview-emulator-state/home-status-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/cold-home-timeline-*.png
            ${{ runner.temp }}/melodix-preview-emulator-state/cold-home-timeline-*-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/empty-home-timeline-*.png
            ${{ runner.temp }}/melodix-preview-emulator-state/empty-home-timeline-*-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/native-route-*.png
            ${{ runner.temp }}/melodix-preview-emulator-state/native-route-*-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/web-home-app.png
            ${{ runner.temp }}/melodix-preview-emulator-state/web-home-app-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/release-candidate-screen.png
            ${{ runner.temp }}/melodix-preview-emulator-state/release-candidate-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/android-instrumentation.txt
            ${{ runner.temp }}/melodix-preview-emulator-state/authenticated-home-observer-ci.txt
            ${{ runner.temp }}/melodix-preview-emulator-state/instrumentation-safe-logcat.txt
            ${{ runner.temp }}/melodix-preview-emulator-state/verification-reference.json
            ${{ runner.temp }}/melodix-preview-emulator-state/assets-manifest.json
          retention-days: 14
          if-no-files-found: warn

      - name: Publish the exact validated Preview release candidate
        if: (github.event_name == 'workflow_dispatch' && inputs.publish_preview == true || github.event_name == 'push' && startsWith(github.event.head_commit.message, '[preview-release] v1.2.2-test.96-preview')) && steps.integration.outcome == 'success' && steps.authenticated-home-ci.outcome == 'success' && steps.post-instrumentation.outcome == 'success' && steps.cold-launch-inspection.outcome == 'success' && steps.release-candidate.outcome == 'success' && steps.release-candidate-smoke.outcome == 'success' && steps.evidence-upload.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.2.2-test.96-preview' }}
          RELEASE_APK: ${{ steps.release-candidate.outputs.apk }}
          RELEASE_APK_SHA256: ${{ steps.release-candidate.outputs.apk_sha256 }}
          RELEASE_VERSION_CODE: ${{ steps.release-candidate.outputs.version_code }}
          RELEASE_VERSION_NAME: ${{ steps.release-candidate.outputs.version_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v1\.2\.2-test\.([0-9]+)-preview$ ]] || {
            echo "::error::Refusing to publish a tag outside v1.2.2-test.N-preview."
            exit 1
          }
          test_number="${BASH_REMATCH[1]}"
          if tag_ref_response="$(gh api --include "repos/Souxch06/Melodix/git/ref/tags/$RELEASE_TAG" 2>&1)"; then
            echo "::error::Refusing to overwrite existing Preview tag $RELEASE_TAG."
            exit 1
          fi
          if ! grep -qE '^HTTP/[0-9.]+ 404 Not Found$' <<< "$tag_ref_response"; then
            echo "::error::Unable to safely verify whether Preview tag $RELEASE_TAG already exists (GitHub API status was not 404)."
            exit 1
          fi
          release_dir="$RUNNER_TEMP/melodix-preview-release-candidate"
          source_name="$(basename "$RELEASE_APK")"
          (cd "$release_dir" && sha256sum -c "$source_name.sha256")
          actual_sha256="$(sha256sum "$RELEASE_APK" | awk '{print $1}')"
          [[ "$actual_sha256" == "$RELEASE_APK_SHA256" ]] || { echo "::error::Release candidate changed after validation."; exit 1; }
          final_name="Melodix-Preview-v1.2.2-test${test_number}.apk"
          final_apk="$RUNNER_TEMP/$final_name"
          final_sha="$final_apk.sha256"
          cp "$RELEASE_APK" "$final_apk"
          cmp -s "$RELEASE_APK" "$final_apk" || { echo "::error::Renamed APK copy differs from the validated candidate."; exit 1; }
          printf '%s  %s\n' "$RELEASE_APK_SHA256" "$final_name" > "$final_sha"
          notes="$RUNNER_TEMP/melodix-preview-release-notes.md"
          cat > "$notes" <<EOF
          Built from source commit \`$SOURCE_REF\`.

          The published APK is the exact non-debuggable release candidate built, SHA-256 verified, installed, and cold-launched on the Android 16 emulator by [workflow run $GITHUB_RUN_ID](https://github.com/Souxch06/Melodix/actions/runs/$GITHUB_RUN_ID). versionName: \`$RELEASE_VERSION_NAME\`; versionCode: \`$RELEASE_VERSION_CODE\`; APK SHA-256: \`$RELEASE_APK_SHA256\`.

          The emulator run used no Spotify session, cookies, credentials, or account data. Its isolated Web Home renderer check is test-only; authenticated Spotify Home was not tested.
          EOF
          gh release create "$RELEASE_TAG" \
            "$final_apk#$final_name" \
            "$final_sha#$final_name.sha256" \
            --repo Souxch06/Melodix \
            --target "$SOURCE_REF" \
            --title "Melodix Preview v1.2.2 test.$test_number" \
            --notes-file "$notes" \
            --prerelease
          echo "::notice title=Exact Preview APK published::tag=$RELEASE_TAG; source=$SOURCE_REF; debuggable=false; versionCode=$RELEASE_VERSION_CODE; sha256=$RELEASE_APK_SHA256"
          echo "Public Preview: https://github.com/Souxch06/Melodix/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
