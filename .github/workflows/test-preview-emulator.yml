name: Test current Preview APK on Android emulator

on:
  push:
    branches:
      - arena/7142700d-melodix
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full source commit SHA embedded in the Preview APK
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: write

jobs:
  build-preview:
    name: Build the APK tested by this run
    uses: ./.github/workflows/preview-apk.yml
    with:
      release_tag: v1.2.2-test.93-preview
      source_ref: ${{ inputs.source_ref || github.sha }}
      build_only: true
    secrets: inherit

  install-and-launch:
    name: Install and test the APK built by this run
    needs: build-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact source commit under test
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Validate requested source and build run
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::source_ref must be a full 40-character SHA."; exit 1; }
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$SOURCE_REF" | tr '[:upper:]' '[:lower:]')"
          [[ "$actual" == "$expected" ]] || { echo "::error::Checked out $actual, expected $SOURCE_REF."; exit 1; }
          echo "Testing source commit $actual."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pixel inspection tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/melodix-inspection-venv"
          "$RUNNER_TEMP/melodix-inspection-venv/bin/python" -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          echo "$RUNNER_TEMP/melodix-inspection-venv/bin" >> "$GITHUB_PATH"

      - name: Install Android 16 emulator and inspection tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || { echo "::error::Expected an x86_64 Linux emulator host, got $(uname -m)."; exit 1; }
          system_image="system-images;android-36;google_apis;x86_64"
          echo "Using Android system image: $system_image"
          sdkmanager --install "platform-tools" "emulator" "build-tools;35.0.0" "platforms;android-36" "$system_image"
          [[ -e /dev/kvm ]] || { echo "::error::KVM is unavailable on this runner."; exit 1; }
          sudo chmod 666 /dev/kvm
          printf 'no\n' | avdmanager create avd \
            --force \
            --name MelodixApi36 \
            --package "$system_image" \
            --device pixel_2

      - name: Download the Preview APK built by this same run
        uses: actions/download-artifact@v4.3.0
        with:
          name: Melodix-Preview-v1.2.2-test93.apk
          path: ${{ runner.temp }}/melodix-preview-apk

      - name: Verify APK hash, source SHA, package, signature and version
        id: apk
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          APK_ARTIFACT_NAME: Melodix-Preview-v1.2.2-test93.apk
        run: |
          set -euo pipefail
          apk_dir="$RUNNER_TEMP/melodix-preview-apk"
          apk="$apk_dir/$APK_ARTIFACT_NAME"
          [[ -s "$apk" ]] || { echo "::error::Downloaded APK is missing: $APK_ARTIFACT_NAME"; exit 1; }
          (cd "$apk_dir" && sha256sum -c "$APK_ARTIFACT_NAME.sha256")
          apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"

          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/apksigner" verify --verbose --min-sdk-version 24 "$apk"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/melodix-preview-badging.txt"
          package_id="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/melodix-preview-badging.txt")"
          version_code="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/melodix-preview-badging.txt")"
          version_name="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/melodix-preview-badging.txt")"
          expected_version_name="1.2.2-${SOURCE_REF:0:7}"
          [[ "$package_id" == "com.melodix.music.preview" ]] || { echo "::error::Unexpected package ID: $package_id"; exit 1; }
          [[ "$version_code" =~ ^[0-9]+$ ]] && (( version_code > 1020879 )) || { echo "::error::Preview versionCode $version_code is not greater than 1020879."; exit 1; }
          [[ "$version_name" == "$expected_version_name" ]] || { echo "::error::Unexpected versionName: $version_name"; exit 1; }
          "$build_tools/aapt" dump --values resources "$apk" > "$RUNNER_TEMP/melodix-preview-resources.txt"
          grep -Fq "$SOURCE_REF" "$RUNNER_TEMP/melodix-preview-resources.txt" || { echo "::error::APK does not embed requested source SHA $SOURCE_REF."; exit 1; }

          asset_manifest="$apk_dir/assets-manifest.json"
          [[ -s "$asset_manifest" ]] || { echo "::error::Preview artifact is missing its packaged-asset hash manifest."; exit 1; }
          python3 - "$apk" "$asset_manifest" "$GITHUB_WORKSPACE" "$SOURCE_REF" "$GITHUB_STEP_SUMMARY" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          import zipfile

          apk_path, manifest_path, source_root, source_ref, summary_path = sys.argv[1:]
          root = pathlib.Path(source_root)
          manifest = json.loads(pathlib.Path(manifest_path).read_text(encoding="utf-8"))
          if manifest.get("source_commit") != source_ref:
              raise SystemExit("Asset manifest source commit does not match the APK source SHA")
          assets = manifest.get("assets", [])
          if not assets:
              raise SystemExit("The asset manifest is empty")
          names = set()
          with zipfile.ZipFile(apk_path) as apk:
              for entry in assets:
                  name = entry["name"]
                  names.add(name)
                  runtime = (root / name).read_bytes()
                  packaged = apk.read(name)
                  asset_hash = hashlib.sha256(runtime).hexdigest()
                  if asset_hash != entry["asset_sha256"] or packaged != runtime or len(packaged) != entry["bytes"]:
                      raise SystemExit(f"Packaged asset does not match the verified manifest: {name}")
                  source_name = entry.get("source")
                  if source_name:
                      source_hash = hashlib.sha256((root / source_name).read_bytes()).hexdigest()
                      if source_hash != entry.get("source_sha256"):
                          raise SystemExit(f"Readable source hash mismatch: {source_name}")
          for required in ("assets/native_home_fallback.js", "assets/runtime_diagnostic.js", "assets/spotify_bridge.js", "assets/native_ui_shell.js", "assets/melodix_home.js"):
              if required not in names:
                  raise SystemExit(f"Verified APK asset manifest omits {required}")
          with pathlib.Path(summary_path).open("a", encoding="utf-8") as output:
              output.write("### Runtime assets packaged in the exact Preview APK\n\n")
              for entry in assets:
                  source_detail = f"; source SHA-256 `{entry['source_sha256']}`" if entry.get("source_sha256") else ""
                  output.write(f"- `{entry['name']}`: {entry['bytes']} bytes; SHA-256 `{entry['asset_sha256']}`{source_detail}\n")
          PY

          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "asset_manifest=$asset_manifest" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "package_id=$package_id" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "::notice title=APK verified::package=$package_id versionCode=$version_code versionName=$version_name source=$SOURCE_REF sha256=$apk_sha256"

      - name: Boot a clean Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" \
            -avd MelodixApi36 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            > "$RUNNER_TEMP/melodix-emulator.log" 2>&1 &
          emulator_pid=$!
          adb start-server
          device_id=""
          for _ in $(seq 1 120); do
            device_id="$(adb devices | awk '$1 ~ /^emulator-/ && $2 == "device" {print $1; exit}')"
            if [[ -n "$device_id" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$device_id" ]]; then
            device_list="$(adb devices | awk 'NR > 1 && NF >= 2 {printf "%s:%s,", $1, $2}')"
            process_state="$(ps -p "$emulator_pid" -o stat=,command= 2>/dev/null || true)"
            emulator_errors="$(grep -Ei 'ERROR|FATAL|PANIC|failed|failure|cannot|could not' "$RUNNER_TEMP/melodix-emulator.log" | tail -n 15 | tr '\n' ' ' | cut -c1-2500 || true)"
            echo "::error title=Android emulator startup::adb_devices=${device_list:-none}; process=${process_state:-exited}; log=${emulator_errors:-no matching error lines}"
            exit 1
          fi
          booted=0
          for _ in $(seq 1 120); do
            if [[ "$(adb -s "$device_id" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            sleep 5
          done
          if [[ "$booted" != "1" ]]; then
            echo "::error::Android emulator did not finish booting."
            exit 1
          fi
          adb -s "$device_id" shell settings put global window_animation_scale 0
          adb -s "$device_id" shell settings put global transition_animation_scale 0
          adb -s "$device_id" shell settings put global animator_duration_scale 0
          echo "Android API: $(adb -s "$device_id" shell getprop ro.build.version.sdk | tr -d '\r')"
          adb -s "$device_id" shell dumpsys webviewupdate | grep -E "Current WebView package|WebView package" | head -n 3 || true

      - name: Install and launch the verified Preview APK
        id: launch
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.apk }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/melodix-preview-emulator-state"
          mkdir -p "$state_dir"
          # Installation on this newly created emulator, followed by pm clear,
          # guarantees there are no carried-over Spotify cookies or app prefs.
          adb install "$APK_PATH"
          adb shell pm clear com.melodix.music.preview >/dev/null
          # Observe the first-run Android permission surface before granting it,
          # but retain only redacted hierarchy metadata (never its raw text/XML).
          adb shell monkey -p com.melodix.music.preview -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 8
          permission_xml="$state_dir/permission-before-grant.xml"
          if adb shell uiautomator dump --compressed /sdcard/melodix-preview-permission.xml >/dev/null 2>&1 && \
              adb exec-out cat /sdcard/melodix-preview-permission.xml > "$permission_xml"; then
            python3 - "$permission_xml" "$state_dir/permission-prompt-summary.json" <<'PY'
          import json
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          xml_path, summary_path = sys.argv[1:]
          safe = lambda value: re.sub(r"[^A-Za-z0-9_.$:/-]", "?", value or "")[:160] or None
          state = {
              "hierarchy_available": False,
              "hierarchy_node_count": 0,
              "top_package": None,
              "top_class": None,
              "permission_controller_in_hierarchy": False,
              "permission_allow_or_deny_control_present": False,
              "permission_allow_button_bounds_px": None,
              "permission_allow_center_x_px": None,
              "permission_allow_center_y_px": None,
              "text_nodes_present_count": 0,
          }
          try:
              root = ET.parse(xml_path).getroot()
              nodes = [node for node in root.iter() if node.tag == "node"]
              top = nodes[0] if nodes else None
              packages = {node.get("package", "") for node in nodes}
              resource_ids = [node.get("resource-id", "") for node in nodes]
              allow_node = next((
                  node for node in nodes
                  if "permission_allow" in node.get("resource-id", "").lower()
                  and node.get("bounds")
              ), None)
              allow_bounds_match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", allow_node.get("bounds", "")) if allow_node is not None else None
              allow_bounds = tuple(int(part) for part in allow_bounds_match.groups()) if allow_bounds_match else None
              state.update({
                  "hierarchy_available": True,
                  "hierarchy_node_count": len(nodes),
                  "top_package": safe(top.get("package")) if top is not None else None,
                  "top_class": safe(top.get("class")) if top is not None else None,
                  "permission_controller_in_hierarchy": any("permissioncontroller" in package.lower() for package in packages),
                  "permission_allow_or_deny_control_present": any("permission_allow" in value or "permission_deny" in value for value in resource_ids),
                  "permission_allow_button_bounds_px": list(allow_bounds) if allow_bounds else None,
                  "permission_allow_center_x_px": (allow_bounds[0] + allow_bounds[2]) // 2 if allow_bounds else None,
                  "permission_allow_center_y_px": (allow_bounds[1] + allow_bounds[3]) // 2 if allow_bounds else None,
                  "text_nodes_present_count": sum(bool(node.get("text") or node.get("content-desc")) for node in nodes),
              })
          except (ET.ParseError, OSError):
              pass
          pathlib.Path(summary_path).write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")
          print("::notice title=Android first-launch permission observation::"
                f"hierarchy_available={state['hierarchy_available']}; top_package={state['top_package'] or 'none'}; "
                f"permission_controller_in_hierarchy={state['permission_controller_in_hierarchy']}; "
                f"permission_controls_present={state['permission_allow_or_deny_control_present']}; "
                f"allow_button_center={state['permission_allow_center_x_px']},{state['permission_allow_center_y_px']}; "
                f"text_nodes_present_count={state['text_nodes_present_count']}")
          PY
          else
            printf '{"hierarchy_available":false,"top_package":null,"permission_controller_in_hierarchy":false}\n' > "$state_dir/permission-prompt-summary.json"
            echo "::notice title=Android first-launch permission observation::hierarchy_available=false"
          fi
          rm -f "$permission_xml"
          adb shell rm -f /sdcard/melodix-preview-permission.xml >/dev/null 2>&1 || true
          # The clean first launch may be covered by Android's nearby-devices
          # permission prompt. Tap only the observed system Allow button, by its
          # accessibility bounds; do not inject login/session or content data.
          read_bluetooth_permission_state() {
            if adb shell dumpsys package com.melodix.music.preview \
                | grep -F 'android.permission.BLUETOOTH_CONNECT:' \
                | grep -Fq 'granted=true'; then
              printf 'granted'
            else
              printf 'denied'
            fi
          }
          permission_status="$(read_bluetooth_permission_state)"
          permission_prompt_visible="false"
          permission_action="already_granted"
          allow_center_x=""
          allow_center_y=""
          if [[ "$permission_status" != "granted" ]]; then
            read -r permission_prompt_visible allow_center_x allow_center_y < <(python3 - "$state_dir/permission-prompt-summary.json" <<'PY'
          import json
          import pathlib
          import sys

          state = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          visible = state.get("permission_controller_in_hierarchy", False)
          x = state.get("permission_allow_center_x_px")
          y = state.get("permission_allow_center_y_px")
          print(str(bool(visible)).lower(), "" if x is None else x, "" if y is None else y)
          PY
            )
            if [[ "$permission_prompt_visible" == "true" && "$allow_center_x" =~ ^[0-9]+$ && "$allow_center_y" =~ ^[0-9]+$ ]]; then
              adb shell input tap "$allow_center_x" "$allow_center_y"
              permission_action="observed_allow_button_tapped"
              sleep 3
              permission_status="$(read_bluetooth_permission_state)"
            else
              echo "::error title=Android permission setup::BLUETOOTH_CONNECT=$permission_status; permission_controller_visible=$permission_prompt_visible; allow_bounds_available=false"
              exit 1
            fi
          fi
          [[ "$permission_status" == "granted" ]] || { echo "::error title=Android permission setup::BLUETOOTH_CONNECT=$permission_status; permission_controller_visible=$permission_prompt_visible; allow_button_tapped=true"; exit 1; }
          echo "::notice title=Android permission setup::fresh app data retained; BLUETOOTH_CONNECT=$permission_status; action=$permission_action; no Spotify session or cookies supplied"
          adb shell am force-stop com.melodix.music.preview >/dev/null 2>&1 || true
          adb shell monkey -p com.melodix.music.preview -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 60

          app_pid="$(adb shell pidof -s com.melodix.music.preview 2>/dev/null | tr -d '\r' || true)"
          if [[ -z "$app_pid" ]]; then
            fatal_count="$(adb logcat -d -t 4000 | grep -cE 'FATAL EXCEPTION|ANR in com\.melodix\.music\.preview' || true)"
            echo "::error title=Preview process not alive::fatal_or_anr_lines=${fatal_count:-0}"
            exit 1
          fi

          adb shell uiautomator dump --compressed /sdcard/melodix-preview-login.xml >/dev/null 2>&1
          adb exec-out cat /sdcard/melodix-preview-login.xml > "$state_dir/login-window.xml"
          adb exec-out screencap -p > "$state_dir/login-screen.png"
          # Preserve the cold-launch hierarchy and pixels before test
          # instrumentation changes the visible WebView state. Inspection is a
          # later step so a visibility failure cannot suppress the Android
          # harness or its post-instrumentation activity check.

          resumed="$(adb shell dumpsys activity activities | grep -F 'com.melodix.music.preview/com.melodix.music.MainActivity' | head -n 1 || true)"
          [[ -n "$resumed" ]] || { echo "::error::MainActivity was not present in the resumed-activity dump."; exit 1; }
          resumed_now="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep -F 'com.melodix.music.preview/com.melodix.music.MainActivity' | head -n 1 || true)"
          main_activity_resumed=false
          if [[ -n "$resumed_now" ]]; then main_activity_resumed=true; fi
          focus_window="$(adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | head -n 1 | tr -cd 'A-Za-z0-9_.:/@ -' | cut -c1-300 || true)"
          echo "The Preview process stayed alive and MainActivity remained present after the cold launch."
          echo "No Spotify credentials or account content were supplied; this is an unauthenticated launch check."
          echo "::notice title=Android cold-launch foreground::source=$SOURCE_REF; process_alive=true; main_activity_present=true; main_activity_resumed=$main_activity_resumed; focus=${focus_window:-none}; authenticated_content_not_tested=true"

      - name: Build signed Android UI integration instrumentation APK
        shell: bash
        env:
          MELODIX_PREVIEW_KEYSTORE_B64: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_B64 }}
          MELODIX_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
          MELODIX_PREVIEW_KEY_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEY_PASSWORD || secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$MELODIX_PREVIEW_KEYSTORE_B64" && -n "$MELODIX_PREVIEW_KEYSTORE_PASSWORD" && -n "$MELODIX_PREVIEW_KEY_PASSWORD" ]] || {
            echo "::error::Preview signing secrets are required to sign the test-only instrumentation APK with the same certificate."
            exit 1
          }
          android_jar="$ANDROID_HOME/platforms/android-36/android.jar"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          classes_dir="$RUNNER_TEMP/melodix-ui-harness-classes"
          dex_dir="$RUNNER_TEMP/melodix-ui-harness-dex"
          mkdir -p "$classes_dir" "$dex_dir"
          javac --release 8 -classpath "$android_jar" -d "$classes_dir" tests/android/HomeRenderInstrumentation.java
          mapfile -t harness_classes < <(find "$classes_dir" -type f -name '*.class' -print)
          [[ "${#harness_classes[@]}" -gt 0 ]] || { echo "::error::No compiled instrumentation classes found."; exit 1; }
          "$build_tools/d8" \
            --lib "$android_jar" \
            --min-api 24 \
            --output "$dex_dir" \
            "${harness_classes[@]}"

          unsigned_apk="$RUNNER_TEMP/melodix-ui-harness-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/melodix-ui-harness-aligned.apk"
          test_apk="$RUNNER_TEMP/melodix-ui-harness.apk"
          "$build_tools/aapt" package \
            -f \
            -M tests/android/AndroidManifest.xml \
            -I "$android_jar" \
            --min-sdk-version 24 \
            --target-sdk-version 36 \
            -F "$unsigned_apk"
          (cd "$dex_dir" && zip -q "$unsigned_apk" classes.dex)
          "$build_tools/zipalign" -f 4 "$unsigned_apk" "$aligned_apk"
          printf '%s' "$MELODIX_PREVIEW_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/melodix-preview-signing.jks"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/melodix-preview-signing.jks" \
            --ks-key-alias MELODIX_PREVIEW \
            --ks-pass env:MELODIX_PREVIEW_KEYSTORE_PASSWORD \
            --key-pass env:MELODIX_PREVIEW_KEY_PASSWORD \
            --out "$test_apk" "$aligned_apk"
          "$build_tools/apksigner" verify --verbose --min-sdk-version 24 "$test_apk"
          "$build_tools/aapt" dump badging "$test_apk" > "$RUNNER_TEMP/melodix-ui-harness-badging.txt"
          grep -Fq "package: name='com.melodix.music.preview.test'" "$RUNNER_TEMP/melodix-ui-harness-badging.txt" || {
            echo "::error::Instrumentation APK package id mismatch."
            exit 1
          }
          "$build_tools/aapt" dump xmltree "$test_apk" AndroidManifest.xml > "$RUNNER_TEMP/melodix-ui-harness-manifest.txt"
          grep -Fq 'com.melodix.test.HomeRenderInstrumentation' "$RUNNER_TEMP/melodix-ui-harness-manifest.txt" || {
            echo "::error::Instrumentation APK manifest does not declare the expected runner class."
            exit 1
          }
          grep -Fq 'com.melodix.music.preview' "$RUNNER_TEMP/melodix-ui-harness-manifest.txt" || {
            echo "::error::Instrumentation APK manifest does not target the Preview package."
            exit 1
          }
          echo "::notice title=Android harness manifest::runner_class_declared=true; target_package_declared=true; test_package=com.melodix.music.preview.test"
          echo "Signed test-only UI harness SHA-256: $(sha256sum "$test_apk" | awk '{print $1}')"

      - name: Run Android login and empty-Home fallback instrumentation
        id: integration
        shell: bash
        env:
          TEST_APK: ${{ runner.temp }}/melodix-ui-harness.apk
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/melodix-preview-emulator-state"
          adb install -r "$TEST_APK"
          test_package_installed=false
          if adb shell pm path com.melodix.music.preview.test 2>/dev/null | grep -Fq 'package:'; then
            test_package_installed=true
          fi
          preview_package_installed=false
          if adb shell pm path com.melodix.music.preview 2>/dev/null | grep -Fq 'package:'; then
            preview_package_installed=true
          fi
          adb shell pm list instrumentation > "$state_dir/pm-instrumentation-list.txt" 2>&1 || true
          adb shell dumpsys package com.melodix.music.preview.test > "$state_dir/pm-test-package-dump.txt" 2>&1 || true
          registration_summary="$(python3 - "$state_dir/pm-instrumentation-list.txt" "$state_dir/pm-test-package-dump.txt" <<'PY'
          import pathlib
          import re
          import sys

          pm_text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          package_text = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8", errors="replace")
          lines = [line.strip() for line in pm_text.splitlines() if "instrumentation:" in line.lower()]
          test_package = "com.melodix.music.preview.test"
          runner_class = "com.melodix.test.HomeRenderInstrumentation"
          target_re = re.compile(r"target(?:Package)?[=:]\s*com\.melodix\.music\.preview(?![A-Za-z0-9_.])", re.I)
          matching_lines = [line for line in lines if test_package in line and runner_class in line and target_re.search(line)]
          test_seen = any(test_package in line for line in lines)
          runner_seen = any(runner_class in line for line in lines)
          target_seen = any(target_re.search(line) for line in lines)
          package_runner_seen = runner_class in package_text
          package_target_seen = bool(re.search(r"target(?:Package)?[=:]\s*com\.melodix\.music\.preview(?![A-Za-z0-9_.])", package_text, re.I))
          unknown_command = bool(re.search(r"Unknown command", pm_text, re.I))
          registered = bool(matching_lines)
          print("; ".join((
              f"expected_runner_registered={str(registered).lower()}",
              f"pm_instrumentation_entries={len(lines)}",
              f"pm_test_package_entry={str(test_seen).lower()}",
              f"pm_runner_class_entry={str(runner_seen).lower()}",
              f"pm_target_entry={str(target_seen).lower()}",
              f"pm_list_unknown_command={str(unknown_command).lower()}",
              f"package_dump_runner_seen={str(package_runner_seen).lower()}",
              f"package_dump_target_seen={str(package_target_seen).lower()}"
          )))
          PY
          )"
          runner_registered="$(printf '%s\n' "$registration_summary" | sed -n 's/.*expected_runner_registered=\([^;]*\).*/\1/p')"
          rm -f "$state_dir/pm-instrumentation-list.txt" "$state_dir/pm-test-package-dump.txt"
          echo "::notice title=Android harness registration::test_package_installed=$test_package_installed; preview_package_installed=$preview_package_installed; $registration_summary"
          if [[ "$test_package_installed" != "true" || "$preview_package_installed" != "true" || "$runner_registered" != "true" ]]; then
            echo "::error title=Android harness registration::test_package_installed=$test_package_installed; preview_package_installed=$preview_package_installed; $registration_summary"
            exit 1
          fi
          set +e
          timeout --signal=TERM --kill-after=10s 180s adb shell am instrument -w -r \
            com.melodix.music.preview.test/com.melodix.test.HomeRenderInstrumentation \
            > "$state_dir/android-instrumentation.txt" 2>&1
          instrumentation_status=$?
          set -e
          adb logcat -d -t 1000 -s MelodixHarness:I > "$state_dir/instrumentation-safe-logcat.txt" 2>/dev/null || true
          cat "$state_dir/android-instrumentation.txt"
          if [[ "$instrumentation_status" != "0" ]]; then
            safe_statuses="$(grep -E '^INSTRUMENTATION_STATUS: (phase|authenticated_session|login_dom_probe_completed|login_ui_visible_in_webview_dom|webview_visible_and_measured|network_error_transition_recovered|original_webview_url_preserved|splash_hidden|native_home_hidden|home_payload_empty|playlist_or_card_injected|native_home_cards_attached|native_home_content_ready|native_content_container_empty|native_root_hidden|native_home_tab_not_shown|webview_container_visible|page_load_complete|failure_phase|failure_type|overall)=' "$state_dir/android-instrumentation.txt" | tr '\n' ';' | cut -c1-1200 || true)"
            safe_harness_logs="$(grep -E 'MelodixHarness: (started|phase=[a-z_]+|failure phase=[a-z_]+ type=[A-Za-z0-9_$]+|completed)$' "$state_dir/instrumentation-safe-logcat.txt" | sed -E 's/^.*MelodixHarness: //' | tr '\n' ';' | cut -c1-500 || true)"
            transcript_bytes="$(wc -c < "$state_dir/android-instrumentation.txt" | tr -d '[:space:]')"
            framework_summary="$(python3 - "$state_dir/android-instrumentation.txt" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          patterns = (
              ("ClassNotFoundException", r"\bClassNotFoundException\b"),
              ("NoClassDefFoundError", r"\bNoClassDefFoundError\b"),
              ("SecurityException", r"\bSecurityException\b"),
              ("PermissionDenied", r"Permission Denial"),
              ("InstrumentationNotFound", r"Unable to find instrumentation|no instrumentation found"),
              ("ActivityNotFoundException", r"\bActivityNotFoundException\b"),
              ("IllegalAccessException", r"\bIllegalAccess(?:Exception|Error)\b"),
              ("NullPointerException", r"\bNullPointerException\b"),
              ("AssertionError", r"\bAssertionError\b"),
              ("Timeout", r"\bTimeoutException\b|\btimed out\b"),
              ("ProcessCrashed", r"Process crashed|\bCRASHED\b"),
              ("RuntimeException", r"\bRuntimeException\b"),
          )
          category = next((name for name, pattern in patterns if re.search(pattern, text, re.I)), "unclassified")
          result_keys = sorted(set(re.findall(r"^INSTRUMENTATION_RESULT: ([A-Za-z0-9_.-]+)=", text, re.M)))
          status_keys = sorted(set(re.findall(r"^INSTRUMENTATION_STATUS: ([A-Za-z0-9_.-]+)=", text, re.M)))
          status_count = len(re.findall(r"^INSTRUMENTATION_STATUS: ", text, re.M))
          failed = bool(re.search(r"^INSTRUMENTATION_FAILED:", text, re.M))
          code = bool(re.search(r"^INSTRUMENTATION_(?:STATUS_)?CODE: ", text, re.M))
          print(f"framework_statuses={status_count}; result_keys={','.join(result_keys) or 'none'}; status_keys={','.join(status_keys) or 'none'}; code_present={str(code).lower()}; failed_marker={str(failed).lower()}; failure_category={category}")
          PY
          )"
            echo "::error title=Android UI instrumentation::exit=$instrumentation_status; safe_statuses=${safe_statuses:-none}; harness_markers=${safe_harness_logs:-none}; transcript_bytes=$transcript_bytes; $framework_summary"
            exit 1
          fi

          required_statuses=(
            'INSTRUMENTATION_STATUS: phase=login_without_session'
            'INSTRUMENTATION_STATUS: authenticated_session=false'
            'INSTRUMENTATION_STATUS: login_ui_visible_in_webview_dom=true'
            'INSTRUMENTATION_STATUS: webview_visible_and_measured=true'
            'INSTRUMENTATION_STATUS: network_error_transition_recovered=true'
            'INSTRUMENTATION_STATUS: original_webview_url_preserved=true'
            'INSTRUMENTATION_STATUS: splash_hidden=true'
            'INSTRUMENTATION_STATUS: native_home_hidden=true'
            'INSTRUMENTATION_STATUS: phase=empty_home_fallback'
            'INSTRUMENTATION_STATUS: home_payload_empty=true'
            'INSTRUMENTATION_STATUS: playlist_or_card_injected=false'
            'INSTRUMENTATION_STATUS: native_home_cards_attached=false'
            'INSTRUMENTATION_STATUS: native_home_content_ready=false'
            'INSTRUMENTATION_STATUS: native_content_container_empty=true'
            'INSTRUMENTATION_STATUS: native_root_hidden=true'
            'INSTRUMENTATION_STATUS: webview_container_visible=true'
            'INSTRUMENTATION_STATUS: webview_visible_and_measured=true'
            'INSTRUMENTATION_STATUS: overall=passed'
            'INSTRUMENTATION_CODE: -1'
          )
          for expected in "${required_statuses[@]}"; do
            if ! grep -Fq "$expected" "$state_dir/android-instrumentation.txt"; then
              echo "::error::Missing required Android UI assertion: $expected"
              exit 1
            fi
          done

      - name: Verify activity resumed after Android instrumentation
        id: post-instrumentation
        if: always() && steps.launch.outcome == 'success'
        shell: bash
        env:
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          PACKAGE_ID: ${{ steps.apk.outputs.package_id }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/melodix-preview-emulator-state"
          sleep 2
          resumed_after_instrumentation="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep -F 'com.melodix.music.preview/com.melodix.music.MainActivity' | head -n 1 || true)"
          if [[ -z "$resumed_after_instrumentation" ]]; then
            resumed_state="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | head -n 1 | tr -cd 'A-Za-z0-9_.:/@ -' | cut -c1-300 || true)"
            focus_state="$(adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | head -n 1 | tr -cd 'A-Za-z0-9_.:/@ -' | cut -c1-300 || true)"
            echo "::error title=Post-instrumentation activity::MainActivity was not resumed; resumed=${resumed_state:-none}; focus=${focus_state:-none}; harness=$INTEGRATION_OUTCOME"
            exit 1
          fi
          resumed_process="$(adb shell pidof -s com.melodix.music.preview 2>/dev/null | tr -d '\r' || true)"
          [[ -n "$resumed_process" ]] || { echo "::error::Preview process exited after the Android instrumentation attempt."; exit 1; }
          if [[ "$INTEGRATION_OUTCOME" == "skipped" ]]; then
            echo "Preview MainActivity remains resumed after cold launch; the instrumentation harness did not run."
          else
            echo "Verified Preview MainActivity remains resumed after the Android instrumentation attempt (pid=$resumed_process; harness=$INTEGRATION_OUTCOME)."
          fi

          if [[ "$INTEGRATION_OUTCOME" != "success" ]]; then
            echo "::notice title=Post-instrumentation activity::activity_resumed=true; harness_outcome=$INTEGRATION_OUTCOME; Home screenshot not treated as verified"
            exit 0
          fi

          adb shell uiautomator dump --compressed /sdcard/melodix-preview-home-fallback.xml >/dev/null 2>&1
          adb exec-out cat /sdcard/melodix-preview-home-fallback.xml > "$state_dir/home-fallback-window.xml"
          adb exec-out screencap -p > "$state_dir/home-empty-fallback.png"
          python3 tests/android/inspect_hierarchy.py empty-home \
            "$state_dir/home-fallback-window.xml" \
            "$state_dir/home-empty-fallback.png" \
            "$state_dir/home-fallback-hierarchy-redacted.json"
          cp "${{ steps.apk.outputs.asset_manifest }}" "$state_dir/assets-manifest.json"

      - name: Inspect the preserved cold-launch hierarchy and pixels
        id: cold-launch-inspection
        if: always() && steps.launch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/melodix-preview-emulator-state"
          python3 tests/android/inspect_hierarchy.py login \
            "$state_dir/login-window.xml" \
            "$state_dir/login-screen.png" \
            "$state_dir/login-hierarchy-redacted.json"

      - name: Add verified run details to the summary
        if: always()
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          PREVIEW_RUN_ID: ${{ github.run_id }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          PACKAGE_ID: ${{ steps.apk.outputs.package_id }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
          POST_INSTRUMENTATION_OUTCOME: ${{ steps.post-instrumentation.outcome }}
          COLD_LAUNCH_OUTCOME: ${{ steps.cold-launch-inspection.outcome }}
        run: |
          {
            echo "## Android 16 Preview UI integration check"
            echo
            echo "- Source commit: \`$SOURCE_REF\`"
            echo "- Preview build run: \`$PREVIEW_RUN_ID\`"
            echo "- Package: \`${PACKAGE_ID:-not verified}\`"
            echo "- versionName / versionCode: \`${VERSION_NAME:-unknown}\` / \`${VERSION_CODE:-unknown}\`"
            echo "- APK SHA-256: \`${APK_SHA256:-not verified}\`"
            echo "- Instrumentation outcome: \`${INTEGRATION_OUTCOME:-not run}\`"
            echo "- Post-instrumentation resumed activity/Home check: \`${POST_INSTRUMENTATION_OUTCOME:-not run}\`"
            echo "- Preserved cold-launch hierarchy/pixel check: \`${COLD_LAUNCH_OUTCOME:-not run}\`"
            echo "- Emulator setup: fresh app data; only BLUETOOTH_CONNECT granted to pass Android's runtime permission prompt; no Spotify session or cookies supplied."
            echo "- Scope: unauthenticated login surface plus empty-Home WebView fallback using the exact Preview APK; no playlist data or Spotify credentials were supplied, and authenticated Home rendering is not claimed."
          } >> "$GITHUB_STEP_SUMMARY"

          state_dir="$RUNNER_TEMP/melodix-preview-emulator-state"
          if [[ -d "$state_dir" ]]; then
            python3 - \
              "$state_dir" \
              "$SOURCE_REF" \
              "$PREVIEW_RUN_ID" \
              "${APK_SHA256:-}" \
              "${PACKAGE_ID:-}" \
              "${VERSION_NAME:-}" \
              "${VERSION_CODE:-}" \
              "${INTEGRATION_OUTCOME:-not run}" \
              "${POST_INSTRUMENTATION_OUTCOME:-not run}" \
              "${COLD_LAUNCH_OUTCOME:-not run}" <<'PY'
          import json
          import pathlib
          import sys

          (state_dir, source_ref, run_id, apk_sha256, package_id, version_name,
           version_code, integration, post_instrumentation, cold_launch) = sys.argv[1:]
          root = pathlib.Path(state_dir)
          exists = lambda name: (root / name).is_file()
          transcript = (root / "android-instrumentation.txt").read_text(encoding="utf-8", errors="replace") if exists("android-instrumentation.txt") else ""
          permission_state = json.loads((root / "permission-prompt-summary.json").read_text(encoding="utf-8")) if exists("permission-prompt-summary.json") else {}
          login_dom_visible = None
          unauthenticated_session_confirmed = "INSTRUMENTATION_STATUS: authenticated_session=false" in transcript
          if unauthenticated_session_confirmed and "INSTRUMENTATION_STATUS: login_ui_visible_in_webview_dom=true" in transcript:
              login_dom_visible = True
          elif unauthenticated_session_confirmed and "INSTRUMENTATION_STATUS: login_ui_visible_in_webview_dom=false" in transcript:
              login_dom_visible = False
          reference = {
              "source_commit": source_ref,
              "build_and_test_run_id": run_id,
              "tested_apk_sha256": apk_sha256 or None,
              "package_id": package_id or None,
              "version_name": version_name or None,
              "version_code": version_code or None,
              "test_emulator_permission_setup": "BLUETOOTH_CONNECT granted before launch; app data cleared; no Spotify session or cookies supplied",
              "first_launch_permission_hierarchy_available": permission_state.get("hierarchy_available", False),
              "permission_controller_in_first_launch_hierarchy": permission_state.get("permission_controller_in_hierarchy", False),
              "permission_controls_in_first_launch_hierarchy": permission_state.get("permission_allow_or_deny_control_present", False),
              "permission_allow_control_position_captured": permission_state.get("permission_allow_center_x_px") is not None and permission_state.get("permission_allow_center_y_px") is not None,
              "first_launch_hierarchy_top_package": permission_state.get("top_package"),
              "integration_outcome": integration,
              "login_ui_visible_in_webview_dom": login_dom_visible,
              "login_dom_probe_observed": login_dom_visible is not None,
              "cold_launch_hierarchy_pixels_outcome": cold_launch,
              "cold_launch_hierarchy_pixels_verified": cold_launch == "success",
              "post_instrumentation_outcome": post_instrumentation,
              "activity_resumed_after_instrumentation_attempt": integration in ("success", "failure") and post_instrumentation == "success",
              "empty_home_hierarchy_pixels_verified": integration == "success" and post_instrumentation == "success",
              "empty_home_payload_confirmed": "INSTRUMENTATION_STATUS: home_payload_empty=true" in transcript,
              "playlist_or_card_injected_by_harness": "INSTRUMENTATION_STATUS: playlist_or_card_injected=true" in transcript,
              "no_playlist_or_card_injected_status_confirmed": "INSTRUMENTATION_STATUS: playlist_or_card_injected=false" in transcript,
              "authenticated_home_test": "not performed; no legitimate Spotify session was supplied",
              "screenshots": [name for name in ("login-screen.png", "home-empty-fallback.png") if exists(name)],
              "redacted_hierarchies": [name for name in ("login-hierarchy-redacted.json", "home-fallback-hierarchy-redacted.json") if exists(name)],
              "raw_hierarchy_uploaded": False,
          }
          (root / "verification-reference.json").write_text(
              json.dumps(reference, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps({key: reference[key] for key in (
              "integration_outcome", "login_ui_visible_in_webview_dom",
              "first_launch_permission_hierarchy_available", "permission_controller_in_first_launch_hierarchy",
              "permission_controls_in_first_launch_hierarchy", "permission_allow_control_position_captured",
              "first_launch_hierarchy_top_package",
              "cold_launch_hierarchy_pixels_outcome", "activity_resumed_after_instrumentation_attempt",
              "empty_home_hierarchy_pixels_verified", "empty_home_payload_confirmed",
              "playlist_or_card_injected_by_harness", "no_playlist_or_card_injected_status_confirmed",
              "authenticated_home_test"
          )}, sort_keys=True))
          PY
            python3 - "$state_dir" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          summary_path = pathlib.Path(sys.argv[2])
          safe_fields = (
              "phase", "ui_hierarchy_node_count", "ui_hierarchy_top_node_class",
              "ui_hierarchy_top_node_package", "ui_hierarchy_top_node_resource_id",
              "webview_container_node_present", "webview_container_accessibility_visible",
              "webview_accessibility_node_present", "webview_accessibility_node_has_bounds",
              "webview_accessibility_node_visible_to_user", "webview_accessibility_node_visible",
              "splash_accessibility_node_present", "splash_accessibility_visible",
              "native_root_accessibility_visible", "native_home_tab_accessibility_visible",
              "native_rows_scroll_accessibility_visible", "login_text_detected_in_hierarchy",
              "screenshot_pixels"
          )
          with summary_path.open("a", encoding="utf-8") as output:
              for filename, title in (
                  ("login-hierarchy-redacted.json", "Cold-launch WebView hierarchy and pixels (redacted)"),
                  ("home-fallback-hierarchy-redacted.json", "Empty-Home fallback hierarchy and pixels (redacted)"),
              ):
                  path = root / filename
                  if not path.is_file():
                      continue
                  state = json.loads(path.read_text(encoding="utf-8"))
                  output.write(f"\n### {title}\n\n")
                  for key in safe_fields:
                      if key in state:
                          output.write(f"- {key}: {json.dumps(state[key], sort_keys=True)}\n")
          permission_path = root / "permission-prompt-summary.json"
          if permission_path.is_file():
              state = json.loads(permission_path.read_text(encoding="utf-8"))
              with summary_path.open("a", encoding="utf-8") as output:
                  output.write("\n### First-launch Android permission surface (redacted)\n\n")
                  for key in (
                      "hierarchy_available", "hierarchy_node_count", "top_package", "top_class",
                      "permission_controller_in_hierarchy", "permission_allow_or_deny_control_present",
                      "permission_allow_button_bounds_px", "permission_allow_center_x_px",
                      "permission_allow_center_y_px", "text_nodes_present_count"
                  ):
                      if key in state:
                          output.write(f"- {key}: {json.dumps(state[key], sort_keys=True)}\n")
          PY
          fi

          login_dom_visible=not_confirmed
          empty_home_payload_confirmed=false
          playlist_or_card_injected_by_harness=false
          if [[ -s "$state_dir/android-instrumentation.txt" ]]; then
            if grep -Fq 'INSTRUMENTATION_STATUS: authenticated_session=false' "$state_dir/android-instrumentation.txt"; then
              if grep -Fq 'INSTRUMENTATION_STATUS: login_ui_visible_in_webview_dom=true' "$state_dir/android-instrumentation.txt"; then
                login_dom_visible=true
              elif grep -Fq 'INSTRUMENTATION_STATUS: login_ui_visible_in_webview_dom=false' "$state_dir/android-instrumentation.txt"; then
                login_dom_visible=false
              fi
            fi
            grep -Fq 'INSTRUMENTATION_STATUS: home_payload_empty=true' "$state_dir/android-instrumentation.txt" && empty_home_payload_confirmed=true || true
            grep -Fq 'INSTRUMENTATION_STATUS: playlist_or_card_injected=true' "$state_dir/android-instrumentation.txt" && playlist_or_card_injected_by_harness=true || true
          fi
          empty_home_pixels_verified=false
          if [[ "$INTEGRATION_OUTCOME" == "success" && "$POST_INSTRUMENTATION_OUTCOME" == "success" ]]; then
            empty_home_pixels_verified=true
          fi
          activity_resumed=false
          if [[ "$POST_INSTRUMENTATION_OUTCOME" == "success" && "$INTEGRATION_OUTCOME" != "skipped" && "$INTEGRATION_OUTCOME" != "not run" ]]; then
            activity_resumed=true
          fi
          echo "::notice title=Android evidence outcomes::source=$SOURCE_REF; apk_sha256=${APK_SHA256:-not_verified}; integration=$INTEGRATION_OUTCOME; login_dom_visible=$login_dom_visible; cold_login_hierarchy_pixels=$COLD_LAUNCH_OUTCOME; activity_resumed_after_attempt=$activity_resumed; empty_home_payload_confirmed=$empty_home_payload_confirmed; playlist_or_card_injected=$playlist_or_card_injected_by_harness; empty_home_pixels_verified=$empty_home_pixels_verified; authenticated_home=not_tested"

      - name: Upload verified screenshot and redacted launch summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Melodix-Preview-Android16-${{ inputs.source_ref || github.sha }}
          path: |
            ${{ runner.temp }}/melodix-preview-emulator-state/login-screen.png
            ${{ runner.temp }}/melodix-preview-emulator-state/permission-prompt-summary.json
            ${{ runner.temp }}/melodix-preview-emulator-state/login-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/home-empty-fallback.png
            ${{ runner.temp }}/melodix-preview-emulator-state/home-fallback-hierarchy-redacted.json
            ${{ runner.temp }}/melodix-preview-emulator-state/android-instrumentation.txt
            ${{ runner.temp }}/melodix-preview-emulator-state/instrumentation-safe-logcat.txt
            ${{ runner.temp }}/melodix-preview-emulator-state/verification-reference.json
            ${{ runner.temp }}/melodix-preview-emulator-state/assets-manifest.json
          retention-days: 14
          if-no-files-found: warn
