            local needle="$2"
            python3 - "$xml" "$needle" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          all_txt = "\n".join((n.get("text") or "") + " " + (n.get("content-desc") or "") for n in root.iter())
          if sys.argv[2].lower() in all_txt.lower():
              print(f"::error title=UI lacks failed ({sys.argv[1]})::unexpected={sys.argv[2]!r}; visible={all_txt[:350]!r}")
              raise SystemExit(1)
