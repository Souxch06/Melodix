                      continue
                  x1, y1, x2, y2 = map(int, m.groups())
                  w, h = x2 - x1, y2 - y1
                  if w == 0 or h == 0:
                      continue
                  clickable = node.get("clickable") == "true"
                  if clickable and txt and (w < 40 or h < 40):
                      issues.append(f"{os.path.basename(xml_path)}: '{txt[:24]}' touch target {w}x{h}")
          if issues:
