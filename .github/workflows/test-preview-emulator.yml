name: Smoke test Preview APK on Android emulator

on:
  workflow_call:
    inputs:
      source_ref:
        description: Full commit SHA to build and verify on Android emulator
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full commit SHA to build and verify on Android emulator
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: emulator-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  emulator-e2e:
    name: Build Preview APK and verify startup, home, navigation, search, library, back, and logout on Android emulator
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - name: Resolve target commit SHA
        id: meta
        env:
          INPUT_SOURCE_REF: ${{ inputs.source_ref || '' }}
        run: |
          set -euo pipefail
          target="${INPUT_SOURCE_REF:-$GITHUB_SHA}"
          if [[ ! "$target" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Target commit must be a full 40-character SHA (got '$target')."
            exit 1
          fi
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"

      - name: Check out target source commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.meta.outputs.target_sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build tools and Node tests check
        id: tests
        env:
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/emulator-output"
          tap_file="$GITHUB_WORKSPACE/emulator-output/node-tests-${TARGET_SHA}.tap"
          if ! node --test tests/*.test.js | tee "$tap_file"; then
            fail_line="$(grep -E '^# (tests|pass|fail) ' "$tap_file" | tr '\n' ' ' || true)"
            echo "::error title=Node Test Suite Failed::commit=${TARGET_SHA}; ${fail_line:-test failure}"
            exit 1
          fi
          total="$(awk '/^# tests / {print $3}' "$tap_file" | tail -n 1)"
          passed="$(awk '/^# pass / {print $3}' "$tap_file" | tail -n 1)"
          echo "tests_total=${total:-0}" >> "$GITHUB_OUTPUT"
          echo "tests_passed=${passed:-0}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Node Test Suite::PASS (${passed:-0}/${total:-0} passed; commit=${TARGET_SHA})"
          sdkmanager --install "build-tools;35.0.0"

      - name: Build production Preview APK and E2E instrumentation APK for exact commit SHA
        id: build
        env:
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
          MELODIX_PREVIEW_KEYSTORE_B64: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_B64 }}
          MELODIX_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
          MELODIX_PREVIEW_KEY_PASSWORD: ${{ secrets.MELODIX_PREVIEW_KEY_PASSWORD || secrets.MELODIX_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE"
          framework_dir="$RUNNER_TEMP/melodix-framework"
          out_dir="$GITHUB_WORKSPACE/emulator-output"
          mkdir -p "$framework_dir" "$out_dir"

          curl --fail --silent --show-error --location \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            --output "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" if --frame-path "$framework_dir" \
            "$source_dir/android/apktool-framework/1.apk"

          signing_keystore="$RUNNER_TEMP/preview-signing.jks"
          if [[ -n "$MELODIX_PREVIEW_KEYSTORE_B64" && -n "$MELODIX_PREVIEW_KEYSTORE_PASSWORD" ]]; then
            printf '%s' "$MELODIX_PREVIEW_KEYSTORE_B64" | base64 --decode > "$signing_keystore"
            alias_name="MELODIX_PREVIEW"
            export KS_PASS="$MELODIX_PREVIEW_KEYSTORE_PASSWORD"
            export KEY_PASS="$MELODIX_PREVIEW_KEY_PASSWORD"
          else
            alias_name="LAUNCH_TEST"
            export KS_PASS="melodix-preview-test"
            export KEY_PASS="melodix-preview-test"
            keytool -genkeypair -keystore "$signing_keystore" -alias "$alias_name" -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass:env KS_PASS -keypass:env KEY_PASS \
              -dname "CN=Melodix Preview Test, O=Melodix, C=FR" >/dev/null
          fi
          keytool -exportcert -alias "$alias_name" -keystore "$signing_keystore" \
            -storepass:env KS_PASS -file "$RUNNER_TEMP/cert.der" >/dev/null
          fingerprint_hex="$(sha256sum "$RUNNER_TEMP/cert.der" | awk '{print toupper($1)}')"
          preview_fingerprint="$(printf '%s' "$fingerprint_hex" | fold -w 2 | paste -sd ':' -)"

          build_variant() {
            local mode="$1"
            local out_name="$2"
            local vcode="$3"
            local work_dir="$RUNNER_TEMP/work-$mode"
            mkdir -p "$work_dir"
            for item in AndroidManifest.xml META-INF apktool.yml assets kotlin lib original res smali unknown; do
              cp -a "$source_dir/$item" "$work_dir/"
            done

            python3 - "$work_dir/AndroidManifest.xml" "$TARGET_SHA" <<'PY'
          import sys, xml.etree.ElementTree as ET
          manifest_path, sha = sys.argv[1], sys.argv[2][:7]
          ns = "http://schemas.android.com/apk/res/android"
          a = "{" + ns + "}"
          ET.register_namespace("android", ns)
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          orig, prev = "com.melodix.music", "com.melodix.music.preview"
          root.set("package", prev)
          for el in root.iter():
              if el.get(a + "name") == orig + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION":
                  el.set(a + "name", prev + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION")
              auth = el.get(a + "authorities")
              if auth and auth.startswith(orig + "."):
                  el.set(a + "authorities", prev + auth[len(orig):])
              if el.get(a + "label") == "Melodix":
                  el.set(a + "label", "Melodix Preview " + sha)
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True, short_empty_elements=True)
          PY

            if [[ "$mode" == "e2e" ]]; then
              python3 - "$work_dir/smali/com/melodix/music/MainActivity.smali" <<'PY'
          import sys
          p = sys.argv[1]
          src = open(p, encoding="utf-8").read()
          anchor = ".method public final onNewIntent(Landroid/content/Intent;)V"
          start = src.index(anchor)
          end = src.index(".end method", start)
          method = src[start:end].replace("    .locals 2", "    .locals 5", 1)
          old_tail = "    :cond_1\n    return-void"
          assert old_tail in method, "Expected :cond_1 tail in MainActivity.onNewIntent"
          e2e_hook = """    :cond_1
              if-eqz p1, :e2e_done
              const-string v0, "e2e_type"
              invoke-virtual {p1, v0}, Landroid/content/Intent;->getStringExtra(Ljava/lang/String;)Ljava/lang/String;
              move-result-object v0
              if-eqz v0, :e2e_done
              iget-object v1, p0, Lcom/melodix/music/MainActivity;->G:Landroid/webkit/WebView;
              if-eqz v1, :e2e_after_blank
              const-string v2, "about:blank"
              invoke-virtual {v1, v2}, Landroid/webkit/WebView;->loadUrl(Ljava/lang/String;)V
              :e2e_after_blank
              sget v1, Lcom/melodix/music/MainActivity;->nativeSessionEpoch:I
              add-int/lit8 v1, v1, 0x1
              sput v1, Lcom/melodix/music/MainActivity;->nativeSessionEpoch:I
              const-string v1, "e2e_b64"
              invoke-virtual {p1, v1}, Landroid/content/Intent;->getStringExtra(Ljava/lang/String;)Ljava/lang/String;
              move-result-object v1
              if-eqz v1, :e2e_check_logout
              const-string v2, "e2e_tb64"
              invoke-virtual {p1, v2}, Landroid/content/Intent;->getStringExtra(Ljava/lang/String;)Ljava/lang/String;
              move-result-object v2
              if-eqz v2, :e2e_decode_val
              const/4 v3, 0x0
              invoke-static {v2, v3}, Landroid/util/Base64;->decode(Ljava/lang/String;I)[B
              move-result-object v2
              new-instance v0, Ljava/lang/String;
              const-string v3, "UTF-8"
              invoke-direct {v0, v2, v3}, Ljava/lang/String;-><init>([BLjava/lang/String;)V
              :e2e_decode_val
              const/4 v2, 0x0
              invoke-static {v1, v2}, Landroid/util/Base64;->decode(Ljava/lang/String;I)[B
              move-result-object v1
              new-instance v2, Ljava/lang/String;
              const-string v3, "UTF-8"
              invoke-direct {v2, v1, v3}, Ljava/lang/String;-><init>([BLjava/lang/String;)V
              invoke-virtual {p0, v0, v2}, Lcom/melodix/music/MainActivity;->postNativeUiData(Ljava/lang/String;Ljava/lang/String;)V
              return-void
              :e2e_check_logout
              const-string v1, "logout_race"
              invoke-virtual {v0, v1}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
              move-result v1
              if-eqz v1, :e2e_check_recreate
              new-instance v3, Lcom/melodix/music/AndBridge;
              invoke-virtual {p0}, Landroid/content/Context;->getApplicationContext()Landroid/content/Context;
              move-result-object v4
              invoke-direct {v3, v4}, Lcom/melodix/music/AndBridge;-><init>(Landroid/content/Context;)V
              new-instance v4, Lcom/melodix/music/NativeHomeJsonCallback;
              invoke-direct {v4, p0}, Lcom/melodix/music/NativeHomeJsonCallback;-><init>(Lcom/melodix/music/MainActivity;)V
              new-instance v1, Lcom/melodix/music/NativeUiUpdateRunnable;
              const-string v2, "home-greeting"
              const-string v0, "Fuite Tardive Compte A"
              const/4 p1, 0x1
              invoke-direct {v1, p0, v2, v0, p1}, Lcom/melodix/music/NativeUiUpdateRunnable;-><init>(Lcom/melodix/music/MainActivity;Ljava/lang/String;Ljava/lang/String;I)V
              new-instance v2, Lcom/melodix/music/NativeHomeRetryRunnable;
              const/4 p1, 0x2
              invoke-direct {v2, p0, p1}, Lcom/melodix/music/NativeHomeRetryRunnable;-><init>(Lcom/melodix/music/MainActivity;I)V
              invoke-virtual {v2}, Lcom/melodix/music/NativeHomeRetryRunnable;->run()V
              invoke-virtual {p0}, Lcom/melodix/music/MainActivity;->resetNativeStateForLogout()V
              invoke-virtual {v1}, Lcom/melodix/music/NativeUiUpdateRunnable;->run()V
              const-string v2, "home-greeting"
              const-string v0, "Fuite Tardive Compte A"
              invoke-virtual {v3, v2, v0}, Lcom/melodix/music/AndBridge;->onNativeUiData(Ljava/lang/String;Ljava/lang/String;)V
              const-string v0, "[{\\"title\\":\\"Fuite Tardive Compte A\\",\\"uri\\":\\"spotify:playlist:99\\"}]"
              invoke-virtual {v4, v0}, Lcom/melodix/music/NativeHomeJsonCallback;->onReceiveValue(Ljava/lang/Object;)V
              return-void
              :e2e_check_recreate
              const-string v1, "recreate"
              invoke-virtual {v0, v1}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
              move-result v1
              if-eqz v1, :e2e_check_singleton_bridge
              invoke-virtual {p0}, Landroid/app/Activity;->recreate()V
              return-void
              :e2e_check_singleton_bridge
              const-string v1, "singleton_bridge"
              invoke-virtual {v0, v1}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
              move-result v1
              if-eqz v1, :e2e_only_logout
              new-instance v3, Lcom/melodix/music/AndBridge;
              invoke-virtual {p0}, Landroid/content/Context;->getApplicationContext()Landroid/content/Context;
              move-result-object v4
              invoke-direct {v3, v4}, Lcom/melodix/music/AndBridge;-><init>(Landroid/content/Context;)V
              invoke-virtual {v3}, Lcom/melodix/music/AndBridge;->onNativeUiReady()V
              const-string v1, "home-greeting"
              const-string v2, "Session Recreee OK"
              invoke-virtual {v3, v1, v2}, Lcom/melodix/music/AndBridge;->onNativeUiData(Ljava/lang/String;Ljava/lang/String;)V
              return-void
              :e2e_only_logout
              const-string v1, "logout"
              invoke-virtual {v0, v1}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z
              move-result v1
              if-eqz v1, :e2e_done
              new-instance v0, Lcom/melodix/music/NativeLogoutRunnable;
              invoke-direct {v0, p0}, Lcom/melodix/music/NativeLogoutRunnable;-><init>(Lcom/melodix/music/MainActivity;)V
              invoke-virtual {p0, v0}, Landroid/app/Activity;->runOnUiThread(Ljava/lang/Runnable;)V
              :e2e_done
              return-void"""
          patched = method.replace(old_tail, e2e_hook, 1)
          open(p, "w", encoding="utf-8").write(src[:start] + patched + src[end:])
          PY
            fi

            find "$work_dir" -type f -name '*.smali' -exec sed -i \
              's/com\.melodix\.music\.PIP_/com.melodix.music.preview.PIP_/g' {} +
            sed -i -E "s#(<string name=\"app_name\">)[^<]*(</string>)#\1Melodix Preview ${TARGET_SHA:0:7}\2#" \
              "$work_dir/res/values/strings.xml"
            sed -i -E "s#<string name=\"expected_signature_sha256\">[^<]*</string>#<string name=\"expected_signature_sha256\">$preview_fingerprint</string>#" \
              "$work_dir/res/values/strings.xml"
            sed -i -E "s/^apkFileName:.*/apkFileName: $out_name/" "$work_dir/apktool.yml"
            sed -i -E "s/^  versionCode: .*/  versionCode: $vcode/" "$work_dir/apktool.yml"
            sed -i -E "s/^  versionName: .*/  versionName: 1.2.2-${TARGET_SHA:0:7}/" "$work_dir/apktool.yml"

            java -jar "$RUNNER_TEMP/apktool.jar" b "$work_dir" --frame-path "$framework_dir" \
              --output "$RUNNER_TEMP/$mode-unsigned.apk" --force-all > "$out_dir/apktool-$mode.log" 2>&1
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 \
              "$RUNNER_TEMP/$mode-unsigned.apk" "$RUNNER_TEMP/$mode-aligned.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$signing_keystore" --ks-key-alias "$alias_name" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --out "$out_dir/$out_name" "$RUNNER_TEMP/$mode-aligned.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 24 "$out_dir/$out_name" >/dev/null
          }

          build_variant "prod" "Melodix-Preview-${TARGET_SHA:0:7}.apk" "$((1020229 + GITHUB_RUN_NUMBER))"
          build_variant "e2e" "Melodix-Preview-E2E-${TARGET_SHA:0:7}.apk" "$((1020230 + GITHUB_RUN_NUMBER))"
          echo "prod_apk=emulator-output/Melodix-Preview-${TARGET_SHA:0:7}.apk" >> "$GITHUB_OUTPUT"
          echo "e2e_apk=emulator-output/Melodix-Preview-E2E-${TARGET_SHA:0:7}.apk" >> "$GITHUB_OUTPUT"

      - name: Boot KVM-accelerated Android 15 emulator
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo 'no' | avdmanager create avd --force --name MelodixE2E \
            --package "system-images;android-35;google_apis;x86_64" --device pixel_2 >/dev/null
          "$ANDROID_HOME/emulator/emulator" -avd MelodixE2E \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb start-server >/dev/null
          for _ in $(seq 1 100); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              adb shell settings put global window_animation_scale 0
              adb shell settings put global transition_animation_scale 0
              adb shell settings put global animator_duration_scale 0
              echo "::notice title=Android Emulator::Booted API $(adb shell getprop ro.build.version.sdk | tr -d '\r') on $(uname -m)"
              exit 0
            fi
            sleep 5
          done
          grep -Ei 'error|fatal|panic' "$RUNNER_TEMP/emulator.log" | tail -n 10 || true
          exit 1

      - name: Phase 1 — Verify unmodified signed Preview APK cold startup & WebView session state
        env:
          PROD_APK: ${{ steps.build.outputs.prod_apk }}
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
        run: |
          set -euo pipefail
          pkg="com.melodix.music.preview"
          state="$GITHUB_WORKSPACE/emulator-output/phase1"
          mkdir -p "$state"
          adb install -r -t "$GITHUB_WORKSPACE/$PROD_APK"
          ver="$(adb shell dumpsys package "$pkg" | grep -m1 'versionName=' | tr -d ' \r')"
          echo "::notice title=Phase 1 Installed APK::$ver (commit=$TARGET_SHA)"
          if [[ "$ver" != "versionName=1.2.2-${TARGET_SHA:0:7}" ]]; then
            echo "::error::Installed APK versionName ($ver) does not match 1.2.2-${TARGET_SHA:0:7}"
            exit 1
          fi
          for perm in android.permission.POST_NOTIFICATIONS android.permission.BLUETOOTH_CONNECT; do
            adb shell pm grant "$pkg" "$perm" >/dev/null 2>&1 || true
          done

          for label in cold_launch_1 cold_launch_2; do
            adb logcat -c || true
            adb logcat -c -b crash || true
            adb shell am force-stop "$pkg" || true
            adb shell am start -n "$pkg/com.melodix.music.MainActivity" >/dev/null
            sleep 3
            init_pid="$(adb shell pidof "$pkg" | tr -d '\r' | awk '{print $1}')"
            sleep 27
            pid="$(adb shell pidof "$pkg" | tr -d '\r' | awk '{print $1}')"
            resumed="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tr '\n\r' '  ')"
            adb shell uiautomator dump --compressed /sdcard/p1.xml >/dev/null 2>&1 || true
            adb exec-out cat /sdcard/p1.xml > "$state/$label.xml" 2>/dev/null || true
            if [[ -z "$pid" ]] || [[ "$pid" != "$init_pid" ]] || ! grep -Fq "$pkg/com.melodix.music.MainActivity" <<< "$resumed"; then
              echo "::error title=Phase 1 $label::Process died/respawned (init=$init_pid cur=$pid) or MainActivity not resumed ($resumed)"
              exit 1
            fi
            adb logcat -d -v brief > "$state/$label-logcat.txt" 2>&1 || true
            adb logcat -d -b crash -v brief >> "$state/$label-logcat.txt" 2>&1 || true
            if grep -qE "MelodixCrash|NativeCrashGuard|VerifyError|IncompatibleClassChangeError|LinkageError|WindowManager\\\$BadTokenException|ReferenceError: cleanText" "$state/$label-logcat.txt" || grep -qF "Process: $pkg" "$state/$label-logcat.txt"; then
              p1_diag="$(grep -nE "Process: $pkg|MelodixCrash|NativeCrashGuard|VerifyError|IncompatibleClassChangeError|LinkageError|WindowManager\\\$BadTokenException|ReferenceError: cleanText" "$state/$label-logcat.txt" | head -n 15 | tr '\n\r' ' | ')"
              echo "::error title=Phase 1 $label Logcat::$p1_diag"
              exit 1
            fi
            echo "::notice title=Phase 1 $label::PASS (stable pid=$pid, MainActivity foreground, 0 crashes/verifier/JS errors across all PIDs)"
          done

      - name: Phase 2 — Verify Home, Detail, Player, Library, Search, Android Back button, and Logout end-to-end
        env:
          E2E_APK: ${{ steps.build.outputs.e2e_apk }}
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
          TESTS_TOTAL: ${{ steps.tests.outputs.tests_total }}
          TESTS_PASSED: ${{ steps.tests.outputs.tests_passed }}
        run: |
          set -euo pipefail
          set -E
          pkg="com.melodix.music.preview"
          state="$GITHUB_WORKSPACE/emulator-output/phase2"
          mkdir -p "$state"
          adb install -r -t "$GITHUB_WORKSPACE/$E2E_APK"
          for perm in android.permission.POST_NOTIFICATIONS android.permission.BLUETOOTH_CONNECT; do
            adb shell pm grant "$pkg" "$perm" >/dev/null 2>&1 || true
          done

          adb logcat -c || true
          adb logcat -c -b crash || true
          adb shell am force-stop "$pkg" || true
          adb shell am start -n "$pkg/com.melodix.music.MainActivity" >/dev/null
          sleep 12

          LAST_XML=""
          trap 'rc=$?; crash_tail="$(adb logcat -d -b crash -v brief 2>/dev/null | tail -n 12 | tr "\n\r" "  " || true)"; echo "::error title=Phase 2 failure at line $LINENO (rc=$rc)::last_xml=$LAST_XML crash=$crash_tail"' ERR

          dump_ui() {
            local name="$1"
            sleep 2
            adb shell uiautomator dump --compressed "/sdcard/$name.xml" >/dev/null 2>&1 || true
            adb exec-out cat "/sdcard/$name.xml" > "$state/$name.xml"
            LAST_XML="$state/$name.xml"
          }

          tap_text() {
            local xml="$1"
            local needle="$2"
            local coords
            coords="$(python3 - "$xml" "$needle" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          needle = sys.argv[2].lower()
          # The restored home shows the real Spotify web player inside the
          # WebView; its accessible nodes also appear in the uiautomator dump
          # and can shadow native chrome (tab bar, header). Skip every node
          # under a WebView and prefer the LAST native match - native chrome
          # is laid out after the WebView.
          web = set()
          for node in root.iter():
              if (node.get("class") or "") == "android.webkit.WebView":
                  for sub in node.iter():
                      web.add(id(sub))
          found = None
          for node in root.iter():
              if id(node) in web:
                  continue
              txt = (node.get("text") or "") + " " + (node.get("content-desc") or "")
              if needle in txt.lower():
                  m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.get("bounds") or "")
                  if m:
                      x1, y1, x2, y2 = map(int, m.groups())
                      if x2 > x1 and y2 > y1:
                          found = ((x1 + x2) // 2, (y1 + y2) // 2)
          if found is None:
              raise SystemExit(f"Could not find UI element matching {needle!r}")
          print(found[0], found[1])
          PY
            )" || { echo "::error title=tap_text failed::needle=$2 xml=$1 visible=$(python3 -c 'import sys,xml.etree.ElementTree as ET;r=ET.parse(sys.argv[1]).getroot();print(" | ".join(filter(None,((n.get("text") or "").strip() or (n.get("content-desc") or "").strip() for n in r.iter())))[:350])' "$1" 2>/dev/null || echo '?')"; return 1; }
            local cx="${coords% *}"
            local cy="${coords##* }"
            if ! [[ "$cx" =~ ^[0-9]+$ && "$cy" =~ ^[0-9]+$ ]]; then
              echo "::error title=tap_text bad coords::needle=$2 coords='$coords'"
              return 1
            fi
            adb shell input tap "$cx" "$cy"
          }

          assert_ui_has() {
            local xml="$1"
            local needle="$2"
            if ! python3 - "$xml" "$needle" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          all_txt = " | ".join(filter(None, ((n.get("text") or "").strip() or (n.get("content-desc") or "").strip() for n in root.iter())))
          if sys.argv[2].lower() not in all_txt.lower():
              print(f"::error title=UI assertion failed ({sys.argv[1]})::expected={sys.argv[2]!r}; visible={all_txt[:350]!r}")
              raise SystemExit(1)
          PY
            then
              cur_pid="$(adb shell pidof "$pkg" 2>/dev/null | tr -d '\r' || true)"
              mdx="$(adb logcat -d -s MDXTRACE:I NativeCrashGuard:E AndroidRuntime:E 2>/dev/null | tail -n 55 | tr '\n\r' ' | ' || true)"
              win="$(adb shell dumpsys window 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp|OnBackInvoked' | head -n 10 | tr '\n\r' ' | ' || true)"
              echo "::error title=Emulator state at failure::pid=${cur_pid} win=${win:0:350}"
              echo "::error title=Crash and MDXTRACE logcat::${mdx:0:2200}"
              exit 1
            fi
          }

          assert_ui_lacks() {
