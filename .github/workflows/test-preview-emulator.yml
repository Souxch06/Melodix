          assert_ui_lacks "$state/08c_settings_after_late.xml" "Chargement des playlists"
          assert_ui_lacks "$state/08c_settings_after_late.xml" "Ma Playlist Tardive"
          assert_ui_lacks "$state/08c_settings_after_late.xml" "Impossible de charger les playlists"
          adb shell input keyevent 4
