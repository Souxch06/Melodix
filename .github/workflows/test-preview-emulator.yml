          adb logcat -d -b crash -v brief >> "$state/e2e-logcat.txt" 2>&1 || true
          if grep -qE "MelodixCrash|NativeCrashGuard|VerifyError|IncompatibleClassChangeError|LinkageError|IntentReceiverLeaked|WindowManager\\\$BadTokenException" "$state/e2e-logcat.txt" || grep -qF "Process: $pkg" "$state/e2e-logcat.txt"; then
            diag="$(grep -nE "Process: $pkg|MelodixCrash|NativeCrashGuard|VerifyError|IncompatibleClassChangeError|LinkageError|IntentReceiverLeaked|WindowManager\\\$BadTokenException" "$state/e2e-logcat.txt" | head -n 15 | tr '\n\r' ' | ')"
            echo "::error title=Logcat Error Found::$diag"
            exit 1
          fi
          echo "::notice title=E2E Logout + Security + Rotation + Logcat::PASS (Logout/Epoch guard blocked stale Account A callbacks; deep-link injection & malformed JSON handled cleanly; rotation survived; stable pid=$pid across all PIDs)"

          python3 - "$GITHUB_WORKSPACE/emulator-output/verification-summary-${TARGET_SHA}.json" <<PY
          import datetime, json, sys
          report = {
              "commit_sha": "${TARGET_SHA}",
              "branch_ref": "${GITHUB_REF_NAME}",
              "event_name": "${GITHUB_EVENT_NAME}",
              "workflow_run_id": "${GITHUB_RUN_ID}",
              "workflow_run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
              "emulator_api_level": 35,
              "node_tests_total": int("${TESTS_TOTAL:-0}"),
              "node_tests_passed": int("${TESTS_PASSED:-0}"),
              "phase1_cold_startup": "PASS",
              "phase2_e2e_flows": "PASS",
              "final_pid": int("${pid}"),
              "verified_at_utc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2)
          PY

          {
            echo "## Melodix Android Emulator Verification Summary"
            echo ""
            echo "| Check | Status |"
            echo "| --- | --- |"
            echo "| Target commit SHA | \`${TARGET_SHA}\` |"
            echo "| Node & static Dalvik suite | \`${TESTS_PASSED}/${TESTS_TOTAL}\` passed |"
            echo "| Phase 1 unmodified Preview APK cold launches | PASS |"
            echo "| Phase 2 Home / Detail / Player / Library / Search / Back / Logout / Rotation | PASS (\`pid=${pid}\`) |"
            echo "| Diagnostics & UI XML bundle | \`Melodix-Emulator-Verification-${TARGET_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator E2E UI dumps and logcat artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Melodix-Emulator-Verification-${{ steps.meta.outputs.target_sha }}
          path: emulator-output
          if-no-files-found: warn
          retention-days: 30
