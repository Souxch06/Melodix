          else
            echo "::error::The observed WebView origin is not an expected Spotify origin."
            exit 1
          fi
          for expected in "${css_statuses[@]}"; do
            if ! grep -Fq "$expected" "$state_dir/android-instrumentation.txt"; then
              echo "::error::Missing origin-appropriate Web Home CSS assertion: $expected"
              exit 1
            fi
          done

      - name: Exercise authenticated-home observer to normal timeout without a session
        id: authenticated-home-ci
        if: always() && steps.launch.outcome == 'success' && steps.authenticated-home-bundle-upload.outcome == 'success'
        shell: bash
        env:
          TEST_APK: ${{ runner.temp }}/melodix-ui-harness.apk
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/melodix-preview-emulator-state"
          observer_output="$state_dir/authenticated-home-observer-ci.txt"
          [[ -s "$TEST_APK" && -d "$state_dir" ]] || { echo "::error::The exact runner and emulator state are required for the observer self-test."; exit 1; }
          adb install -r "$TEST_APK"
          adb logcat -c
          set +e
          timeout --signal=TERM --kill-after=10s 120s adb shell am instrument -w -r \
            -e mode authenticated-home \
            -e timeout_ms 30000 \
            com.melodix.music.preview.test/com.melodix.test.HomeRenderInstrumentation \
            > "$observer_output" 2>&1
          observer_exit=$?
          set -e
          cat "$observer_output"
          [[ "$observer_exit" == "0" ]] || { echo "::error::Authenticated-home observer CI self-test exited $observer_exit instead of completing normally."; exit 1; }
          required_observer_statuses=(
            'INSTRUMENTATION_STATUS: phase=authenticated_home_observation_complete'
            'INSTRUMENTATION_STATUS: overall=blocked_no_home_content_observed'
            'INSTRUMENTATION_STATUS: observation_deadline_reached=true'
            'INSTRUMENTATION_STATUS: observation_timeout_ms_capped=30000'
            'INSTRUMENTATION_STATUS: authenticated_home_test_performed=false'
            'INSTRUMENTATION_STATUS: manual_auth_or_navigation_is_automated=false'
            'INSTRUMENTATION_STATUS: activity_lifecycle_observer_registered=true'
            'INSTRUMENTATION_STATUS: activity_lifecycle_observer_unregistered=true'
            'INSTRUMENTATION_STATUS: target_activity_resumed_callback_seen=true'
            'INSTRUMENTATION_STATUS: window_callback_observer_installed=true'
            'INSTRUMENTATION_STATUS: window_callback_observer_restored=true'
            'INSTRUMENTATION_STATUS: window_callback_observer_active=false'
            'INSTRUMENTATION_STATUS: primary_webview_present=true'
          )
          for expected in "${required_observer_statuses[@]}"; do
            if ! grep -Fq "$expected" "$observer_output"; then
              echo "::error::Authenticated-home observer self-test omitted required status: $expected"
              exit 1
            fi
          done
          if grep -Eq '^INSTRUMENTATION_STATUS: (authenticated_session|session_(proven|proof_source)|live_webview_(session_proven|session_proof)|web_home_probe_(session_proven|decision_session_unproven)|profile_(control_(present|visible)|signal|widget)|safe_url|initial_safe_url|library_fetch_(received_count(_capped)?|transformed_count(_capped)?|proof|page_signal)|real_library_.*count_capped|raw_library_item_count_capped|real_home_.*count_capped|native_home_rows_count_capped)=' "$observer_output"; then
            echo "::error::Authenticated-home observer emitted a forbidden session, URL, profile, or private-content diagnostic."
            exit 1
          fi
          sample_count="$(sed -n 's/^INSTRUMENTATION_STATUS: probe_sample_count_capped=//p' "$observer_output" | tail -n 1 | grep -E '^[0-9]{1,4}$' || true)"
          [[ "$sample_count" =~ ^[0-9]+$ ]] && (( sample_count > 0 )) || {
            echo "::error::Authenticated-home observer returned no bounded WebView diagnostics."
            exit 1
          }
          fatal_count="$(adb logcat -d -t 1500 -b main -b system -b crash 2>/dev/null | grep -cE 'FATAL EXCEPTION|ANR in com[.]melodix[.]music[.]preview([.]test)?' || true)"
          [[ "$fatal_count" == "0" ]] || { echo "::error::Android reported a crash or ANR during observer self-test (count=$fatal_count)."; exit 1; }
          {
            echo "### Passive authenticated-home observer self-test (CI, unauthenticated)"
            echo "- Runner exit: $observer_exit; observer deadline reached: true; timeout: 30000 ms"
            echo "- Authenticated Spotify Home: not tested (clean CI uses no account data)"
            echo "- Samples: $sample_count; lifecycle callback unregister: true; Window.Callback restored: true; crash/ANR count: $fatal_count"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Authenticated-home observer self-test::result=normal_timeout; timeout_ms=30000; samples=$sample_count; content_observed=false; lifecycle_callback_unregistered=true; window_callback_restored=true; fatal_or_anr_count=$fatal_count; authenticated_home_test=not_performed"

      - name: Verify activity resumed after Android instrumentation
        id: post-instrumentation
        if: always() && steps.launch.outcome == 'success'
        shell: bash
        env:
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          PACKAGE_ID: ${{ steps.apk.outputs.package_id }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/melodix-preview-emulator-state"
          preview_relaunched=false
          sleep 2
          resumed_before_relaunch="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep -F 'com.melodix.music.preview/com.melodix.music.MainActivity' | head -n 1 || true)"
          pre_relaunch_resumed=false
          if [[ -n "$resumed_before_relaunch" ]]; then pre_relaunch_resumed=true; fi
          target_pid_after_finish="$(adb shell pidof -s com.melodix.music.preview 2>/dev/null | tr -d '\r' || true)"

          if [[ "$INTEGRATION_OUTCOME" == "success" ]]; then
            # Instrumentation.finish() terminates the instrumented process by
            # Android contract. Preserve the native empty-Home error/retry state,
            # and isolated Web Home renderer fixture before that process stops.
            for evidence in \
                files/melodix-preview-home-empty.xml \
                files/melodix-preview-home-native-error.png \
                files/melodix-preview-home-status.xml \
                files/melodix-preview-home-status.png \
                files/melodix-preview-web-home-app.xml \
                files/melodix-preview-web-home-app.png; do
              adb shell run-as com.melodix.music.preview test -s "$evidence" || {
                echo "::error title=Android UI evidence::Instrumentation did not save a required hierarchy/screenshot before finish: $evidence"
                exit 1
              }
            done
            adb exec-out run-as com.melodix.music.preview cat files/melodix-preview-home-empty.xml > "$state_dir/home-empty-native-error-window.xml"
            adb exec-out run-as com.melodix.music.preview cat files/melodix-preview-home-native-error.png > "$state_dir/home-empty-native-error.png"
            adb exec-out run-as com.melodix.music.preview cat files/melodix-preview-home-status.xml > "$state_dir/home-status-window.xml"
            adb exec-out run-as com.melodix.music.preview cat files/melodix-preview-home-status.png > "$state_dir/home-status.png"
            adb exec-out run-as com.melodix.music.preview cat files/melodix-preview-web-home-app.xml > "$state_dir/web-home-app-window.xml"
            adb exec-out run-as com.melodix.music.preview cat files/melodix-preview-web-home-app.png > "$state_dir/web-home-app.png"
            [[ -s "$state_dir/home-empty-native-error-window.xml" && -s "$state_dir/home-empty-native-error.png" \
                && -s "$state_dir/home-status-window.xml" && -s "$state_dir/home-status.png" \
                && -s "$state_dir/web-home-app-window.xml" && -s "$state_dir/web-home-app.png" ]] || {
              echo "::error title=Android UI evidence::Saved hierarchy or screenshot could not be retrieved from the emulator."
              exit 1
            }
            for timeline_phase in cold_home empty_home; do
              for checkpoint in 200ms 1s 3s 8s 20s; do
                evidence="files/melodix-preview-${timeline_phase}-${checkpoint}"
                target_prefix="${timeline_phase//_/-}-timeline-${checkpoint}"
                adb shell run-as com.melodix.music.preview test -s "${evidence}.xml" && \
                  adb shell run-as com.melodix.music.preview test -s "${evidence}.png" || {
                    echo "::error title=Android Home owner timeline::Required native timeline evidence is missing: ${timeline_phase}/${checkpoint}"
                    exit 1
                  }
                adb exec-out run-as com.melodix.music.preview cat "${evidence}.xml" > "$state_dir/${target_prefix}-window.xml"
                adb exec-out run-as com.melodix.music.preview cat "${evidence}.png" > "$state_dir/${target_prefix}.png"
                [[ -s "$state_dir/${target_prefix}-window.xml" && -s "$state_dir/${target_prefix}.png" ]] || {
                  echo "::error title=Android Home owner timeline::Could not retrieve native timeline evidence: ${timeline_phase}/${checkpoint}"
                  exit 1
                }
              done
            done
            for route_snapshot in home search library detail detail_return player player_return late_callback_watchdog; do
              file_route="${route_snapshot//_/-}"
              evidence="files/melodix-preview-native-route-${file_route}"
              target_prefix="native-route-${file_route}"
              adb shell run-as com.melodix.music.preview test -s "${evidence}.xml" && \
                adb shell run-as com.melodix.music.preview test -s "${evidence}.png" || {
                  echo "::error title=Android native route owner::Required route evidence is missing: ${route_snapshot}"
                  exit 1
                }
              adb exec-out run-as com.melodix.music.preview cat "${evidence}.xml" > "$state_dir/${target_prefix}-window.xml"
              adb exec-out run-as com.melodix.music.preview cat "${evidence}.png" > "$state_dir/${target_prefix}.png"
              [[ -s "$state_dir/${target_prefix}-window.xml" && -s "$state_dir/${target_prefix}.png" ]] || {
                echo "::error title=Android native route owner::Could not retrieve route evidence: ${route_snapshot}"
                exit 1
              }
            done
            adb shell run-as com.melodix.music.preview rm -f \
              files/melodix-preview-home-empty.xml \
              files/melodix-preview-home-native-error.png \
              files/melodix-preview-home-status.xml \
              files/melodix-preview-home-status.png \
              files/melodix-preview-web-home-app.xml \
              files/melodix-preview-web-home-app.png \
              files/melodix-preview-cold_home-* \
              files/melodix-preview-empty_home-* \
              files/melodix-preview-native-route-*
          fi

          if [[ -z "$resumed_before_relaunch" ]]; then
            echo "MainActivity was not resumed after instrumentation (harness=$INTEGRATION_OUTCOME); relaunching the same installed Preview package before the post-instrumentation resume check."
            adb shell am start -W -n com.melodix.music.preview/com.melodix.music.MainActivity \
              > "$RUNNER_TEMP/melodix-post-instrumentation-launch.txt" 2>&1
            preview_relaunched=true
            resumed_after_instrumentation=""
            for _ in $(seq 1 60); do
              resumed_after_instrumentation="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep -F 'com.melodix.music.preview/com.melodix.music.MainActivity' | head -n 1 || true)"
              if [[ -n "$resumed_after_instrumentation" ]]; then break; fi
              sleep 1
            done
          else
            resumed_after_instrumentation="$resumed_before_relaunch"
          fi

          if [[ -z "$resumed_after_instrumentation" ]]; then
            resumed_state="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | head -n 1 | tr -cd 'A-Za-z0-9_.:/@ -' | cut -c1-300 || true)"
            focus_state="$(adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | head -n 1 | tr -cd 'A-Za-z0-9_.:/@ -' | cut -c1-300 || true)"
            echo "::error title=Post-instrumentation activity::MainActivity was not resumed after instrumentation and permitted relaunch; resumed=${resumed_state:-none}; focus=${focus_state:-none}; harness=$INTEGRATION_OUTCOME; relaunched=$preview_relaunched"
            exit 1
          fi
          resumed_process="$(adb shell pidof -s com.melodix.music.preview 2>/dev/null | tr -d '\r' || true)"
          [[ -n "$resumed_process" ]] || { echo "::error::Preview process exited after the post-instrumentation resume check."; exit 1; }
          echo "activity_resumed=true" >> "$GITHUB_OUTPUT"
          echo "preview_relaunched=$preview_relaunched" >> "$GITHUB_OUTPUT"
          echo "Verified Preview MainActivity resumed after instrumentation (pre_relaunch_resumed=$pre_relaunch_resumed; relaunched=$preview_relaunched; pid=$resumed_process; harness=$INTEGRATION_OUTCOME)."
          echo "::notice title=Post-instrumentation activity::activity_resumed=true; preview_relaunched=$preview_relaunched; target_pid_after_finish=${target_pid_after_finish:-none}; harness_outcome=$INTEGRATION_OUTCOME"

          if [[ "$INTEGRATION_OUTCOME" != "success" ]]; then
            echo "::notice title=Post-instrumentation activity::empty_home_and_home_status_pixels_not_verified=true; harness_outcome=$INTEGRATION_OUTCOME"
            exit 0
          fi

          inspection_failed=false
          timeline_inspection_failed=false
          if python3 tests/android/inspect_hierarchy.py web-home \
              "$state_dir/web-home-app-window.xml" \
              "$state_dir/web-home-app.png" \
              "$state_dir/web-home-app-hierarchy-redacted.json"; then
            echo "web_home_renderer_pixels_verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_home_renderer_pixels_verified=false" >> "$GITHUB_OUTPUT"
            inspection_failed=true
          fi
          if python3 tests/android/inspect_hierarchy.py home-status \
              "$state_dir/home-status-window.xml" \
              "$state_dir/home-status.png" \
              "$state_dir/home-status-hierarchy-redacted.json"; then
            echo "home_status_pixels_verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "home_status_pixels_verified=false" >> "$GITHUB_OUTPUT"
            inspection_failed=true
          fi
          if python3 tests/android/inspect_hierarchy.py empty-home \
              "$state_dir/home-empty-native-error-window.xml" \
              "$state_dir/home-empty-native-error.png" \
              "$state_dir/home-empty-native-error-hierarchy-redacted.json"; then
            echo "empty_home_pixels_verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty_home_pixels_verified=false" >> "$GITHUB_OUTPUT"
            inspection_failed=true
          fi
          for timeline_phase in cold_home empty_home; do
            for checkpoint in 200ms 1s 3s 8s 20s; do
              target_prefix="${timeline_phase//_/-}-timeline-${checkpoint}"
              hierarchy="${target_prefix}-window.xml"
              screenshot="$target_prefix.png"
              redacted="${target_prefix}-hierarchy-redacted.json"
              inspector_phase=home-status
              if [[ "$timeline_phase" == "empty_home" ]]; then inspector_phase=empty-home; fi
              if python3 tests/android/inspect_hierarchy.py "$inspector_phase" \
                  "$state_dir/$hierarchy" \
                  "$state_dir/$screenshot" \
                  "$state_dir/$redacted"; then
                echo "${timeline_phase}_timeline_${checkpoint}_pixels_verified=true" >> "$GITHUB_OUTPUT"
              else
                echo "${timeline_phase}_timeline_${checkpoint}_pixels_verified=false" >> "$GITHUB_OUTPUT"
                timeline_inspection_failed=true
                inspection_failed=true
              fi
            done
          done
          route_inspection_failed=false
          for route_snapshot in home search library detail detail-return player player-return late-callback-watchdog; do
            target_prefix="native-route-${route_snapshot}"
            if python3 tests/android/inspect_hierarchy.py native-route \
                "$state_dir/${target_prefix}-window.xml" \
                "$state_dir/${target_prefix}.png" \
                "$state_dir/${target_prefix}-hierarchy-redacted.json"; then
              echo "native_route_${route_snapshot//-/_}_pixels_verified=true" >> "$GITHUB_OUTPUT"
            else
              echo "native_route_${route_snapshot//-/_}_pixels_verified=false" >> "$GITHUB_OUTPUT"
              route_inspection_failed=true
              inspection_failed=true
            fi
          done
          [[ "$timeline_inspection_failed" == "false" ]] && timeline_pixels_verified=true || timeline_pixels_verified=false
          [[ "$route_inspection_failed" == "false" ]] && route_pixels_verified=true || route_pixels_verified=false
          echo "native_home_owner_timeline_pixels_verified=$timeline_pixels_verified" >> "$GITHUB_OUTPUT"
          echo "native_route_matrix_pixels_verified=$route_pixels_verified" >> "$GITHUB_OUTPUT"
          rm -f "$state_dir/home-empty-native-error-window.xml" "$state_dir/home-status-window.xml" "$state_dir/web-home-app-window.xml"
          rm -f "$state_dir/cold-home-timeline-"*-window.xml "$state_dir/empty-home-timeline-"*-window.xml
          rm -f "$state_dir"/native-route-*-window.xml
          cp "${{ steps.apk.outputs.asset_manifest }}" "$state_dir/assets-manifest.json"
          [[ "$inspection_failed" == "false" ]] || exit 1

      - name: Inspect the preserved cold-launch hierarchy and pixels
        id: cold-launch-inspection
        if: always() && steps.launch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/melodix-preview-emulator-state"
          python3 tests/android/inspect_hierarchy.py home-status \
            "$state_dir/cold-home-window.xml" \
            "$state_dir/cold-home-screen.png" \
            "$state_dir/cold-home-hierarchy-redacted.json"

      - name: Install and cold-launch the exact non-debuggable release candidate
        id: release-candidate-smoke
        if: steps.launch.outcome == 'success' && steps.integration.outcome == 'success' && steps.post-instrumentation.outcome == 'success' && steps.cold-launch-inspection.outcome == 'success' && steps.release-candidate.outcome == 'success'
        shell: bash
        env:
          RELEASE_APK: ${{ steps.release-candidate.outputs.apk }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          release_smoke_failure_diagnostics() {
            local exit_code=$?
            (( exit_code != 0 )) || return 0
            set +e
            local host_available_kib
            local android_processes
            local adb_devices
            local device_booted
            local app_pid
            local fatal_or_anr_count
            host_available_kib="$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo 2>/dev/null || true)"
            android_processes="$(ps -eo comm=,rss=,stat= 2>/dev/null | awk '$1 ~ /^(emulator|qemu|adb)/ {printf "%s:%s:%s,", $1, $2, $3}' | cut -c1-300)"
            adb_devices="$(timeout 10s adb devices 2>/dev/null | awk 'NR > 1 && NF >= 2 {printf "%s:%s,", $1, $2}')"
            device_booted="$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            app_pid="$(timeout 10s adb shell pidof -s com.melodix.music.preview 2>/dev/null | tr -d '\r' || true)"
            fatal_or_anr_count="$(timeout 15s adb logcat -d -t 2000 -b main -b system -b crash 2>/dev/null | grep -cE 'FATAL EXCEPTION|ANR in com\.melodix\.music\.preview|lowmemorykiller|lmkd|Killing .*com\.melodix\.music\.preview' || true)"
            echo "::notice title=Release candidate smoke failure diagnostics::exit=$exit_code; host_available_kib=${host_available_kib:-unknown}; android_processes=${android_processes:-none}; adb_devices=${adb_devices:-none}; device_boot_completed=${device_booted:-unknown}; app_pid=${app_pid:-none}; fatal_or_anr_log_count=${fatal_or_anr_count:-unknown}"
          }
          trap release_smoke_failure_diagnostics EXIT
          state_dir="$RUNNER_TEMP/melodix-preview-emulator-state"
          adb shell am force-stop com.melodix.music.preview >/dev/null 2>&1 || true
          adb uninstall com.melodix.music.preview >/dev/null 2>&1 || true
          adb install "$RELEASE_APK"
          adb shell pm clear com.melodix.music.preview >/dev/null
          adb shell pm grant com.melodix.music.preview android.permission.BLUETOOTH_CONNECT
          adb shell am start -W -n com.melodix.music.preview/com.melodix.music.MainActivity \
            > "$state_dir/release-candidate-launch.txt" 2>&1
          # `am start -W` already waits for activity launch; settle briefly before checking that the exact non-debuggable process remains alive.
          sleep 15
          app_pid="$(adb shell pidof -s com.melodix.music.preview 2>/dev/null | tr -d '\r' || true)"
          [[ -n "$app_pid" ]] || { echo "::error title=Release candidate process not alive::The exact non-debuggable APK exited after launch."; exit 1; }
          resumed="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep -F 'com.melodix.music.preview/com.melodix.music.MainActivity' | head -n 1 || true)"
          [[ -n "$resumed" ]] || { echo "::error title=Release candidate not resumed::The exact non-debuggable APK did not leave MainActivity resumed."; exit 1; }
          adb shell uiautomator dump --compressed /sdcard/melodix-release-candidate.xml >/dev/null 2>&1
          adb exec-out cat /sdcard/melodix-release-candidate.xml > "$state_dir/release-candidate-window.xml"
          adb exec-out screencap -p > "$state_dir/release-candidate-screen.png"
          python3 tests/android/inspect_hierarchy.py home-status \
            "$state_dir/release-candidate-window.xml" \
            "$state_dir/release-candidate-screen.png" \
            "$state_dir/release-candidate-hierarchy-redacted.json"
          echo "apk_sha256=${{ steps.release-candidate.outputs.apk_sha256 }}" >> "$GITHUB_OUTPUT"
          echo "activity_resumed=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=Exact release candidate installed and launched::source=$SOURCE_REF; debuggable=false; process_alive=true; activity_resumed=true; authenticated_home_not_tested=true"

      - name: Add verified run details to the summary
        if: always()
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
          PREVIEW_RUN_ID: ${{ github.run_id }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
          PACKAGE_ID: ${{ steps.apk.outputs.package_id }}
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          APK_DEBUGGABLE: ${{ steps.apk.outputs.target_debuggable }}
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
          POST_INSTRUMENTATION_OUTCOME: ${{ steps.post-instrumentation.outcome }}
          ACTIVITY_RESUMED: ${{ steps.post-instrumentation.outputs.activity_resumed }}
          PREVIEW_RELAUNCHED: ${{ steps.post-instrumentation.outputs.preview_relaunched }}
          EMPTY_HOME_PIXELS_VERIFIED: ${{ steps.post-instrumentation.outputs.empty_home_pixels_verified }}
          HOME_STATUS_PIXELS_VERIFIED: ${{ steps.post-instrumentation.outputs.home_status_pixels_verified }}
          NATIVE_HOME_TIMELINE_PIXELS_VERIFIED: ${{ steps.post-instrumentation.outputs.native_home_owner_timeline_pixels_verified }}
          NATIVE_ROUTE_MATRIX_PIXELS_VERIFIED: ${{ steps.post-instrumentation.outputs.native_route_matrix_pixels_verified }}
          WEB_HOME_PIXELS_VERIFIED: ${{ steps.post-instrumentation.outputs.web_home_renderer_pixels_verified }}
          COLD_LAUNCH_OUTCOME: ${{ steps.cold-launch-inspection.outcome }}
          RELEASE_APK_SHA256: ${{ steps.release-candidate.outputs.apk_sha256 }}
          RELEASE_VERSION_CODE: ${{ steps.release-candidate.outputs.version_code }}
          RELEASE_VERSION_NAME: ${{ steps.release-candidate.outputs.version_name }}
          RELEASE_DEBUGGABLE: ${{ steps.release-candidate.outputs.target_debuggable }}
          RELEASE_SMOKE_OUTCOME: ${{ steps.release-candidate-smoke.outcome }}
          RELEASE_ACTIVITY_RESUMED: ${{ steps.release-candidate-smoke.outputs.activity_resumed }}
          CSS_SOURCE_SHA256: ${{ steps.release-candidate.outputs.css_source_sha256 }}
          CSS_APK_SHA256: ${{ steps.release-candidate.outputs.css_apk_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.2.2-test.96-preview' }}
          PUBLISH_PREVIEW: ${{ inputs.publish_preview || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[preview-release] v1.2.2-test.96-preview')) }}
        run: |
          state_dir="$RUNNER_TEMP/melodix-preview-emulator-state"
          browser_compatibility_warning=not_confirmed
          user_agent_profile_coherent=not_confirmed
          webview_chrome_major=unknown
          configured_ua_chrome_major=unknown
          harness_failure_phase=none
          harness_failure_type=none
          mobile_viewport_matrix_complete=not_run
