              echo "::error title=PID death at $step_label::before=$pid_before_sec after=$cur_pid trace=$diag"
              exit 1
            fi
          }
          pid_before_sec="$(adb shell pidof "$pkg" | tr -d '\r' | awk '{print $1}')"
          adb shell "am start -n '$pkg/com.melodix.music.MainActivity' --es spotify_uri \"spotify:track:1');window.__pwned=1;//\"" >/dev/null
