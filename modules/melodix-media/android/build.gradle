apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.melodixmedia'
version = '0.1.0'

buildscript {
  def expoModulesCoreVersion = new File(["node", "--print", "require('expo-modules-core/package.json').version"].execute(null, rootDir).text.trim())

  // Simple helper that allows the root project to override versions declared
  // in this build.gradle — convention officielle des modules locaux Expo.
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }

  // Branche Expo Modules Core (autolinking SDK 51).
  apply from: new File(["node", "--print", "require.resolve('expo-modules-core/package.json')"].execute(null, rootDir).text.trim(), "../android/ExpoModulesCorePlugin.gradle")
  apply plugin: 'expo-module-gradle-plugin'

  repositories {
    mavenCentral()
  }

  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet("kotlinVersion", "1.9.23")}")
  }
}

expoModule {
  coreFeatures = []
}

android {
  namespace "expo.modules.melodixmedia"
  compileSdkVersion safeExtGet("compileSdkVersion", 34)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 23)
    targetSdkVersion safeExtGet("targetSdkVersion", 34)
  }

  lintOptions {
    abortOnError false
  }

  // Tests JVM unitaires (phase 5B) : le player virtuel est testable sans
  // appareil grâce à Robolectric (Looper/Handlers shadowés).
  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }
}

dependencies {
  // Expo Modules Core (Kotlin/JSI) — injecté par l'autolinking Expo.
  implementation project(':expo-modules-core')

  // AndroidX Media3 : MediaSession + MediaSessionService officiels.
  // NE JOUE AUCUN AUDIO : un "player virtuel" projette l'état de melodixPlayer.
  implementation "androidx.media3:media3-common:${safeExtGet('media3Version', '1.3.1')}"
  implementation "androidx.media3:media3-session:${safeExtGet('media3Version', '1.3.1')}"

  // Tests unitaires JVM (VirtualMediaPlayerTest) — exécutés par Gradle.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.12.2'
}
