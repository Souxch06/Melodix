apply plugin: 'com.android.library'

group = 'expo.modules.melodixmedia'
version = '0.1.0'

// Expo Modules Core (autolinking SDK 51) — schéma OFFICIEL des modules
// d'application (cf. expo-keep-awake/android/build.gradle) : le plugin
// 'expo-module-gradle-plugin' est un artefact des modules AUTONOMES
// (create-expo-module) et n'existe pas dans le build d'une app.
def expoModulesCorePlugin = new File(
    project(":expo-modules-core").projectDir.absolutePath,
    "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.melodixmedia"

  lintOptions {
    abortOnError false
  }

  // Tests JVM unitaires (phase 5B) : le player virtuel est testable sans
  // appareil grâce à Robolectric (Looper/Handlers shadowés).
  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }
}

dependencies {
  // AndroidX Media3 : MediaSession + MediaSessionService officiels.
  // NE JOUE AUCUN AUDIO : un "player virtuel" projette l'état de melodixPlayer.
  implementation "androidx.media3:media3-common:${safeExtGet('media3Version', '1.3.1')}"
  implementation "androidx.media3:media3-session:${safeExtGet('media3Version', '1.3.1')}"

  // Phase 5C : pochette HTTP des notifications — DataSourceBitmapLoader
  // (la session l'utilise côté RUNTIME, mais ses classes sont 'implementation'
  //  chez média3 ⇒ non exposées en compilation : dépendance EXPLICITE requise).
  implementation "androidx.media3:media3-datasource:${safeExtGet('media3Version', '1.3.1')}"

  // Tests unitaires JVM (VirtualMediaPlayerTest) — exécutés par Gradle.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.12.2'
}
