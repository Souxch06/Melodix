// Build du module local Melodix Media (Expo Modules API).
//
// IMPORTANT — forme « module intégré à une app » (comme expo-file-system,
// voir node_modules/expo-file-system/android/build.gradle) : PAS de plugin
// 'expo-module-gradle-plugin' (celui-ci est pour les modules publiés/seuls :
// absent du settings.gradle généré par prebuild → 'Plugin with id
// expo-module-gradle-plugin not found' au build CI). Le noyau s'applique via
// ExpoModulesCorePlugin.gradle fourni par expo-modules-core.
apply plugin: 'com.android.library'

group = 'expo.modules.melodixmedia'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.melodixmedia"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_11
    targetCompatibility JavaVersion.VERSION_11
  }
  testOptions {
    unitTests {
      // Robolectric : accès aux ressources/manifest réels en tests JVM.
      includeAndroidResources = true
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // Media3 — moteur MediaSessionService natif (notification + player latéral).
  implementation("androidx.media3:media3-exoplayer:1.4.1")
  implementation("androidx.media3:media3-session:1.4.1")
  implementation("androidx.media3:media3-ui:1.4.1")

  // Guava 5C.2 — épinglage de la VARIANTE ANDROID exacte attendue par
  // media3 1.4.1 + ses artefacts de linkage. Sans ces pins, une résolution
  // Gradle défavorable (variante JRE / failureaccess absent) provoque un
  // NoClassDefFoundError/NoSuchMethodError AU PREMIER appel guava
  // (ImmutableList/Futures) — c'est-à-dire au premier Play, exactement au
  // démarrage de la MediaSession. Déclaration standard des apps média3.
  implementation("com.google.guava:guava:31.1-android")
  implementation("com.google.guava:failureaccess:1.0.1")
  implementation("com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava")

  // Tests unitaires JVM (Robolectric, SDK 34 — stubs Android réels).
  // AUCUN impact sur l'AAB/l'APK : scope testImplementation uniquement.
  testImplementation("junit:junit:4.13.2")
  testImplementation("org.robolectric:robolectric:4.12.2")
}
